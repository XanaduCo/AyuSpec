name: Deploy spec site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN permissions for actions/deploy-pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: pip install -r requirements.txt

      # Compiles and validates seed/graph.json (and seed.sql). Exits non-zero on
      # a graph-validation error, so a bad edge fails the build. Must run before
      # the app build, which imports seed/graph.json.
      - name: Compile healthspan graph
        working-directory: prototype
        run: node build.mjs

      # Builds the React demo to docs/demo/index.html, which MkDocs then serves
      # at /demo/. Must run before mkdocs: the nav entry points at that file and
      # --strict fails if it is missing.
      - name: Build demo app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build spec site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pull requests build only — they verify the graph and the docs without publishing.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
