name: Deploy spec site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN permissions for actions/deploy-pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements.txt

      # Regenerates seed/graph.json, seed.sql and the demo at
      # docs/demo/index.html, which MkDocs then picks up as a
      # static page. Must run before mkdocs: the nav entry points at that file,
      # and --strict fails if it is missing. Exits non-zero on a graph-validation
      # error, so a bad edge fails the build instead of shipping a broken explorer.
      - name: Build healthspan graph and explorer
        working-directory: prototype
        run: node build.mjs

      - name: Build spec site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pull requests build only — they verify the graph and the docs without publishing.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
