site_name: ayuOS
site_description: Open-source personal health agent — specification and architecture
site_url: https://xanaduCo.github.io/AyuSpec

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Vision & Problem: vision.md
  - Decisions (ADRs):
    - Overview: adr/index.md
    - "ADR-0001: EHR ingestion": adr/0001-ehr-ingestion.md
    - "ADR-0002: Clinical data store": adr/0002-clinical-data-store.md
  - Service Evaluations:
    - Overview: evaluations/index.md
    - Medplum: evaluations/medplum.md
    - Roll your own (FHIR on Postgres): evaluations/roll-your-own.md
    - Blaze: evaluations/blaze.md
    - HAPI FHIR: evaluations/hapi-fhir.md
    - Aidbox: evaluations/aidbox.md
    - Rejected FHIR servers: evaluations/rejected-fhir-servers.md
    - FHIR libraries: evaluations/fhir-libraries.md
    - Apple Health: evaluations/apple-health.md
    - Epic direct: evaluations/epic-direct.md
    - Fasten (Onprem + Connect): evaluations/fasten.md
    - Oracle Health / Cerner: evaluations/oracle-cerner.md
    - Open Wearables vs Terra: evaluations/open-wearables-vs-terra.md
  - Architecture Overview: architecture.md
  - Open Wearables: open-wearables.md
  - Data Capture Strategy: data-capture.md
  - Ingestion:
    - Overview: ingestion/index.md
    - Wearables: ingestion/wearables.md
    - Apple Health: ingestion/apple-health.md
    - EHR (Fasten fork): ingestion/ehr.md
    - Lab PDFs: ingestion/labs.md
    - Imaging (DICOM): ingestion/imaging.md
    - Genomics: ingestion/genomics.md
  - Storage: storage.md
  - AI & ML Layer: ai-ml.md
  - Model Providers: model-providers.md
  - Agent Loop: agent-loop.md
  - Evidence & Hypotheses: evidence.md
  - Experimentation & Validation: experimentation.md
  - PII Gateway & Cloud Escalation: pii-gateway.md
  - Frontend & UI: frontend.md
  - Data Sharing & Consent: sharing.md
  - Security & Privacy: security.md
  - Deployment & Infrastructure: deployment.md
  - Federated Analytics: federation.md
  - Governance & Stewardship: governance.md
  - External Dependencies: external-deps.md
