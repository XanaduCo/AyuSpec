<style>
:root {
  --bg:#fbfaf8; --panel:#fff; --ink:#1a1a1a; --mute:#6b6b6b; --line:#e5e2dd;

}

    --accent:#4ec9bd; --accent-soft:#12312e;

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-.01em; }
header { padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel);
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
header h1 { font-size:16px; }
header .sub { color:var(--mute); font-size:13px; }
.layout { display:grid; grid-template-columns:310px 1fr; gap:0; align-items:start; }
@media (max-width:900px){ .layout{ grid-template-columns:1fr; } }
aside { border-right:1px solid var(--line); padding:18px; position:sticky; top:57px;
  max-height:calc(100vh - 57px); overflow:auto; background:var(--panel); }
main { padding:22px 26px 90px; min-width:0; }
.lbl { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--mute);
  font-weight:600; margin:0 0 8px; }
input[type=search] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); color:var(--ink); font-size:14px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
  font-size:12.5px; font-weight:500; cursor:pointer; }
.chip.redflag { background:var(--block-soft); color:var(--block); }
.chip button { all:unset; font-size:14px; line-height:1; opacity:.6; }
.chip button:hover { opacity:1; }
.suggest { max-height:290px; overflow:auto; margin-top:8px; border-top:1px solid var(--line); }
.sug { padding:7px 4px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px; }
.sug:hover { background:var(--accent-soft); }
.sug .cat { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
.preset { display:block; width:100%; text-align:left; margin:5px 0; padding:8px 10px; font-size:13px;
  border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); cursor:pointer; }
.preset:hover { border-color:var(--accent); color:var(--accent); }
nav.systems { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }

nav.systems button[aria-pressed=true], .fn-tab[aria-pressed=true] {
  background:var(--accent); border-color:var(--accent); color:#fff; }
.fns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
.banner { border:1px solid var(--block); background:var(--block-soft); color:var(--block);
  padding:14px 16px; border-radius:10px; margin-bottom:20px; }
.banner h3 { font-size:14px; margin-bottom:5px; }
.banner p { margin:4px 0 0; font-size:13.5px; color:var(--ink); }
.tier { margin:22px 0 10px; display:flex; align-items:baseline; gap:9px; }
.tier h3 { font-size:13px; }
.tier span { font-size:12.5px; color:var(--mute); }
.card { border:1px solid var(--line); border-left-width:3px; border-radius:10px; background:var(--panel);
  padding:14px 16px; margin-bottom:10px; }
.card.available { border-left-color:var(--ok); }
.card.adjusted { border-left-color:var(--adj); }
.card.cautioned { border-left-color:var(--caution); }
.card.sequenced { border-left-color:var(--seq); }
.card.blocked { border-left-color:var(--block); opacity:.94; }
.card h4 { margin:0; font-size:15px; font-weight:600; display:flex; align-items:center;
  gap:9px; flex-wrap:wrap; }
.state { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  padding:2px 7px; border-radius:5px; }
.state.available{background:var(--ok-soft);color:var(--ok)} .state.adjusted{background:var(--adj-soft);color:var(--adj)}
.state.cautioned{background:var(--caution-soft);color:var(--caution)} .state.sequenced{background:var(--seq-soft);color:var(--seq)}
.state.blocked{background:var(--block-soft);color:var(--block)}
.moved { font-size:11.5px; color:var(--accent); font-weight:500; }
.summary { color:var(--mute); font-size:13.5px; margin:7px 0 0; }
.axes { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
.ax { font-size:11.5px; border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--mute); }
.ax b { color:var(--ink); font-weight:600; }
.ax.hole { border-style:dashed; color:var(--block); }
details { margin-top:11px; }
summary { cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:500; }
.trail { margin:10px 0 0; padding:0; list-style:none; border-left:2px solid var(--line); }
.trail li { padding:8px 0 8px 13px; margin-left:1px; font-size:13.5px; }
.trail .who { font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
.trail .who.BLOCKS{color:var(--block)} .trail .who.REQUIRES{color:var(--seq)}
.trail .who.ADJUSTS{color:var(--adj)} .trail .who.CAUTIONS{color:var(--caution)} .trail .who.ELEVATES{color:var(--accent)}
.cite { font-size:11.5px; color:var(--mute); margin-top:5px; }
.subs { margin-top:10px; font-size:13px; }
.subs b { font-weight:600; }
.markers { margin-top:34px; border-top:1px solid var(--line); padding-top:18px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--mute); padding:6px 8px; border-bottom:1px solid var(--line); }
td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.tierbadge { display:inline-block; width:19px; height:19px; line-height:19px; text-align:center;
  border-radius:5px; font-weight:700; font-size:11.5px; }
.tierbadge.A{background:var(--ok-soft);color:var(--ok)} .tierbadge.B{background:var(--adj-soft);color:var(--adj)}
.tierbadge.C{background:var(--caution-soft);color:var(--caution)} .tierbadge.D{background:var(--block-soft);color:var(--block)}
.empty { color:var(--mute); font-size:13.5px; padding:18px 0; }
.note { font-size:12.5px; color:var(--mute); margin-top:6px; }
.attia { font-size:12.5px; background:var(--caution-soft); color:var(--ink); border-radius:7px;
  padding:8px 10px; margin-top:10px; border:1px solid var(--caution); }
.attia b { color:var(--caution); }

<script>
const GRAPH = {"nodes":[{"id":"sys-cardiovascular","type":"System","title":"Cardiovascular","summary":"The heart, vasculature and the oxygen-delivery chain that supports every other system; the site of the first Horseman, atherosclerotic cardiovascular disease.","attrs":{"navigation_order":1,"horseman":"atherosclerotic cardiovascular disease","why_it_leads":"ASCVD is the largest single cause of death in most high-income populations, and its drivers are measurable and modifiable decades before an event."},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease","Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality","Attia, Outlive (2023), ch. 7 — the first Horseman — author framing"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"sys-metabolic","type":"System","title":"Metabolic","summary":"Fuel handling across liver, muscle and adipose tissue: how well the body partitions glucose and lipid, and how early it starts failing to.","attrs":{"navigation_order":2,"horseman":"metabolic dysfunction (type 2 diabetes and the insulin-resistance spectrum)","why_it_leads":"Metabolic dysfunction is upstream of the other three Horsemen — it raises ASCVD, cancer and dementia risk, so it is the highest-leverage system to defend early."},"citations":["ADA Standards of Care in Diabetes 2025","Tabák et al. Lancet 2009 — Whitehall II insulin and glucose trajectories before diabetes","Attia, Outlive (2023), ch. 6 — metabolic dysfunction as the upstream Horseman — author framing"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity","type":"Function","title":"Aerobic capacity","summary":"The maximum rate at which the body can take up and use oxygen — the ceiling on sustained physical work, and one of the strongest measured predictors of all-cause mortality.","attrs":{"declines_with_age":"roughly 10 percent per decade untrained, closer to 5 percent per decade with maintained training","peak_relevance":"determines the reserve available for the Centenarian Decathlon tasks at 80–90","backcasting_note":"Carrying a grandchild up stairs or hiking uneven ground at 85 requires an absolute VO2max floor; every decade of decline eats into it, so the target is set by working backwards from the task.","attia_position":"Attia treats VO2max as the single most important modifiable longevity variable and argues for training to an elite-for-age percentile rather than an average one.","consensus_note":"AHA endorses cardiorespiratory fitness as a clinical vital sign and the association with mortality is graded and robust; no guideline body specifies an elite-percentile target, and no trial has randomised people to a VO2max target with a mortality endpoint."},"citations":["Ross et al. Circulation 2016 — AHA statement on cardiorespiratory fitness as a clinical vital sign","Mandsager et al. JAMA Netw Open 2018 — cardiorespiratory fitness and long-term mortality","Kodama et al. JAMA 2009 — cardiorespiratory fitness and CVD/all-cause mortality meta-analysis","Attia, Outlive (2023), ch. 11–12 — VO2max and the Centenarian Decathlon — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health","type":"Function","title":"Vascular health","summary":"The condition of the arterial wall itself — endothelial function, compliance, and whether plaque is accumulating in it.","attrs":{"declines_with_age":"arterial stiffening and plaque burden accumulate continuously from early adulthood","what_failure_looks_like":"a coronary event that appears sudden but reflects thirty years of accumulation","note":"Distinguished from lipid transport deliberately: lipoprotein burden is the exposure, arterial disease is the accumulated damage. The graph keeps them separate so the UI can show a person with good lipids and existing plaque, which is common."},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease","Greenland et al. JACC 2018 — coronary artery calcium in risk assessment","Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport","type":"Function","title":"Lipoprotein transport","summary":"How many atherogenic particles circulate and for how long — the causal exposure that drives arterial plaque, best counted rather than weighed.","attrs":{"key_distinction":"ApoB counts particles; LDL-C measures the cholesterol carried inside them. The two disagree in a meaningful minority of people, and when they disagree the particle count tracks risk better.","cumulative_exposure":"Risk tracks the integral of particle-years, not the level at any one measurement — which is the argument for acting early rather than at the age guidelines start treating.","attia_position":"Attia argues for ApoB as the primary lipid target and for driving it well below guideline thresholds — often cited around 60 mg/dL or lower for anyone with meaningful risk, in people whom guidelines would not treat at all.","consensus_note":"ApoB as a superior risk marker is well supported and now appears in ESC/EAS and Canadian guidance as an alternative or preferred target. The very low absolute targets in primary prevention are an extrapolation from Mendelian randomisation and from secondary-prevention trials, not a directly tested threshold; the extrapolation is reasonable and remains untested at that level of aggression."},"citations":["Sniderman et al. JAMA Cardiol 2019 — ApoB, non-HDL-C and LDL-C discordance and risk","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias","Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality","Attia, Outlive (2023), ch. 7 — ApoB-centric lipid management — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency","type":"Function","title":"Cardiac efficiency","summary":"How much work the heart does per beat and how quickly it recovers — stroke volume, chronotropic reserve and autonomic balance.","attrs":{"declines_with_age":"maximal heart rate falls and ventricular compliance decreases, both of which cap cardiac output","training_note":"Sustained endurance training preserves ventricular compliance in a way that resistance work alone does not."},"citations":["Fletcher et al. Circulation 2013 — AHA exercise standards for testing and training","Wisløff et al. Circulation 2007 — aerobic interval training and cardiac remodelling","Ross et al. Circulation 2016 — AHA statement on cardiorespiratory fitness"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation","type":"Function","title":"Blood pressure regulation","summary":"Keeping arterial pressure in a range that does not progressively damage the vessels, kidneys and brain.","attrs":{"declines_with_age":"systolic pressure rises and pulse pressure widens as arteries stiffen","silent_damage":"Elevated pressure is asymptomatic for decades while it does its damage, which is why measurement rather than symptoms drives action."},"citations":["Whelton et al. 2017 ACC/AHA/AAPA Hypertension Guideline","SPRINT Research Group, NEJM 2015 — intensive versus standard blood pressure control","Muntner et al. Hypertension 2019 — AHA statement on blood pressure measurement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity","type":"Function","title":"Insulin sensitivity","summary":"How much insulin the body needs to move a given amount of glucose — the first thing to degrade on the road to type 2 diabetes, and the last thing routine bloodwork looks at.","attrs":{"declines_with_age":"largely a function of accumulated visceral fat, inactivity and muscle loss rather than age itself","early_warning":"Compensatory hyperinsulinaemia holds glucose normal for years before any glucose-based test moves, so a normal HbA1c does not rule out substantial resistance.","attia_position":"Attia treats fasting insulin and OGTT-with-insulin as routine early screening and argues most people are metabolically unhealthy long before a diagnosis is possible.","consensus_note":"The physiology of compensatory hyperinsulinaemia preceding dysglycaemia is well established. Fasting insulin has no agreed reference range, no assay standardisation across labs, and is not recommended for screening by ADA — so acting on a specific insulin number is a defensible personal choice with weak threshold evidence behind it."},"citations":["Tabák et al. Lancet 2009 — Whitehall II insulin and glucose trajectories before diabetes","ADA Standards of Care in Diabetes 2025 — classification and diagnosis","Matthews et al. Diabetologia 1985 — HOMA-IR","Attia, Outlive (2023), ch. 6 — early metabolic screening — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control","type":"Function","title":"Glycaemic control","summary":"Keeping blood glucose within a narrow band across the day, including after meals — not just the fasting number.","attrs":{"declines_with_age":"post-meal excursions widen before fasting glucose moves","postprandial_first":"The 2-hour post-load value is abnormal years before fasting glucose is, which is why an OGTT catches what a fasting panel misses."},"citations":["ADA Standards of Care in Diabetes 2025","Battelino et al. Diabetes Care 2019 — international consensus on time in range","Reynolds et al. Lancet 2019 — carbohydrate quality and health outcomes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition","type":"Function","title":"Body composition","summary":"The ratio and location of lean mass to fat mass — specifically how much fat sits viscerally and around the organs rather than subcutaneously.","attrs":{"declines_with_age":"lean mass falls and visceral fat rises even at stable body weight, the pattern sometimes called sarcopenic obesity","location_matters":"Visceral and ectopic fat drive metabolic risk; subcutaneous fat is comparatively inert, so BMI is a poor instrument here."},"citations":["Ross et al. Nat Rev Endocrinol 2020 — waist circumference consensus statement","Kaul et al. Obesity 2012 — DXA-derived visceral adipose tissue validation","Look AHEAD Research Group, NEJM 2013 — intensive lifestyle intervention"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health","type":"Function","title":"Liver health","summary":"Whether the liver is storing fat it should not be, and whether that has progressed to inflammation or fibrosis.","attrs":{"declines_with_age":"steatosis prevalence rises with visceral adiposity and alcohol exposure","naming_note":"Now termed MASLD (metabolic dysfunction-associated steatotic liver disease); older sources call it NAFLD.","reversibility_note":"Hepatic fat responds faster and more completely to energy restriction than almost any other metabolic marker — often within weeks."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Sterling et al. Hepatology 2006 — FIB-4 index","Lean et al. Lancet 2018 — DiRECT weight-management and remission"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function","type":"Function","title":"Mitochondrial function","summary":"The capacity of muscle mitochondria to oxidise fat and clear lactate — the engine behind both endurance and metabolic flexibility.","attrs":{"declines_with_age":"mitochondrial density and oxidative enzyme activity fall with inactivity more than with age per se","metabolic_flexibility":"Being able to switch cleanly between fat and carbohydrate as fuel; poor flexibility shows up as high lactate at low workloads.","attia_position":"Attia gives Zone 2 training a central and somewhat specific role in restoring mitochondrial function and metabolic flexibility, prescribing a substantial weekly volume of it.","consensus_note":"That endurance training increases mitochondrial density is old and solid physiology. The claim that the low-intensity zone is uniquely or optimally suited to this — rather than simply a well-tolerated way to accumulate volume — rests on mechanistic and small-sample work; higher intensities also drive mitochondrial adaptation, sometimes more per unit time."},"citations":["Holloszy & Coyle, J Appl Physiol 1984 — adaptations of skeletal muscle to endurance exercise","Granata et al. Sports Med 2018 — training intensity and mitochondrial adaptations","San-Millán & Brooks, Sports Med 2018 — lactate, metabolic flexibility and training zones","Attia, The Drive — Zone 2 training protocol — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-independent-mobility","type":"Outcome","title":"Independent mobility in late life","summary":"Being able to move yourself through the world unaided at 80 or 90 — stairs, kerbs, uneven ground, carrying things.","attrs":{"outcome_polarity":"protective","decathlon_framing":"This is the outcome that the Centenarian Decathlon backcasts from: pick the physical tasks you want at 90, work out the capacity they demand, and train for that number now.","example_tasks":["climb four flights carrying a bag","get off the floor unassisted","walk 3 km on uneven ground","lift a 10 kg case into an overhead bin"]},"citations":["2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Ross et al. Circulation 2016 — AHA statement on cardiorespiratory fitness","Attia, Outlive (2023), ch. 11 — the Centenarian Decathlon — author framing"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-freedom-from-ascvd","type":"Outcome","title":"Freedom from atherosclerotic cardiovascular disease","summary":"Reaching late life without a heart attack, stroke, or the disability that follows one.","attrs":{"outcome_polarity":"protective","horseman":"first"},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease","Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-freedom-from-t2d","type":"Outcome","title":"Freedom from type 2 diabetes","summary":"Never crossing into diabetes, or reverting from prediabetes rather than progressing.","attrs":{"outcome_polarity":"protective","horseman":"fourth","tractability":"Among the most demonstrably preventable endpoints in medicine: lifestyle intervention cut progression by about 58 percent over roughly three years in the DPP, and the benefit persisted for decades."},"citations":["Knowler et al. NEJM 2002 — Diabetes Prevention Program","Diabetes Prevention Program Outcomes Study, Lancet Diabetes Endocrinol 2015","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-metabolic-freedom","type":"Outcome","title":"Metabolic freedom","summary":"Being able to eat, travel, miss a night of sleep and recover normally — a body with enough metabolic reserve that ordinary life does not destabilise it.","attrs":{"outcome_polarity":"protective","note":"Not a formal clinical endpoint. Included because it is the outcome users actually describe wanting, and it maps onto measurable things: insulin sensitivity, hepatic fat, post-meal glucose excursions.","evidence_caveat":"The composite itself is a framing device, not a validated endpoint; the underlying components each have their own evidence."},"citations":["ADA Standards of Care in Diabetes 2025","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Attia, Outlive (2023), ch. 6 — metabolic health framing — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-cognitive-independence","type":"Outcome","title":"Cognitive independence","summary":"Retaining the executive function and memory needed to run your own life into the ninth decade.","attrs":{"outcome_polarity":"protective","horseman":"third","vascular_link":"A large share of late-life cognitive decline is vascular; midlife blood pressure and lipid control are among the few modifiable levers with real evidence behind them."},"citations":["Livingston et al. Lancet 2024 — dementia prevention, intervention and care commission","SPRINT MIND Investigators, JAMA 2019 — intensive blood pressure control and cognitive outcomes","Attia, Outlive (2023), ch. 9 — the third Horseman — author framing"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-adv-heat-illness","type":"Outcome","title":"Exertional heat illness","summary":"Heat exhaustion or heat stroke during exercise in hot or humid conditions — ranges from a ruined session to a medical emergency.","attrs":{"outcome_polarity":"adverse","escalation":"Exertional heat stroke is a true emergency with meaningful mortality if cooling is delayed.","modifiers_that_raise_it":["hot-humid conditions","anticholinergic medication","diuretics","poor acclimatisation","dehydration","older age"]},"citations":["Casa et al. J Athl Train 2015 — NATA position statement on exertional heat illnesses","Racinais et al. Br J Sports Med 2015 — consensus on training and competing in the heat"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-adv-cardiac-event-exertion","type":"Outcome","title":"Exercise-related acute cardiac event","summary":"Cardiac arrest or myocardial infarction occurring during or shortly after vigorous exertion.","attrs":{"outcome_polarity":"adverse","framing":"Absolute risk per hour of vigorous exercise is very low and is far outweighed by the risk reduction from habitual exercise — but the transient relative risk during exertion is real and is highest in the habitually sedentary.","modifiers_that_raise_it":["known coronary disease","exertional chest pain","syncope","sedentary baseline with abrupt vigorous onset"]},"citations":["Franklin et al. Circulation 2020 — AHA statement on exercise-related acute cardiovascular events","Kim et al. NEJM 2012 — cardiac arrest during long-distance running races"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-adv-musculoskeletal-injury","type":"Outcome","title":"Musculoskeletal overuse injury","summary":"Tendinopathy, stress reaction, joint or low-back injury from training load that outpaces tissue adaptation.","attrs":{"outcome_polarity":"adverse","why_it_matters_here":"The dominant real-world reason people stop an aerobic programme, so it belongs in the comparison frame rather than in a footnote.","modifiers_that_raise_it":["rapid volume progression","prior injury at the same site","load carriage","downhill terrain"]},"citations":["Videbæk et al. Sports Med 2015 — running injury incidence per 1000 hours of exposure","Knapik et al. Mil Med 2004 — load carriage physiology and injury"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-adv-hypoglycemia","type":"Outcome","title":"Hypoglycaemia","summary":"Blood glucose falling low enough to cause symptoms or, at the extreme, impairment — a risk of exercise and fasting almost exclusively in people on insulin or insulin secretagogues.","attrs":{"outcome_polarity":"adverse","who_is_at_risk":"Essentially confined to people taking insulin, sulfonylureas or meglitinides. In people not on these agents, exercise- or fasting-related hypoglycaemia is rare and usually benign.","modifiers_that_raise_it":["insulin therapy","sulfonylurea therapy","extended fasting","alcohol","unaccustomed exercise duration"]},"citations":["ADA Standards of Care in Diabetes 2025 — glycaemic targets and hypoglycaemia","Riddell et al. Lancet Diabetes Endocrinol 2017 — exercise management in type 1 diabetes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"out-adv-drowning","type":"Outcome","title":"Drowning or submersion incident","summary":"The category-defining risk of swimming: rare, but unlike every other aerobic modality its worst case is immediate and fatal.","attrs":{"outcome_polarity":"adverse","asymmetry":"Swimming's musculoskeletal risk is the lowest of any aerobic modality, and its tail risk is the highest. The comparison frame has to show both rather than average them into one risk band.","modifiers_that_raise_it":["open water","swimming alone","no lifeguard","poor stroke competence","cold water","alcohol","seizure disorder","cardiac arrhythmia"]},"citations":["WHO Global Report on Drowning 2014 and drowning fact sheet 2024","Szpilman et al. NEJM 2012 — drowning: pathophysiology and management"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes","type":"RiskFactor","title":"Prediabetes","summary":"Fasting glucose 100–125 mg/dL, HbA1c 5.7–6.4 percent, or a 2-hour OGTT value of 140–199 mg/dL — the state where the same interventions do much more work than they do at baseline.","attrs":{"sharpens_not_blocks":true,"annual_progression":"roughly 5–10 percent per year to diabetes without intervention","measurement_shift":"Moves the honest measurement set toward Tier A/B (OGTT, HbA1c, fasting insulin, CGM) and away from Tier C consumer signals."},"citations":["ADA Standards of Care in Diabetes 2025 — classification and diagnosis","Knowler et al. NEJM 2002 — Diabetes Prevention Program","Tabák et al. Lancet 2012 — prediabetes: a high-risk state"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-type2-diabetes","type":"RiskFactor","title":"Type 2 diabetes","summary":"Established diabetes — the fourth Horseman having arrived, and a state where every cardiovascular intervention gains weight.","attrs":{"sharpens_not_blocks":true,"cross_system":"Roughly doubles ASCVD risk, so it sharpens cardiovascular priorities as much as metabolic ones.","note":"Some interventions here interact with glucose-lowering medication; those interactions are authored as modifier edges elsewhere in the graph, not here."},"citations":["ADA Standards of Care in Diabetes 2025","Emerging Risk Factors Collaboration, Lancet 2010 — diabetes and vascular disease risk"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-apob","type":"RiskFactor","title":"Elevated ApoB","summary":"A high circulating count of atherogenic particles — the causal exposure for plaque, and the thing worth acting on earliest because risk integrates over time.","attrs":{"sharpens_not_blocks":true,"guideline_thresholds":"ESC/EAS treats ApoB above roughly 100 mg/dL as elevated and sets lower goals by risk category; ApoB above about 130 mg/dL is high in most schemes.","attia_position":"Attia argues for treating ApoB well below these thresholds, often toward 60 mg/dL or lower, and starting decades earlier than guidelines contemplate.","consensus_note":"The direction is well supported: lower and earlier is better, and the Mendelian randomisation evidence for cumulative exposure is strong. The specific aggressive target in low-risk primary prevention has not been tested against outcomes, and the absolute benefit for a low-risk 35-year-old is small in any given year even if large over a lifetime.","evidence_note":"Rated moderate rather than high specifically because of the untested target, not because the causal claim is in doubt."},"citations":["Sniderman et al. JAMA Cardiol 2019 — ApoB and risk discordance","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias","Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality","Attia, Outlive (2023), ch. 7 — ApoB targets — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-lpa","type":"RiskFactor","title":"Elevated lipoprotein(a)","summary":"A genetically determined, largely diet- and exercise-immune particle that independently raises ASCVD risk in roughly one in five people.","attrs":{"sharpens_not_blocks":true,"key_property":"Almost entirely inherited and stable across life, so it needs measuring once — but it changes the urgency of everything else, because you cannot lower it with lifestyle.","what_it_changes":"Elevated Lp(a) does not respond to the aerobic and dietary interventions in this graph; its effect is to sharpen ApoB lowering, blood pressure control and smoking cessation.","attia_position":"Attia advocates universal once-in-a-lifetime measurement and treats an elevated result as a mandate for aggressive ApoB lowering.","consensus_note":"EAS 2022 and several national bodies now recommend once-in-a-lifetime measurement, so this is close to consensus in Europe. USPSTF has made no recommendation, and no completed outcome trial yet shows that lowering Lp(a) itself lowers events — trials are ongoing."},"citations":["Kronenberg et al. Eur Heart J 2022 — EAS consensus statement on lipoprotein(a)","Emerging Risk Factors Collaboration, JAMA 2009 — Lp(a) and vascular disease","Attia, Outlive (2023), ch. 7 — Lp(a) screening — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-family-history-early-cad","type":"RiskFactor","title":"Family history of early coronary disease","summary":"A first-degree relative with coronary disease before 55 (male) or 65 (female) — a risk-enhancing factor that shifts borderline decisions.","attrs":{"sharpens_not_blocks":true,"guideline_status":"Named as a risk-enhancing factor in the 2019 ACC/AHA primary prevention guideline, used to move borderline-risk patients toward treatment.","what_it_should_trigger":"Lp(a) measurement, ApoB rather than LDL-C alone, and an earlier conversation about imaging."},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease — risk-enhancing factors","Lloyd-Jones et al. Circulation 2004 — parental cardiovascular disease and offspring risk"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-low-vo2max-percentile","type":"RiskFactor","title":"Low VO2max for age and sex","summary":"Sitting in the bottom quartile of cardiorespiratory fitness for your age and sex — the single largest modifiable gap in this graph by effect on all-cause mortality.","attrs":{"sharpens_not_blocks":true,"gradient":"The mortality difference between the bottom quartile and the next one up is larger than the difference between any two higher quartiles — the return on moving off the floor is the steepest return available.","comparison":"Observational hazard ratios for low fitness exceed those for smoking, diabetes and hypertension in the same cohorts.","attia_position":"Attia treats moving out of the bottom quartile as the highest-yield intervention in all of preventive medicine.","consensus_note":"The observational gradient genuinely is that steep and is consistent across cohorts. It is still observational: reverse causation (subclinical illness lowering fitness) is incompletely excluded, and no trial has randomised sedentary adults to a fitness target with a mortality endpoint. The direction is safe to act on; the magnitude claim should not be read as an RCT result."},"citations":["Mandsager et al. JAMA Netw Open 2018 — cardiorespiratory fitness and long-term mortality","Kodama et al. JAMA 2009 — cardiorespiratory fitness meta-analysis","Ross et al. Circulation 2016 — AHA statement on fitness as a clinical vital sign","Attia, Outlive (2023), ch. 11 — VO2max percentiles — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-visceral-adiposity","type":"RiskFactor","title":"Visceral adiposity","summary":"Fat stored around and inside the abdominal organs — metabolically active in a way subcutaneous fat is not, and detectable at a normal BMI.","attrs":{"sharpens_not_blocks":true,"normal_weight_caveat":"A person with a BMI of 23 can carry substantial visceral fat; this is why the graph measures waist and DXA rather than weight.","responsiveness":"Among the most responsive things in this graph — visceral and hepatic fat fall disproportionately early in energy restriction, ahead of total weight."},"citations":["Ross et al. Nat Rev Endocrinol 2020 — waist circumference consensus statement","Neeland et al. Lancet Diabetes Endocrinol 2019 — visceral and ectopic fat and cardiometabolic disease","Kaul et al. Obesity 2012 — DXA visceral adipose tissue validation"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-hypertension","type":"RiskFactor","title":"Hypertension","summary":"Sustained blood pressure at or above 130/80 mmHg — the most prevalent modifiable driver of both ASCVD and vascular cognitive decline.","attrs":{"sharpens_not_blocks":true,"threshold_note":"The 2017 ACC/AHA threshold of 130/80 is lower than the 140/90 used by several other bodies including ESC/ESH; the disagreement is about where to label, not about the direction of risk.","dual_outcome":"Sharpens both cardiovascular and cognitive priorities — SPRINT MIND found fewer cases of mild cognitive impairment with intensive control."},"citations":["Whelton et al. 2017 ACC/AHA Hypertension Guideline","SPRINT Research Group, NEJM 2015","SPRINT MIND Investigators, JAMA 2019 — intensive control and cognitive outcomes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-hba1c","type":"RiskFactor","title":"Elevated HbA1c","summary":"A three-month average glucose exposure above the reference range — a late signal, but the one most people actually have in hand.","attrs":{"sharpens_not_blocks":true,"lateness":"HbA1c rises after years of compensatory hyperinsulinaemia, so a normal value is weak reassurance and an elevated one means the process is already well advanced.","confounders":"Distorted by anaemia, haemoglobin variants, recent transfusion and altered red-cell lifespan — worth flagging before acting on a single value."},"citations":["ADA Standards of Care in Diabetes 2025 — diagnosis","Tabák et al. Lancet 2009 — Whitehall II trajectories","Cavagnolli et al. PLoS One 2017 — factors affecting HbA1c"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-walking","type":"Intervention","title":"Walking","summary":"Unstructured or structured walking at a conversational pace — the lowest-barrier aerobic intervention and the one with the best real-world adherence.","attrs":{"modality":"aerobic","intensity_zone":"zone 1 to low zone 2","equipment":"shoes","access":"universal","adherence_note":"The intervention people actually keep doing. Its ceiling is low, but a maintained walking habit outperforms an abandoned running programme in every axis that matters.","dose_gradient":"Mortality benefit accrues steeply from roughly 2,500 to 7,500 steps per day and flattens above that; cadence matters somewhat independently of total volume."},"citations":["Paluch et al. Lancet Public Health 2022 — steps per day and all-cause mortality meta-analysis","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Bull et al. Br J Sports Med 2020 — WHO 2020 physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking","type":"Intervention","title":"Post-meal walking","summary":"A short easy walk starting within roughly 15–30 minutes of finishing a meal — trivial in effort, and one of the few interventions whose effect on post-meal glucose is visible the same day.","attrs":{"modality":"aerobic","intensity_zone":"zone 1","equipment":"none","access":"universal","timing_is_the_mechanism":"Muscle contraction recruits GLUT4 to the membrane independently of insulin, so walking while glucose is being absorbed blunts the peak in a way the same walk two hours later does not.","why_it_matters_for_the_demo":"It is the clearest case in the graph where a Tier B/C signal (CGM curve) responds within hours, which makes it the natural first n-of-1 experiment.","dose_gradient":"Even 2–5 minutes of light walking after a meal measurably reduces the glucose excursion; 10–20 minutes does more; the effect is largely lost if the walk is delayed past about an hour.","what_it_does_not_do":"It does not meaningfully raise VO2max and it is not a substitute for structured aerobic training. It is a glycaemic tool that happens to also add steps.","attia_position":"Attia and the wider metabolic-health community treat post-meal movement as a default habit for anyone with any degree of insulin resistance.","consensus_note":"Uncontroversial and cheap. The meta-analytic evidence is for the acute glycaemic effect on surrogate endpoints; no trial has shown that habitual post-meal walking specifically reduces incident diabetes or cardiovascular events beyond the effect of the activity volume itself."},"citations":["Buffey et al. Sports Med 2022 — light-intensity walking breaks and postprandial glycaemia meta-analysis","Reynolds et al. Diabetologia 2016 — walking after meals in type 2 diabetes","Bellini et al. Nutrients 2022 — timing of post-meal exercise and glycaemic response","Colberg et al. Diabetes Care 2016 — ADA position on physical activity and diabetes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running","type":"Intervention","title":"Zone 2 running","summary":"Sustained easy running at the top of fat oxidation — roughly the pace at which you can hold a conversation in full sentences — accumulated in blocks of 45 minutes or more.","attrs":{"modality":"aerobic","intensity_zone":"zone 2 of a 5-zone model; roughly 60–70 percent of heart rate reserve","how_to_find_the_zone":"Practical anchors: nasal breathing sustainable, full sentences possible, RPE about 3–4 out of 10. Lab anchor: at or just below the first lactate threshold, often around 1.7–2.0 mmol/L.","equipment":"shoes; a heart rate monitor helps but talk-test works","access":"high — no facility needed, weather and terrain dependent","typical_prescription":"3–4 sessions per week of 45–60 minutes, usually alongside one weekly VO2max interval session.","attia_position":"Attia prescribes roughly 3–4 hours weekly of Zone 2 as a foundation, and argues the low-intensity zone is specifically what builds mitochondrial capacity and metabolic flexibility.","consensus_note":"That this volume of moderate aerobic training raises VO2max, lowers cardiovascular risk and improves insulin sensitivity is solid and guideline-backed. The stronger claim — that Zone 2 specifically, as opposed to equivalent training volume at other intensities, is what produces the mitochondrial adaptation — is mechanistically plausible and supported by lactate-kinetics work, not by head-to-head trials with mitochondrial endpoints in ordinary adults. The volume prescribed also exceeds the guideline minimum of 150 minutes per week by roughly double.","injury_reality":"Running injury incidence in recreational runners runs to several injuries per 1000 hours of exposure, concentrated in the first months and in rapid volume increases. This is the main reason a well-designed programme fails.","why_it_is_the_demo_path":"It is the intervention with the largest effect on the function (aerobic capacity) that best predicts mortality, and it carries the richest modifier set in the graph — back pain, plantar fasciitis, knee osteoarthritis, heat, terrain."},"citations":["Bull et al. Br J Sports Med 2020 — WHO 2020 physical activity guidelines","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Milanović et al. Sports Med 2015 — endurance training and VO2max","San-Millán & Brooks, Sports Med 2018 — lactate and training zones","Granata et al. Sports Med 2018 — training intensity and mitochondrial adaptations","Attia, The Drive — Zone 2 protocol — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals","type":"Intervention","title":"VO2max intervals","summary":"Hard intervals of roughly 3–4 minutes at close to maximal aerobic effort with equal recovery — the most time-efficient way to raise the ceiling on aerobic capacity.","attrs":{"modality":"aerobic","intensity_zone":"zone 5; roughly 90–95 percent of maximum heart rate","canonical_protocol":"4 × 4 minutes hard with 3 minutes easy between, once weekly, after a base of easy volume.","equipment":"any modality — run, bike, row, ski erg","access":"high, but demands a tolerance for discomfort that limits adherence","attia_position":"Attia treats one weekly VO2max session as non-negotiable alongside Zone 2 volume, on the basis that VO2max percentile is the dominant mortality predictor.","consensus_note":"Interval training does raise VO2max more per unit time than continuous moderate work — that part is well replicated. The inference that raising your VO2max moves you along the observational mortality curve is an extrapolation: the cohort evidence is about fitness level, not about fitness change, and no randomised trial has demonstrated a mortality benefit from a VO2max-targeted programme in healthy adults. It remains a reasonable bet with an honest gap under it.","risk_profile":"Carries the highest transient cardiac risk of any intervention here, concentrated in habitually sedentary people starting abruptly, and the highest musculoskeletal cost per session."},"citations":["Milanović et al. Sports Med 2015 — HIIT and VO2max meta-analysis","Weston et al. Br J Sports Med 2014 — HIIT versus moderate continuous training","Wisløff et al. Circulation 2007 — aerobic interval training","Franklin et al. Circulation 2020 — exercise-related acute cardiovascular events","Attia, Outlive (2023), ch. 12 — VO2max training — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-cycling","type":"Intervention","title":"Cycling","summary":"Outdoor or indoor cycling at steady aerobic intensity — a low-impact way to accumulate large aerobic volume.","attrs":{"modality":"aerobic","intensity_zone":"any; easily controlled indoors","equipment":"bicycle or stationary trainer","access":"moderate — equipment cost, and outdoor cycling carries traffic risk that indoor does not","joint_load":"Minimal impact, which makes it a clean substitute when running is blocked by lower-limb pathology.","non_impact_caveat":"Non-weight-bearing, so unlike running or rucking it contributes essentially nothing to bone loading."},"citations":["Oja et al. Scand J Med Sci Sports 2011 — health benefits of cycling: a systematic review","Celis-Morales et al. BMJ 2017 — active commuting and cardiovascular disease (UK Biobank)","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming","type":"Intervention","title":"Swimming","summary":"Continuous swimming at aerobic intensity — the only modality here that is simultaneously near-zero impact and genuinely whole-body, with a risk profile unlike anything else in the graph.","attrs":{"modality":"aerobic","intensity_zone":"zone 2 to zone 4 depending on set structure","equipment":"pool access, goggles, costume","access":"moderate to low — needs a facility, and competence is a prerequisite rather than an option","joint_load":"The lowest of any aerobic modality. Buoyancy removes essentially all impact loading, which is why it is the default substitute when knee osteoarthritis, plantar fasciitis, stress reaction or low back pain block running and rucking.","technique_dependence":"Uniquely high. A poor swimmer's aerobic stimulus is limited by stroke mechanics rather than by cardiovascular capacity, so the same session yields a much smaller training effect than it would for a competent swimmer. This is the main reason the effect size here is authored as moderate rather than large — the ceiling is real but most adults never reach it.","heart_rate_offset":"Heart rate in the water runs roughly 10–13 beats per minute lower than on land at the same relative effort, because of horizontal posture, cooler water and the diving reflex. Zone targets set on land will systematically overestimate effort in the pool.","blood_pressure_evidence":"Swim training lowered systolic pressure in previously sedentary older adults in small randomised work — encouraging, small samples, and less replicated than the equivalent walking and cycling literature.","thermoregulation":"Water removes heat far faster than air, so exertional heat illness is essentially off the table — but cold-water immersion introduces its own hypothermia and cold-shock considerations in open water.","tail_risk":"The one intervention in this graph whose worst case is immediate death. Drowning risk is low in supervised pools and materially higher in open water, alone, or with poor stroke competence. Never averaged into the general risk band without saying so.","why_it_is_the_demo_path":"It is the canonical SUBSTITUTES target: when the modifier resolver blocks running, swimming is what the graph offers, and showing the honest trade — comparable cardiovascular benefit, lower joint cost, higher facility barrier, a fatal tail risk — is exactly the comparison frame doing its job."},"citations":["Tanaka H. Int J Sports Med 2009 — swimming exercise and cardiovascular health","Nualnim et al. Am J Cardiol 2012 — swim training and blood pressure in middle-aged and older adults","Chase, Sui & Blair, Int J Aquat Res Educ 2008 — swimming and cardiovascular risk factors","McArdle et al. — heart rate response to immersion and horizontal posture","WHO drowning fact sheet 2024","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rowing","type":"Intervention","title":"Rowing","summary":"Indoor or on-water rowing — high aerobic demand with substantial upper-body and posterior-chain involvement.","attrs":{"modality":"aerobic","intensity_zone":"any; erg makes intensity control easy","equipment":"rowing ergometer or boat access","access":"moderate","technique_dependence":"High. Poor sequencing loads the lumbar spine in flexion under fatigue, which is why rowing is cautioned rather than recommended when low back pain is present.","muscle_recruitment":"Recruits a larger active muscle mass than cycling, which raises the achievable aerobic stimulus per minute."},"citations":["Yoshiga & Higuchi, Eur J Appl Physiol 2003 — oxygen uptake and rowing performance","Thornton et al. Clin J Sport Med 2017 — rowing injuries and low back pain","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rucking","type":"Intervention","title":"Rucking","summary":"Walking under load in a weighted pack — walking's aerobic and adherence profile with meaningfully more metabolic and skeletal demand.","attrs":{"modality":"aerobic plus loaded carriage","intensity_zone":"zone 1 to zone 2 depending on load and grade","equipment":"pack and weight","access":"high","load_guidance":"Commonly started at roughly 10 percent of body weight and progressed slowly; military load-carriage literature shows injury incidence climbing sharply with load, distance and rate of progression.","dual_benefit":"One of the few aerobic options that also loads bone and the posterior chain, which matters for the musculoskeletal system the other agent owns."},"citations":["Knapik et al. Mil Med 2004 — load carriage in military operations: physiology and injury","Orr et al. Appl Ergon 2014 — load carriage injury risk factors","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-hiking","type":"Intervention","title":"Hiking","summary":"Sustained walking on varied terrain and grade — long duration at moderate intensity, with balance and proprioceptive demands built in.","attrs":{"modality":"aerobic","intensity_zone":"zone 1 to zone 3, driven mostly by grade","equipment":"footwear, weather layers","access":"moderate — depends entirely on where you live","descent_load":"The eccentric load of descent is the injury driver, not the climb.","adherence_advantage":"Often sustained for years because it is recreation rather than training, and the duration is long enough to matter without feeling like a session."},"citations":["Mitten et al. Am J Lifestyle Med 2018 — hiking: a low-cost health intervention","Gatterer et al. Int J Environ Res Public Health 2021 — mountain hiking and cardiovascular effects","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-stair-climbing","type":"Intervention","title":"Stair climbing","summary":"Short bouts of vigorous stair ascent — the archetypal case of very brief, very available, surprisingly potent activity.","attrs":{"modality":"aerobic","intensity_zone":"zone 4 to zone 5 in short bursts","equipment":"stairs","access":"universal in most built environments","vilpa_framing":"Fits the emerging evidence on vigorous intermittent lifestyle physical activity: 1–2 minute bursts several times a day associate with meaningfully lower mortality in accelerometer cohorts.","evidence_caveat":"Those cohort associations are new, observational, and vulnerable to reverse causation — people who can sprint up stairs are healthier to begin with."},"citations":["Stamatakis et al. Nat Med 2022 — vigorous intermittent lifestyle physical activity and mortality","Allison et al. Med Sci Sports Exerc 2017 — brief stair-climbing sprints and cardiorespiratory fitness","Boreham et al. Br J Sports Med 2005 — stair-climbing training in sedentary young women"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-elliptical","type":"Intervention","title":"Elliptical trainer","summary":"Machine-based non-impact aerobic work — physiologically close to running at a given effort, with the impact removed.","attrs":{"modality":"aerobic","intensity_zone":"any","equipment":"gym or home machine","access":"moderate","substitution_value":"Its purpose in the graph is almost entirely as a substitute: it delivers a running-like cardiovascular stimulus for people who cannot absorb impact.","evidence_thinness":"Far less outcome literature than walking, running or cycling; the case rests on equivalent physiological responses rather than on cohort or trial endpoints."},"citations":["Green et al. J Strength Cond Res 2004 — physiological responses to elliptical versus treadmill exercise","Egaña et al. Eur J Appl Physiol 2010 — cardiorespiratory responses on the elliptical","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-protein-intake","type":"Intervention","title":"Adequate protein intake","summary":"Eating enough protein, distributed across the day, to defend lean mass — the input that makes resistance training and weight loss produce the body composition you actually wanted.","attrs":{"modality":"nutrition","rda":"0.8 g/kg/day is the RDA — the amount that prevents deficiency, not the amount that optimises lean mass.","evidence_supported_range":"Meta-analytic benefit for lean mass with training plateaus around 1.6 g/kg/day, with wide individual confidence intervals; older-adult consensus groups recommend 1.0–1.2 g/kg/day and more during illness.","attia_position":"Attia recommends roughly 1 gram per pound of body weight per day, about 2.2 g/kg — well above both the RDA and the point where the meta-analytic benefit flattens.","consensus_note":"The direction is right and the RDA is genuinely too low for someone training and ageing. The specific 2.2 g/kg target sits above the range where added benefit has been demonstrated; intakes at that level appear safe in people with normal kidney function, but 'safe and above the demonstrated plateau' is a different claim from 'better'. Rated moderate evidence for the 1.6 g/kg range, and the higher target is flagged as an author position rather than folded into the rating.","kidney_caveat":"High intakes are not established as safe in reduced kidney function; that interaction is authored as a modifier edge elsewhere."},"citations":["Morton et al. Br J Sports Med 2018 — protein supplementation and resistance-training adaptations meta-analysis","Bauer et al. JAMDA 2013 — PROT-AGE protein recommendations for older adults","Institute of Medicine Dietary Reference Intakes 2005 — protein RDA","Attia, Outlive (2023), ch. 15 — protein intake — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-fiber-intake","type":"Intervention","title":"Dietary fibre intake","summary":"Raising fibre toward 25–35 g/day, weighted toward viscous soluble sources — one of the few dietary changes with both a lipid and a glycaemic effect and prospective outcome data behind it.","attrs":{"modality":"nutrition","target":"25–35 g/day total; roughly 5–10 g/day of viscous soluble fibre for the lipid effect","typical_intake":"Most adults in high-income countries eat 15 g/day or less, so the gap is large and closing it is cheap.","mechanism":"Viscous fibre binds bile acids and slows carbohydrate absorption; the fermentable fraction feeds short-chain fatty acid production.","magnitude_honesty":"The LDL-C effect of soluble fibre is real but modest — single-digit percent — and much smaller than pharmacological lowering. It is worth doing and it is not a substitute.","adherence_note":"Tolerability limits the ramp; increasing too fast reliably produces bloating and abandonment."},"citations":["Reynolds et al. Lancet 2019 — carbohydrate quality and human health: systematic reviews and meta-analyses","Brown et al. Am J Clin Nutr 1999 — cholesterol-lowering effects of dietary fibre meta-analysis","US 2020–2025 Dietary Guidelines for Americans"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss","type":"Intervention","title":"Sustained energy deficit for fat loss","summary":"An intentional, maintained calorie deficit in the presence of excess adiposity — by a wide margin the largest metabolic lever in this graph, and the hardest one to keep hold of.","attrs":{"modality":"nutrition and behaviour","dose_gradient":"5 percent of body weight improves most metabolic markers; 10 percent moves them substantially; 15 percent or more produces diabetes remission in a large fraction of people with recent-onset type 2 diabetes.","direct_evidence":"DiRECT achieved remission in 46 percent at one year and 36 percent at two years with structured weight management; DPP cut progression to diabetes by 58 percent, outperforming metformin.","hepatic_priority":"Hepatic fat falls first and fastest — often measurable within two weeks and well before the scale reflects much.","the_hard_part":"Weight regain is the modal outcome and is physiologically defended, not a character failing. Adherence realism is rated low here for that reason and the rating is not a criticism of the intervention.","only_applies_when":"Only an intervention where excess adiposity exists. Applied to someone lean it becomes a harm, which is why the risk band is not negligible."},"citations":["Knowler et al. NEJM 2002 — Diabetes Prevention Program","Lean et al. Lancet 2018 and Lancet Diabetes Endocrinol 2019 — DiRECT trial and two-year follow-up","Look AHEAD Research Group, NEJM 2013 — intensive lifestyle intervention in type 2 diabetes","Magkos et al. Cell Metab 2016 — effects of graded weight loss on metabolic function"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-added-sugar-reduction","type":"Intervention","title":"Reducing added sugar and sugar-sweetened beverages","summary":"Cutting added sugars, with liquid calories first — the highest-yield single dietary substitution for hepatic fat and post-meal glucose.","attrs":{"modality":"nutrition","liquid_first":"Sugar-sweetened beverages are the priority: they are not compensated for by reduced eating elsewhere, and fructose delivered in liquid form goes disproportionately to hepatic de novo lipogenesis.","target":"Guidelines converge on under 10 percent of energy from added sugar, with several bodies suggesting under 5 percent.","confounded_effect":"Much of the benefit in trials runs through the accompanying energy deficit, so isolating a sugar-specific effect from a calorie effect is genuinely hard and the literature reflects that."},"citations":["US 2020–2025 Dietary Guidelines for Americans — added sugars","Schwarz et al. Gastroenterology 2017 — dietary fructose restriction and hepatic fat in children","Malik & Hu, J Am Coll Cardiol 2015 — sugar-sweetened beverages and cardiometabolic risk","WHO Guideline on sugars intake 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-alcohol-reduction","type":"Intervention","title":"Reducing alcohol intake","summary":"Cutting alcohol toward zero — with liver, blood pressure and sleep benefits that are clearer than the older cardioprotection story ever was.","attrs":{"modality":"nutrition and behaviour","direction_change":"The long-standing J-curve suggesting light drinking protects the heart has largely dissolved under Mendelian randomisation and better handling of the sick-quitter bias. Current large analyses find no clearly protective level for cardiovascular disease and a monotonic relationship for several cancers.","blood_pressure":"The dose-response for blood pressure is one of the more reliable findings here — reduction lowers pressure within weeks, proportionally to the amount cut.","sleep":"Alcohol reliably suppresses REM and fragments the second half of the night, which the wearable sleep markers in this graph will show even when the drinker does not notice it.","attia_position":"Attia's position is that alcohol has no health upside and that the honest framing is a cost you may choose to pay for enjoyment.","consensus_note":"This has moved from contrarian to close to mainstream — WHO now states no safe level for cancer risk. It is still stronger than some national guidelines, which retain low-risk drinking limits rather than a zero target."},"citations":["Biddinger et al. JAMA Netw Open 2022 — alcohol consumption and cardiovascular disease Mendelian randomisation","WHO 2023 statement — no safe level of alcohol consumption for cancer risk","Roerecke et al. Lancet Public Health 2017 — alcohol reduction and blood pressure meta-analysis","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-time-restricted-eating","type":"Intervention","title":"Time-restricted eating","summary":"Confining intake to a window of roughly 8–10 hours daily — popular, easy to describe, and with a weaker evidence base than its cultural prominence suggests.","attrs":{"modality":"nutrition timing","what_the_trials_show":"When calories are matched, time-restricted eating produces little or no additional weight or metabolic benefit over the same intake eaten across a longer window. Its practical value is that it often reduces intake without counting.","early_versus_late":"Early time-restricted eating (window ending mid-afternoon) shows better glycaemic effects than late windows in small crossover trials, but adherence to an early window in normal social life is poor.","lean_mass_caution":"Compressed windows can reduce total protein intake and, in some trials, lean mass — which puts it in tension with the protein intervention in this graph.","attia_position":"Attia has publicly walked back earlier enthusiasm for fasting protocols, citing exactly the lean-mass concern; this is a case where the author position became less aggressive over time.","consensus_note":"No guideline body recommends time-restricted eating as a distinct intervention. Rated low-to-moderate evidence and small effect, which is a deliberate correction against how heavily it is promoted in this audience."},"citations":["Lowe et al. JAMA Intern Med 2020 — TREAT randomised trial of time-restricted eating","Liu et al. NEJM 2022 — calorie restriction with or without time-restricted eating","Sutton et al. Cell Metab 2018 — early time-restricted feeding and insulin sensitivity","Attia, The Drive — revised position on fasting and lean mass — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-mediterranean-pattern","type":"Intervention","title":"Mediterranean dietary pattern","summary":"A whole-diet pattern built on olive oil, nuts, legumes, fish, vegetables and minimally processed food — the eating pattern with the strongest cardiovascular outcome evidence, with a large asterisk.","attrs":{"modality":"nutrition","the_asterisk":"PREDIMED remains the best trial evidence for a dietary pattern and a cardiovascular endpoint, and it was retracted and republished in 2018 after randomisation irregularities were found at some sites. The republished analysis preserved the direction and magnitude but the design flaw is real and should be visible to the user rather than buried.","pattern_not_nutrient":"The evidence is for the whole pattern; attempts to attribute it to any single component have not held up.","adherence_advantage":"Unusually sustainable relative to restrictive diets — it is a cuisine rather than a protocol."},"citations":["Estruch et al. NEJM 2018 — PREDIMED, republished after randomisation irregularities","Rees et al. Cochrane Database Syst Rev 2019 — Mediterranean diet for primary prevention","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease — nutrition"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-duration","type":"Intervention","title":"Adequate sleep duration","summary":"Consistently getting 7–9 hours of sleep opportunity — an intervention that changes insulin sensitivity within days and is chronically under-treated as a metabolic lever.","attrs":{"modality":"sleep and behaviour","speed_of_effect":"Experimental sleep restriction measurably reduces insulin sensitivity within under a week in healthy young adults, which makes it one of the fastest-acting interventions in this graph.","cohort_shape":"The observational relationship with diabetes and cardiovascular risk is U-shaped; the long-sleep arm is heavily confounded by illness and is not a reason to sleep less.","opportunity_versus_sleep":"The intervention is time in bed available for sleep; measured sleep duration is the marker. Conflating the two overstates what a person controls.","note":"Owned here because of its metabolic effect. Sleep architecture and the sleep system proper are cross-cutting and specified elsewhere."},"citations":["Spiegel et al. Lancet 1999 — sleep debt and metabolic and endocrine function","Cappuccio et al. Diabetes Care 2010 — sleep duration and incident type 2 diabetes meta-analysis","Watson et al. Sleep 2015 — AASM/SRS consensus on recommended sleep duration"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-regularity","type":"Intervention","title":"Sleep timing regularity","summary":"Going to bed and waking at consistent clock times — a lever that appears to matter independently of how long you sleep.","attrs":{"modality":"sleep and behaviour","independent_signal":"Sleep regularity indices predicted mortality more strongly than duration in recent accelerometer cohorts — a genuinely surprising result that is new enough to hold loosely.","mechanism":"Circadian misalignment impairs glucose tolerance in controlled laboratory protocols independently of total sleep time.","evidence_stage":"Strong mechanistic support plus consistent but young observational data; no intervention trial has randomised people to a regularity target with metabolic endpoints."},"citations":["Huang et al. Diabetes Care 2019 — sleep irregularity and metabolic risk in MESA","Windred et al. Sleep 2024 — sleep regularity and mortality in UK Biobank accelerometer data","Scheer et al. PNAS 2009 — adverse metabolic consequences of circadian misalignment"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-smoking-cessation","type":"Intervention","title":"Smoking cessation","summary":"Stopping tobacco — the single largest risk reduction available to anyone who smokes, and the reason it appears in a graph otherwise about optimisation.","attrs":{"modality":"behaviour","magnitude":"Excess cardiovascular risk falls substantially within one to two years of quitting and approaches that of never-smokers over roughly a decade, though not completely for all endpoints.","priority_note":"If this edge applies to a user, it dominates everything else in the cardiovascular system. The graph should not present it as one option among eleven.","difficulty":"Effort and adherence realism are rated honestly: most quit attempts fail, and repeated attempts are the normal path to success rather than evidence of failure."},"citations":["US Surgeon General Report 2020 — Smoking Cessation","Duncan et al. JAMA 2019 — smoking cessation and cardiovascular disease risk in the Framingham cohort","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease — tobacco"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-lipid-lowering-adherence","type":"Intervention","title":"Adherence to prescribed lipid-lowering therapy","summary":"Actually taking the statin or other lipid-lowering agent that has already been prescribed — the largest available reduction in atherogenic particle burden, and one people abandon at remarkable rates.","attrs":{"modality":"medication adherence","scope_boundary":"This node is about adherence to an existing prescription. It does not select, initiate, dose or recommend a drug — that is out of scope for the model by design.","magnitude":"Each roughly 1 mmol/L (about 39 mg/dL) of LDL-C reduction cuts major vascular events by about 22 percent per year of treatment in the CTT meta-analyses, and benefit compounds with duration.","the_actual_problem":"Roughly half of people stop within a year. Discontinuation is frequently driven by symptoms that blinded rechallenge trials attribute largely to expectation rather than to the drug — a point worth surfacing without dismissing anyone's experience.","comparison_to_lifestyle":"No dietary or exercise intervention in this graph approaches this effect size on ApoB. Presenting them as interchangeable would be the dishonest move."},"citations":["Cholesterol Treatment Trialists' Collaboration, Lancet 2010 and 2012 — efficacy and safety of LDL-lowering","Wood et al. NEJM 2020 — N-of-1 trial of statin side effects (SAMSON)","2018 AHA/ACC/Multisociety Cholesterol Guideline","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-bp-control-adherence","type":"Intervention","title":"Adherence to prescribed blood pressure therapy","summary":"Taking prescribed antihypertensives consistently and measuring at home to know whether they are working.","attrs":{"modality":"medication adherence","scope_boundary":"Adherence and measurement only. Agent selection and titration are out of scope.","magnitude":"Roughly 10 mmHg of systolic reduction associates with about a 20 percent lower risk of major cardiovascular events across trials, with a larger relative effect on stroke than on coronary events.","home_measurement":"Home or ambulatory readings predict outcomes better than clinic readings and are what should drive the conversation.","cognitive_dividend":"SPRINT MIND found fewer cases of mild cognitive impairment under intensive control — one of the few interventions with any randomised cognitive signal."},"citations":["Ettehad et al. Lancet 2016 — blood pressure lowering and cardiovascular disease meta-analysis","SPRINT Research Group, NEJM 2015","SPRINT MIND Investigators, JAMA 2019","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-vo2max-cpet","type":"Marker","title":"VO2max by cardiopulmonary exercise test","summary":"Directly measured maximal oxygen uptake from expired gas analysis during a graded exercise test to exhaustion — the reference standard for aerobic capacity.","attrs":{"quality_tier":"A","noise":"low","cost":"high","invasiveness":"minimal","min_useful_interval":"6 months","ingestible_via":"lab-pdf","what_it_estimates":"Maximal rate of oxygen uptake, in mL/kg/min — the true ceiling on aerobic work.","unit":"mL/kg/min","interpretation":"Read as a percentile for age and sex, not as an absolute. The percentile is what carries the mortality association.","noise_cv_pct":"roughly 3–5 percent test-retest in a competent lab","practical_note":"Requires a genuine maximal effort; a submaximal or prematurely terminated test underestimates and should not be trended against a true max."},"citations":["Ross et al. Circulation 2016 — AHA statement on cardiorespiratory fitness as a clinical vital sign","American College of Sports Medicine, Guidelines for Exercise Testing and Prescription, 11th ed.","Mandsager et al. JAMA Netw Open 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-vo2max-wearable","type":"Marker","title":"VO2max estimate from a wearable","summary":"A watch's VO2max number, inferred from the relationship between heart rate and pace during outdoor activity — useful as a personal trend, unreliable as a number.","attrs":{"quality_tier":"C","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"4 weeks","ingestible_via":"wearable-api","what_it_estimates":"An algorithmic proxy for maximal oxygen uptake derived from submaximal heart-rate-to-pace behaviour.","validation_reality":"Validation studies typically report mean errors of a few mL/kg/min with limits of agreement wide enough that an individual value can be off by 10–15 percent in either direction, and the algorithms differ between manufacturers.","comparability":"Not comparable across brands, and often not comparable across firmware versions on the same brand. Treat a device change as starting a new series.","corruption_modes":"Needs GPS-tracked outdoor running or walking on most platforms; hills, wind, heat, and treadmill work distort it. A number that improves after a cool week may only reflect the weather.","why_it_is_here":"Deliberately included so the interface can put a Tier C estimate next to the Tier A measurement and show what the difference costs."},"citations":["Molina-Garcia et al. Sports Med 2022 — validity of wearable-estimated cardiorespiratory fitness systematic review","Passler et al. Sensors 2019 — validity of consumer VO2max estimates","Ross et al. Circulation 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-apob","type":"Marker","title":"Apolipoprotein B","summary":"A direct count of atherogenic particles — one ApoB molecule per LDL, IDL, VLDL and Lp(a) particle — measured on a standardised immunoassay.","attrs":{"quality_tier":"B","noise":"low","cost":"low","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"The number of circulating atherogenic particles, which is the causal exposure for atherosclerosis.","unit":"mg/dL","fasting":"Does not require fasting, unlike a calculated LDL-C.","assay_quality":"Well standardised with low analytical variability — biological week-to-week variation dominates, and that is modest.","attia_position":"Attia treats ApoB as the primary lipid number and targets values far below guideline thresholds.","consensus_note":"Using ApoB in preference to LDL-C is supported and now appears in ESC/EAS and Canadian guidance. The aggressive target is where the author position outruns tested evidence — see the elevated-ApoB risk factor node.","min_interval_reason":"Three months is set by how long it takes a diet, drug or weight change to reach a new steady state; measuring weekly reads assay and biological noise as signal."},"citations":["Sniderman et al. JAMA Cardiol 2019 — ApoB and risk","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias","Pearson et al. Can J Cardiol 2021 — CCS dyslipidemia guidelines"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-ldl-c","type":"Marker","title":"LDL cholesterol","summary":"The cholesterol mass carried inside LDL particles — the number everyone has, usually calculated rather than measured, and a slightly worse proxy for risk than the particle count.","attrs":{"quality_tier":"B","noise":"moderate","cost":"free","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"Cholesterol mass within LDL particles; a proxy for particle burden that fails when particles are cholesterol-poor.","unit":"mg/dL","calculation_caveat":"Usually derived by the Friedewald or Martin-Hopkins equation rather than measured; Friedewald becomes unreliable at low LDL-C and high triglycerides.","discordance":"In roughly one person in five, ApoB and LDL-C disagree about risk category — typically people with insulin resistance, high triglycerides or small dense particles, in whom LDL-C looks reassuring while the particle count does not.","why_both_are_in_the_graph":"LDL-C is what almost every user already has in a PDF; ApoB is what should be ordered next. Showing them side by side is the teaching moment."},"citations":["2018 AHA/ACC/Multisociety Cholesterol Guideline","Sniderman et al. JAMA Cardiol 2019 — discordance analysis","Martin et al. JAMA 2013 — improved LDL-C estimation"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-lpa","type":"Marker","title":"Lipoprotein(a)","summary":"An inherited, largely lifelong-stable atherogenic particle concentration — measured once, acted on forever.","attrs":{"quality_tier":"B","noise":"low","cost":"low","invasiveness":"minimal","min_useful_interval":"lifetime — once is usually enough","ingestible_via":"lab-pdf","what_it_estimates":"Circulating Lp(a) concentration, an independent and genetically determined ASCVD risk contributor.","unit":"nmol/L preferred; mg/dL still common","unit_trap":"The two units are not interchangeable by a fixed factor because of isoform size variation; a PDF reporting mg/dL against a nmol/L threshold is a real source of misreading.","stability":"Genetically set and stable across adult life apart from
