severity":"moderate","baseline_incidence":"low back pain is the most common complaint in rowers, affecting a large minority over a season, with rib stress fractures a less common but characteristic injury","severity_note":"Low back pain can be persistent and is the reason rowing is cautioned rather than recommended in anyone with an existing lumbar problem.","incidence_note":"Strongly technique-dependent. Loaded lumbar flexion under fatigue is the mechanism, so risk rises sharply in long erg pieces performed with deteriorating form.","modifiers_that_raise_it":["existing low back pain","long continuous erg pieces","poor sequencing under fatigue","high stroke rate with heavy drag","no technique coaching"]},"citations":["Thornton et al. Clin J Sport Med 2017 — rowing injury prevention consensus","Wilson et al. Br J Sports Med 2010 — low back pain in rowers","Yoshiga & Higuchi, Eur J Appl Physiol 2003"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-hiking|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-hiking","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"moderate","baseline_incidence":"low per hour; ankle sprains and knee pain dominate, and the majority of hiking injuries occur on descent","severity_note":"Usually minor. Consequence is amplified by remoteness — the same sprained ankle is trivial in a park and serious eight kilometres from a road.","incidence_note":"Descent, fatigue late in a long day, and pack weight are the main drivers rather than total distance.","modifiers_that_raise_it":["steep descent","uneven or wet terrain","heavy pack","fatigue late in the day","remote terrain without phone coverage","inadequate footwear"]},"citations":["Mitten et al. Am J Lifestyle Med 2018","Gatterer et al. Int J Environ Res Public Health 2021","Boulware et al. Wilderness Environ Med 2003 — hiking injuries and illnesses"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-hiking|RISK_OF|out-adv-heat-illness","type":"RISK_OF","from":"iv-hiking","to":"out-adv-heat-illness","attrs":{"severity":"moderate","baseline_incidence":"uncommon overall but a leading cause of search-and-rescue callouts in hot regions during summer months","severity_note":"Heat exhaustion through to heat stroke. Remoteness and limited water carry make the trajectory worse than an equivalent episode near home.","incidence_note":"Long duration at moderate intensity in sun with limited shade and finite water is the classic setup — arguably a higher heat exposure than a short hard run in the same conditions.","modifiers_that_raise_it":["exposed terrain with no shade","limited water carry","midday start","poor acclimatisation","diuretic or anticholinergic medication","older age"]},"citations":["Casa et al. J Athl Train 2015","Racinais et al. Br J Sports Med 2015","Boulware et al. Wilderness Environ Med 2003"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking|RISK_OF|out-adv-hypoglycemia","type":"RISK_OF","from":"iv-post-meal-walking","to":"out-adv-hypoglycemia","attrs":{"severity":"mild","baseline_incidence":"essentially zero in people not taking insulin or insulin secretagogues; uncommon but real in those who are, particularly when the walk follows a mealtime insulin dose","severity_note":"Usually mild and self-treated. Severe episodes are rare at this exercise intensity and duration.","incidence_note":"The mechanism is the intervention working as intended — insulin-independent glucose uptake stacked on top of injected insulin. Included so that the graph does not present a universally trivial intervention as trivially safe for everyone.","modifiers_that_raise_it":["mealtime insulin","sulfonylurea or meglitinide therapy","longer or brisker walk than usual","alcohol with the meal"]},"citations":["Riddell et al. Lancet Diabetes Endocrinol 2017 — exercise management in insulin-treated diabetes","Colberg et al. Diabetes Care 2016","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-time-restricted-eating|RISK_OF|out-adv-hypoglycemia","type":"RISK_OF","from":"iv-time-restricted-eating","to":"out-adv-hypoglycemia","attrs":{"severity":"moderate","baseline_incidence":"negligible in people not on glucose-lowering medication; meaningful in those taking insulin or sulfonylureas, where an extended fast without dose adjustment is a recognised cause of hypoglycaemia","severity_note":"Can be severe in insulin-treated people, particularly overnight or when the fast is extended beyond the planned window.","incidence_note":"Entirely a medication-interaction risk rather than a property of fasting itself. Anyone on these agents needs the regimen reviewed before compressing their eating window, which is a clinician conversation and not something this graph resolves.","modifiers_that_raise_it":["insulin therapy","sulfonylurea or meglitinide therapy","alcohol","extending the fast beyond the intended window","unaccustomed exercise during the fasted period"]},"citations":["ADA Standards of Care in Diabetes 2025 — hypoglycaemia","Riddell et al. Lancet Diabetes Endocrinol 2017","Lowe et al. JAMA Intern Med 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|RISK_OF|out-adv-hypoglycemia","type":"RISK_OF","from":"iv-energy-balance-weight-loss","to":"out-adv-hypoglycemia","attrs":{"severity":"moderate","baseline_incidence":"negligible without glucose-lowering medication; common enough in insulin- or sulfonylurea-treated people that structured weight-loss programmes build medication de-escalation into the protocol from day one","severity_note":"Can be severe. In DiRECT, medication withdrawal at the start of the intervention was a defining part of the design rather than an afterthought.","incidence_note":"Improving insulin sensitivity rapidly while drug doses stay fixed is a predictable route to hypoglycaemia. Predictable means preventable, with supervision.","modifiers_that_raise_it":["insulin therapy","sulfonylurea or meglitinide therapy","rapid or very low energy deficit","concurrent increase in exercise"]},"citations":["Lean et al. Lancet 2018 — DiRECT protocol and medication withdrawal","ADA Standards of Care in Diabetes 2025","Riddell et al. Lancet Diabetes Endocrinol 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-muscular-strength|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-muscular-strength","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-lean-mass|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-lean-mass","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-bone-density|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-bone-density","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-stability-balance|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-stability-balance","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-joint-mobility|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-joint-mobility","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-tendon-capacity|PART_OF|sys-musculoskeletal","type":"PART_OF","from":"fn-tendon-capacity","to":"sys-musculoskeletal","attrs":{},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-muscular-strength|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-muscular-strength","to":"out-independent-mobility","attrs":{"mechanism":"Strength is what lets you rise from a chair, climb stairs and carry a load without help. Below a threshold, ordinary tasks stop being possible.","evidence_strength":"high","certainty":"high"},"citations":["Cochrane - progressive resistance training in older adults (2009)","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-muscular-strength|PROTECTS|out-fall-freedom","type":"PROTECTS","from":"fn-muscular-strength","to":"out-fall-freedom","attrs":{"mechanism":"Leg strength and rate of force development decide whether a stumble becomes a recovery step or a fall.","evidence_strength":"moderate","certainty":"moderate"},"citations":["Cochrane - exercise for preventing falls in older people (2019)","USPSTF falls prevention in community-dwelling older adults (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-lean-mass|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-lean-mass","to":"out-independent-mobility","attrs":{"mechanism":"Lean mass is the reserve that strength is drawn from and the buffer that carries a person through illness, surgery and enforced bed rest.","evidence_strength":"moderate","certainty":"moderate"},"citations":["EWGSOP2 sarcopenia consensus (2019)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-bone-density|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-bone-dens ty-dwelling older adults (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-swimming","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-swimming","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Full aerobic stimulus with no impact loading at all. The trade is that it removes the bone loading running provided, so pair it with resistance or impact work.","applies_for":["md-chronic-low-back-pain","md-plantar-fasciitis","md-knee-osteoarthritis","md-achilles-tendinopathy","md-dislikes-running"]},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-cycling","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-cycling","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Matches the aerobic stimulus with far lower joint and tendon load; also unloads the lumbar spine compared with running.","applies_for":["md-chronic-low-back-pain","md-plantar-fasciitis","md-knee-osteoarthritis","md-achilles-tendinopathy","md-dislikes-running"]},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-elliptical","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-elliptical","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Closest movement pattern to running without the impact; useful when the goal is to keep the running-specific rhythm during a symptomatic period.","applies_for":["md-plantar-fasciitis","md-achilles-tendinopathy","md-knee-osteoarthritis"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-rowing","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-rowing","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Equivalent aerobic demand with upper body involvement, but it loads the lumbar spine in flexion - a poor swap for a painful back specifically.","applies_for":["md-plantar-fasciitis","md-knee-osteoarthritis"],"not_suitable_for":["md-chronic-low-back-pain"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-rucking","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-rucking","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"lower","reason":"Lower peak aerobic demand per hour, but it keeps weight-bearing and adds a strength and bone stimulus running gave you.","applies_for":["md-knee-osteoarthritis","md-dislikes-running","md-prefers-outdoors"]},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-zone2-running|SUBSTITUTES|iv-walking","type":"SUBSTITUTES","from":"iv-zone2-running","to":"iv-walking","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"much_lower","reason":"Substantially lower aerobic stimulus for most people, but it is available to nearly everyone and the adherence is unmatched.","applies_for":["md-beginner-deconditioned","md-older-adult","md-obesity"]},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-swimming|SUBSTITUTES|iv-cycling","type":"SUBSTITUTES","from":"iv-swimming","to":"iv-cycling","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"The usual fallback when there is no pool - comparable aerobic stimulus, still low impact.","applies_for":["md-no-pool-access"]},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-swimming|SUBSTITUTES|iv-rowing","type":"SUBSTITUTES","from":"iv-swimming","to":"iv-rowing","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Keeps the whole-body upper-and-lower pattern that swimmers tend to prefer, on land.","applies_for":["md-no-pool-access"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-swimming|SUBSTITUTES|iv-elliptical","type":"SUBSTITUTES","from":"iv-swimming","to":"iv-elliptical","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Low-impact and widely available; less interesting to most people, which shows up as worse adherence.","applies_for":["md-no-pool-access"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-rowing|SUBSTITUTES|iv-cycling","type":"SUBSTITUTES","from":"iv-rowing","to":"iv-cycling","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Removes the repeated loaded lumbar flexion that makes rowing a poor fit for a painful back.","applies_for":["md-chronic-low-back-pain","md-osteoporosis"]},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-rucking|SUBSTITUTES|iv-hiking","type":"SUBSTITUTES","from":"iv-rucking","to":"iv-hiking","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Same weight-bearing outdoor stimulus with terrain supplying the load instead of a pack.","applies_for":["md-prefers-outdoors","md-chronic-low-back-pain"]},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-hiking|SUBSTITUTES|iv-stair-climbing","type":"SUBSTITUTES","from":"iv-hiking","to":"iv-stair-climbing","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"lower","reason":"Reproduces the ascent stimulus indoors when weather, daylight or time rule out getting to a trail.","applies_for":["md-time-poor","md-cold-climate"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-vo2max-intervals|SUBSTITUTES|iv-stair-climbing","type":"SUBSTITUTES","from":"iv-vo2max-intervals","to":"iv-stair-climbing","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Stair repeats reach high intensity with lower eccentric load and less technique demand than running intervals.","applies_for":["md-knee-osteoarthritis","md-time-poor","md-dislikes-running"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-elliptical|SUBSTITUTES|iv-cycling","type":"SUBSTITUTES","from":"iv-elliptical","to":"iv-cycling","attrs":{"serves_function_id":"fn-aerobic-capacity","effect_delta":"comparable","reason":"Interchangeable for aerobic purposes; pick on access and on which one gets used.","applies_for":["md-no-gym-access"]},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-resistance-training|SUBSTITUTES|iv-farmers-carry","type":"SUBSTITUTES","from":"iv-resistance-training","to":"iv-farmers-carry","attrs":{"serves_function_id":"fn-muscular-strength","effect_delta":"lower","reason":"A single loaded carry covers grip, trunk and legs at once - the best return when equipment or time is the constraint.","applies_for":["md-no-gym-access","md-time-poor","md-prefers-home-workouts"]},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-resistance-training|SUBSTITUTES|iv-quadriceps-strengthening","type":"SUBSTITUTES","from":"iv-resistance-training","to":"iv-quadriceps-strengthening","attrs":{"serves_function_id":"fn-muscular-strength","effect_delta":"lower","reason":"Narrower target, but it is the specific loading with the strongest evidence when knee pain is the limiting factor.","applies_for":["md-knee-osteoarthritis"]},"citations":["Cochrane - exercise for knee osteoarthritis (2015)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-resistance-training|SUBSTITUTES|iv-plyometrics","type":"SUBSTITUTES","from":"iv-resistance-training","to":"iv-plyometrics","attrs":{"serves_function_id":"fn-bone-density","effect_delta":"comparable","reason":"For bone specifically, strain rate substitutes for load magnitude, and jumping needs no equipment.","applies_for":["md-no-gym-access","md-prefers-home-workouts","md-time-poor"]},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-plyometrics|SUBSTITUTES|iv-resistance-training","type":"SUBSTITUTES","from":"iv-plyometrics","to":"iv-resistance-training","attrs":{"serves_function_id":"fn-bone-density","effect_delta":"comparable","reason":"Where impact is unwise - reduced bone density, joint pain, pregnancy - heavy loading supplies a bone stimulus without landing forces.","applies_for":["md-osteoporosis","md-knee-osteoarthritis","md-pregnancy","md-obesity"]},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-farmers-carry|SUBSTITUTES|iv-grip-training","type":"SUBSTITUTES","from":"iv-farmers-carry","to":"iv-grip-training","attrs":{"serves_function_id":"fn-muscular-strength","effect_delta":"lower","reason":"Isolates the grip component when carrying under load is not available or not tolerated.","applies_for":["md-no-gym-access","md-chronic-low-back-pain"]},"citations":["Roberts et al. - standardised protocol for grip strength measurement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-balance-training|SUBSTITUTES|iv-hiking","type":"SUBSTITUTES","from":"iv-balance-training","to":"iv-hiking","attrs":{"serves_function_id":"fn-stability-balance","effect_delta":"lower","reason":"Uneven ground trains balance incidentally, but without the deliberate progression that makes formal balance work effective.","applies_for":["md-prefers-outdoors"]},"citations":["Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-hip-mobility|SUBSTITUTES|iv-swimming","type":"SUBSTITUTES","from":"iv-hip-mobility","to":"iv-swimming","attrs":{"serves_function_id":"fn-joint-mobility","effect_delta":"lower","reason":"Moves the hip through large ranges without compression; less targeted than dedicated range work.","applies_for":["md-hip-osteoarthritis","md-prefers-swimming"]},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|REQUIRES|iv-zone2-running|posterior-chain","type":"REQUIRES","from":"md-chronic-low-back-pain","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-posterior-chain-strength","reason":"Running loads a spine that a painful back has usually stopped preparing for. Building hip extensor and spinal extensor capacity first is what makes the return tolerable rather than a cycle of flares.","sequencing":"4-6 weeks of twice-weekly hinge-pattern loading before reintroducing running, then progress both together.","resolution":"Posterior chain work comes first, then running is reintroduced progressively - not removed.","qualifier":"posterior-chain"},"citations":["NICE NG59 low back pain and sciatica","BJSM consensus - return to running after injury"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|REQUIRES|iv-zone2-running|trunk-stability","type":"REQUIRES","from":"md-chronic-low-back-pain","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-trunk-stability","reason":"Running is thousands of repetitions of resisting trunk rotation and lateral collapse. Anti-movement capacity is the specific quality that has to exist first.","sequencing":"Runs concurrently with the posterior chain block; 2-3 short sessions per week, continued once running resumes.","resolution":"Anti-rotation and anti-extension work alongside the strength block, kept in the programme afterwards.","qualifier":"trunk-stability"},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|REQUIRES|iv-rucking","type":"REQUIRES","from":"md-chronic-low-back-pain","to":"iv-rucking","attrs":{"prerequisite_node_id":"iv-trunk-stability","reason":"External load on the back is exactly the demand a painful spine is least prepared for, and pack load raises compressive load throughout the walk rather than in brief peaks.","sequencing":"Establish trunk work first, then start at a light pack and add load before adding distance.","resolution":"Rucking stays on the list; it starts light and after trunk work rather than at your previous load."},"citations":["NICE NG59 low back pain and sciatica","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|CAUTIONS|iv-rowing","type":"CAUTIONS","from":"md-chronic-low-back-pain","to":"iv-rowing","attrs":{"caveat":"Rowing repeats loaded lumbar flexion several thousand times an hour, and technique degrades toward more flexion as you tire. It is the aerobic option that most often provokes a flare.","severity":"moderate","resolution":"Kept as an option with shorter pieces and attention to the finish position - but cycling or swimming substitute cleanly and are the easier choice while symptoms are active."},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|CAUTIONS|iv-resistance-training","type":"CAUTIONS","from":"md-chronic-low-back-pain","to":"iv-resistance-training","attrs":{"caveat":"Loading is part of the treatment, not a threat - but heavy hinge and squat patterns are where flares cluster when load rises faster than tolerance.","severity":"mild","resolution":"Continue training. Progress load in smaller steps and expect that some soreness is not damage."},"citations":["NICE NG59 low back pain and sciatica","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-chronic-low-back-pain","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Start hinge patterns from an elevated bar or box to shorten the range, keep loaded end-range flexion out of the early weeks, and add range back before adding load.","reason":"Reduces peak lumbar demand while keeping the training stimulus, which is what the evidence supports over avoidance."},"citations":["NICE NG59 low back pain and sciatica","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|ADJUSTS|iv-posterior-chain-strength","type":"ADJUSTS","from":"md-chronic-low-back-pain","to":"iv-posterior-chain-strength","attrs":{"dimension":"dose","adjustment":"Two sessions a week, low sets, load increased only when the previous week produced no next-day symptom increase.","reason":"The prerequisite itself has to be dosed conservatively or it becomes the flare it was meant to prevent."},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain|CAUTIONS|iv-vo2max-intervals","type":"CAUTIONS","from":"md-chronic-low-back-pain","to":"iv-vo2max-intervals","attrs":{"caveat":"High-speed running multiplies both ground reaction force and trunk control demand at the point where fatigue is highest.","severity":"moderate","resolution":"Defer hard running intervals until easy running is comfortable; get the intensity from cycling or stair repeats in the meantime."},"citations":["NICE NG59 low back pain and sciatica","BJSM consensus - return to running after injury"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|ADJUSTS|iv-zone2-running|footwear","type":"ADJUSTS","from":"md-plantar-fasciitis","to":"iv-zone2-running","attrs":{"dimension":"equipment","adjustment":"Choose shoes with adequate heel cushioning and a heel-to-toe drop that does not increase tension under the arch; a temporary heel raise or prefabricated insert is a reasonable trial.","reason":"Reducing peak tension under the plantar fascia is the mechanical half of settling heel pain. Comfort is the best available selection criterion.","qualifier":"footwear"},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)","Cochrane and BJSM reviews of foot orthoses - findings mixed"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|ADJUSTS|iv-zone2-running|volume","type":"ADJUSTS","from":"md-plantar-fasciitis","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Cut weekly running volume until first-step morning pain is settling, then rebuild in small increments. Judge each run by the next morning rather than by how it felt at the time.","reason":"Plantar heel pain is almost always a volume problem. The 24-hour symptom response is the usable dosing signal.","qualifier":"volume"},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-plantar-fasciitis","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-calf-plantar-loading","reason":"High-load plantar and calf work is the intervention with the best support for this condition, and it has to be established before running volume goes back up or the pain returns.","sequencing":"Daily loading for several weeks alongside reduced running, then maintenance twice weekly as volume rebuilds.","resolution":"Calf and plantar loading starts now; running continues at reduced volume rather than stopping."},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)","Alfredson eccentric calf loading protocol (1998)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|CAUTIONS|iv-rucking","type":"CAUTIONS","from":"md-plantar-fasciitis","to":"iv-rucking","attrs":{"caveat":"External load raises plantar tension throughout every step, and pack walking is usually long-duration, so the exposure adds up quickly.","severity":"moderate","resolution":"Reduce pack weight and distance while symptoms are active; supportive footwear matters more here than in unloaded walking."},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-plantar-fasciitis","to":"iv-hiking","attrs":{"caveat":"Long descents and uneven ground raise both duration and peak load under the arch.","severity":"mild","resolution":"Shorter routes and stiffer-soled footwear while settling; poles help offload on descent."},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis|ADJUSTS|iv-plyometrics","type":"ADJUSTS","from":"md-plantar-fasciitis","to":"iv-plyometrics","attrs":{"dimension":"dose","adjustment":"Hold impact work until first-step pain has largely settled, then reintroduce with low contact counts on a forgiving surface.","reason":"Jump landings produce the highest plantar tension of anything in the programme."},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-flat-feet|ADJUSTS|iv-zone2-running|footwear","type":"ADJUSTS","from":"md-flat-feet","to":"iv-zone2-running","attrs":{"dimension":"equipment","adjustment":"Select shoes on comfort over a real run rather than by stability category. Orthotics are a reasonable trial if symptoms are present, not a default for the foot shape itself.","reason":"The evidence for matching shoe type or orthotics to arch height is genuinely mixed, and this cell is labelled as mixed rather than asserted. Flat feet in the absence of symptoms are a poor predictor of injury.","evidence_note":"mixed evidence - stated as such deliberately","qualifier":"footwear"},"citations":["Cochrane and BJSM reviews of foot orthoses - findings mixed","JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-flat-feet|ADJUSTS|iv-zone2-running|progression","type":"ADJUSTS","from":"md-flat-feet","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Progress volume gradually and change one variable at a time, especially when changing shoes.","reason":"Where foot structure matters, it matters through how quickly load is applied, which is a progression question rather than an equipment one.","qualifier":"progression"},"citations":["BJSM consensus - return to running after injury","Cochrane and BJSM reviews of foot orthoses - findings mixed"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-flat-feet|ADJUSTS|iv-rucking","type":"ADJUSTS","from":"md-flat-feet","to":"iv-rucking","attrs":{"dimension":"equipment","adjustment":"Prioritise a supportive, well-fitted boot and break it in before loaded distance; added pack weight amplifies whatever the foot does under load.","reason":"Load carriage magnifies foot mechanics, so equipment choices that are optional for unloaded walking become worth attention here."},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine","Cochrane and BJSM reviews of foot orthoses - findings mixed"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-knee-osteoarthritis","to":"iv-zone2-running","attrs":{"caveat":"Running is not contraindicated by knee osteoarthritis. The widespread belief that it wears the joint out is not supported - recreational runners do not show higher rates of knee osteoarthritis than sedentary people, and the association that does exist sits at elite training volumes.","severity":"mild","resolution":"Running stays on the list. Progress load gradually, strengthen the quadriceps alongside, and judge sessions by the next 24 hours. Persistent swelling or pain that worsens run to run is the signal to reduce, not the diagnosis itself.","misconception_corrected":"that osteoarthritis rules out running","citation_note":"authored as a citation-heavy correction node"},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","OARSI non-surgical management of knee osteoarthritis (2019)","Cochrane - exercise for knee osteoarthritis (2015)","ACR/Arthritis Foundation osteoarthritis guideline (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-knee-osteoarthritis","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-quadriceps-strengthening","reason":"Quadriceps strengthening is the best-supported non-drug treatment for knee osteoarthritis, and a stronger knee tolerates running load better. This is the prerequisite that makes the caution above safe to give.","sequencing":"6 weeks of twice-weekly knee-dominant loading before increasing running volume; continue indefinitely alongside.","resolution":"Start the strengthening now; keep running at current volume while it builds."},"citations":["Cochrane - exercise for knee osteoarthritis (2015)","OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-knee-osteoarthritis","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Hold weekly volume steady during flares and increase in small steps otherwise. Softer surfaces and flatter routes reduce peak load without removing the activity.","reason":"Symptom-guided progression keeps the joint loaded, which is what maintains cartilage health and function, while avoiding the flare cycle that ends in stopping altogether."},"citations":["OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|CAUTIONS|iv-plyometrics","type":"CAUTIONS","from":"md-knee-osteoarthritis","to":"iv-plyometrics","attrs":{"caveat":"Landing forces are the highest joint loads in the programme and are more likely to provoke an osteoarthritic knee than steady running is.","severity":"moderate","resolution":"Introduce impact work only after strengthening is established, with low contact counts - or get the bone stimulus from heavy resistance training instead."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-knee-osteoarthritis","to":"iv-hiking","attrs":{"caveat":"Descent is the part that hurts. Eccentric quadriceps load on downhills is a common trigger for a knee that is otherwise comfortable on the flat.","severity":"mild","resolution":"Use poles, shorten descents, and build downhill tolerance deliberately rather than incidentally."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-knee-osteoarthritis","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Work in the range that is comfortable and expand it over time; some pain during loading is acceptable if it settles within 24 hours.","reason":"Pain-guided rather than pain-free loading is the standard rehabilitation approach and produces better outcomes than avoidance."},"citations":["OARSI non-surgical management of knee osteoarthritis (2019)","Cochrane - exercise for knee osteoarthritis (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|ELEVATES|iv-quadriceps-strengthening","type":"ELEVATES","from":"md-knee-osteoarthritis","to":"iv-quadriceps-strengthening","attrs":{"priority_delta":"large","reason":"This is first-line treatment for the condition itself, not just a support for running. It moves to the top of the list on its own merits."},"citations":["Cochrane - exercise for knee osteoarthritis (2015)","OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"md-knee-osteoarthritis","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"moderate","reason":"Where excess weight is present, loss produces meaningful pain and function improvement, and it multiplies the benefit of the strengthening work."},"citations":["OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-hip-osteoarthritis","to":"iv-zone2-running","attrs":{"caveat":"As with the knee, running is not ruled out - but hip osteoarthritis more often limits stride length and range, and symptoms tend to be less forgiving of volume jumps.","severity":"mild","resolution":"Continue at a tolerated volume with strengthening and range work alongside; cycling substitutes cleanly during symptomatic periods."},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-hip-osteoarthritis","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-hip-mobility","reason":"Lost hip extension and internal rotation get compensated for at the lumbar spine and the knee, which is how a hip problem becomes a back problem.","sequencing":"Daily short range sessions started immediately, maintained alongside running.","resolution":"Add hip range work now; running continues."},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","AAOS goniometric range-of-motion normative values"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis|ADJUSTS|iv-cycling","type":"ADJUSTS","from":"md-hip-osteoarthritis","to":"iv-cycling","attrs":{"dimension":"technique","adjustment":"Raise the saddle slightly and avoid deep hip flexion positions; a more upright position is usually better tolerated than an aggressive one.","reason":"Cycling is one of the best-tolerated options here, and small fit changes are usually enough to keep it comfortable."},"citations":["NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis|ELEVATES|iv-hip-mobility","type":"ELEVATES","from":"md-hip-osteoarthritis","to":"iv-hip-mobility","attrs":{"priority_delta":"moderate","reason":"Range work is part of first-line management for hip osteoarthritis rather than an optional extra."},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-hip-osteoarthritis","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Exercise therapy is first-line treatment for hip osteoarthritis; hip abductor and extensor strength in particular."},"citations":["OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement|CAUTIONS|iv-swimming","type":"CAUTIONS","from":"md-shoulder-impingement","to":"iv-swimming","attrs":{"caveat":"Freestyle and butterfly put the shoulder through repeated loaded overhead rotation - the exact position that provokes subacromial pain, at very high repetition counts.","severity":"moderate","resolution":"Swimming stays available. Reduce freestyle volume, use backstroke and breaststroke, and add pull buoy work to cut shoulder load while keeping the aerobic session."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement|ADJUSTS|iv-swimming","type":"ADJUSTS","from":"md-shoulder-impingement","to":"iv-swimming","attrs":{"dimension":"technique","adjustment":"Switch stroke selection toward breaststroke and backstroke, widen the hand entry, and reduce total freestyle distance rather than stopping.","reason":"Stroke mechanics change shoulder load more than total distance does."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement|CAUTIONS|iv-resistance-training","type":"CAUTIONS","from":"md-shoulder-impingement","to":"iv-resistance-training","attrs":{"caveat":"Overhead pressing and wide-grip pulling are the patterns that reproduce symptoms; the rest of the programme is usually unaffected.","severity":"mild","resolution":"Keep training. Substitute landmine and incline pressing for strict overhead work, and add rotator cuff and scapular loading."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-shoulder-impingement","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Press in the scapular plane rather than straight overhead, use a neutral grip, and work in the pain-free range while it expands.","reason":"Progressive loading in a tolerable range beats rest for subacromial pain; the position, not the load, is what needs changing."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement|ADJUSTS|iv-rowing","type":"ADJUSTS","from":"md-shoulder-impingement","to":"iv-rowing","attrs":{"dimension":"technique","adjustment":"Keep the handle low at the finish and avoid a high pull toward the collarbone.","reason":"A high finish position puts the shoulder into the provocative range on every stroke."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-achilles-tendinopathy","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-eccentric-loading","reason":"Progressive eccentric and heavy slow loading is the intervention with the strongest support for Achilles tendinopathy. Returning to running without it is the standard route to a recurrence.","sequencing":"Loading protocol daily for 6-12 weeks; return to running gated on symptom response and heel-raise capacity rather than on elapsed time.","resolution":"Start the loading protocol; running returns progressively once morning stiffness has settled and single-leg heel raise capacity is close to symmetrical."},"citations":["Alfredson eccentric calf loading protocol (1998)","JOSPT clinical practice guideline - Achilles tendinopathy (2018)","Cook and Purdam tendon pathology continuum model (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-achilles-tendinopathy","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Reduce volume and remove speed and hills first. Use morning stiffness the next day as the gate on whether the last run was too much.","reason":"Tendon responds to load on a 24-hour clock, which makes next-morning symptoms the most usable dosing signal available."},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|CAUTIONS|iv-plyometrics","type":"CAUTIONS","from":"md-achilles-tendinopathy","to":"iv-plyometrics","attrs":{"caveat":"Jumping and bounding are the highest Achilles loads there are, and a symptomatic tendon has less capacity than it did.","severity":"moderate","resolution":"Defer impact work until the loading protocol is well established, then reintroduce with low volume."},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-achilles-tendinopathy","to":"iv-hiking","attrs":{"caveat":"Sustained uphill walking holds the ankle in dorsiflexion under load, which many symptomatic tendons tolerate poorly.","severity":"mild","resolution":"Flatter routes while symptomatic; a small heel raise in the boot often helps."},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|ADJUSTS|iv-stair-climbing","type":"ADJUSTS","from":"md-achilles-tendinopathy","to":"iv-stair-climbing","attrs":{"dimension":"dose","adjustment":"Keep the whole foot on the step rather than working off the ball of the foot, and reduce duration while symptoms are settling.","reason":"Repeated loaded dorsiflexion at the top of each step is the provocative element, and it is avoidable without dropping the session."},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy|ELEVATES|iv-calf-plantar-loading","type":"ELEVATES","from":"md-achilles-tendinopathy","to":"iv-calf-plantar-loading","attrs":{"priority_delta":"large","reason":"Calf capacity is the direct determinant of Achilles load tolerance, and building it is the treatment rather than an adjunct to it."},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)","Hebert-Losier et al. - heel-rise test normative data"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|CAUTIONS|iv-resistance-training","type":"CAUTIONS","from":"md-osteoporosis","to":"iv-resistance-training","attrs":{"caveat":"Loading is strongly indicated - the caution is narrow and specific to heavily loaded end-range spinal flexion and twisting, which is where vertebral compression fractures happen.","severity":"moderate","resolution":"Train, and train heavy enough to matter. Design around loaded spinal flexion rather than around load itself."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-osteoporosis","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Avoid loaded end-range spinal flexion and rapid loaded rotation. Favour hip hinge patterns with a neutral spine, supported rows, and machine or bilateral variants where balance is a concern.","reason":"The evidence supports progressive loading in osteoporosis; the specific mechanism to design around is flexion-based vertebral compression, not intensity."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-osteoporosis","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Progressive loading is one of the few things that changes bone trajectory, and it simultaneously addresses the muscle weakness that raises fall risk."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|ELEVATES|iv-balance-training","type":"ELEVATES","from":"md-osteoporosis","to":"iv-balance-training","attrs":{"priority_delta":"large","reason":"Fracture risk is bone fragility multiplied by falls. With density already low, not falling is the half of the equation with the most headroom."},"citations":["USPSTF falls prevention in community-dwelling older adults (2018)","Cochrane - exercise for preventing falls in older people (2019)","Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|ELEVATES|iv-farmers-carry","type":"ELEVATES","from":"md-osteoporosis","to":"iv-farmers-carry","attrs":{"priority_delta":"moderate","reason":"Loaded carries deliver axial load through the spine and hip with a neutral spine and no flexion demand - well suited to this constraint."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|CAUTIONS|iv-plyometrics","type":"CAUTIONS","from":"md-osteoporosis","to":"iv-plyometrics","attrs":{"caveat":"High strain rate is what bone responds to, but with established osteoporosis the landing forces themselves carry fracture risk.","severity":"moderate","resolution":"Impact work only after clinical review of fracture risk; heavy resistance training supplies a bone stimulus without landing forces."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|CAUTIONS|iv-rowing","type":"CAUTIONS","from":"md-osteoporosis","to":"iv-rowing","attrs":{"caveat":"Rowing is thousands of repetitions of loaded lumbar flexion - the specific pattern associated with vertebral compression fracture in low bone density.","severity":"moderate","resolution":"Prefer cycling or the elliptical for the same aerobic stimulus without repeated loaded flexion."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis|ADJUSTS|iv-trunk-stability","type":"ADJUSTS","from":"md-osteoporosis","to":"iv-trunk-stability","attrs":{"dimension":"technique","adjustment":"Build the programme from anti-extension and extension-biased work; leave out loaded sit-ups, crunches and weighted rotation.","reason":"Trunk strength is worth having here; the standard flexion-based exercises are the part that has to change."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteopenia|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-osteopenia","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"This is the window where loading can still change the trajectory, and where the fracture-risk constraints that apply to established osteoporosis have not yet kicked in."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteopenia|ELEVATES|iv-plyometrics","type":"ELEVATES","from":"md-osteopenia","to":"iv-plyometrics","attrs":{"priority_delta":"moderate","reason":"Impact loading is well tolerated at this density and supplies the strain rate that bone actually responds to."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteopenia|ELEVATES|iv-balance-training","type":"ELEVATES","from":"md-osteopenia","to":"iv-balance-training","attrs":{"priority_delta":"moderate","reason":"Fall prevention starts earning its place well before density reaches the osteoporosis threshold."},"citations":["USPSTF falls prevention in community-dwelling older adults (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteopenia|ADJUSTS|iv-plyometrics","type":"ADJUSTS","from":"md-osteopenia","to":"iv-plyometrics","attrs":{"dimension":"dose","adjustment":"Start with low hops and small contact counts, build over weeks, and treat contacts as the variable to progress rather than session length.","reason":"Bone adapts to strain rate with a low volume ceiling; more contacts add injury risk without adding bone benefit."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-obesity","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Start with walk-run intervals and build the walking base first. Increase frequency before duration and duration before speed.","reason":"Joint and tendon load per step is higher, so the tissue needs a longer runway - the limit is the connective tissue, not the cardiovascular system."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-obesity","to":"iv-zone2-running","attrs":{"caveat":"Higher per-step loading raises the risk of plantar, Achilles and knee complaints in the first months, which is when most people quit.","severity":"mild","resolution":"Running stays available and gets easier as capacity builds. Low-impact options carry the aerobic load in the meantime without costing progress."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-obesity","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Preserves lean mass during weight loss, is well tolerated regardless of body size, and improves function faster than aerobic work at this starting point."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","Morton et al., BJSM (2018) - protein supplementation meta-analysis"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ELEVATES|iv-swimming","type":"ELEVATES","from":"md-obesity","to":"iv-swimming","attrs":{"priority_delta":"moderate","reason":"Removes the joint loading constraint entirely, which makes a full aerobic dose available from day one."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ELEVATES|iv-cycling","type":"ELEVATES","from":"md-obesity","to":"iv-cycling","attrs":{"priority_delta":"moderate","reason":"Weight-supported, scalable to any starting fitness, and does not require a pool."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ADJUSTS|iv-plyometrics","type":"ADJUSTS","from":"md-obesity","to":"iv-plyometrics","attrs":{"dimension":"dose","adjustment":"Defer jumping until a strength base exists; use step-ups and fast concentric work for the same movement quality without landing forces.","reason":"Landing forces scale with body mass and are the least favourable risk-to-benefit trade at this starting point."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity|ADJUSTS|iv-hiking","type":"ADJUSTS","from":"md-obesity","to":"iv-hiking","attrs":{"dimension":"dose","adjustment":"Shorter routes with less descent to start; poles reduce knee load on the way down.","reason":"Descent load is the part that scales worst with body mass."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-asthma|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-asthma","to":"iv-vo2max-intervals","attrs":{"dimension":"technique","adjustment":"Use a longer graded warm-up, have the reliever inhaler available, and treat a bad-air or high-pollen day as a reason to move the session indoors.","reason":"A proper warm-up produces a refractory period that reduces exercise-induced bronchoconstriction, and high-ventilation work is the main trigger."},"citations":["GINA global strategy for asthma management (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-asthma|CAUTIONS|iv-vo2max-intervals","type":"CAUTIONS","from":"md-asthma","to":"iv-vo2max-intervals","attrs":{"caveat":"Sustained high ventilation is the classic trigger for exercise-induced bronchoconstriction, particularly in cold or dry air.","severity":"mild","resolution":"Intervals stay on the list with well-controlled asthma. Warm up thoroughly, and reconsider the session if control has been poor recently."},"citations":["GINA global strategy for asthma management (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-asthma|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-asthma","to":"iv-zone2-running","attrs":{"dimension":"environment","adjustment":"Cover the mouth in cold dry air, avoid high-pollen and high-pollution windows, and move indoors when conditions are bad.","reason":"Air temperature, humidity and irritant load do more to provoke symptoms than the running itself does."},"citations":["GINA global strategy for asthma management (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-asthma|ELEVATES|iv-swimming","type":"ELEVATES","from":"md-asthma","to":"iv-swimming","attrs":{"priority_delta":"moderate","reason":"Warm humid air is the least provocative environment for exercise-induced bronchoconstriction, though chlorine is its own irritant for some people."},"citations":["GINA global strategy for asthma management (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gerd|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-gerd","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Reduce prolonged breath-holding under heavy load, keep the torso upright where possible, and leave more time between eating and training.","reason":"Raised intra-abdominal pressure and supine positions both promote reflux; both are adjustable without changing what you train."},"citations":["ACG clinical guideline - GERD (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gerd|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-gerd","to":"iv-zone2-running","attrs":{"dimension":"timing","adjustment":"Leave two to three hours after a substantial meal before running, and keep pre-run food small and low in fat.","reason":"Running is the most reflux-provoking common aerobic activity, and meal timing is the highest-yield adjustment."},"citations":["ACG clinical guideline - GERD (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gerd|ELEVATES|iv-post-meal-walking","type":"ELEVATES","from":"md-gerd","to":"iv-post-meal-walking","attrs":{"priority_delta":"small","reason":"Upright gentle movement after eating is compatible with reflux management and gets the metabolic benefit at the same time."},"citations":["ACG clinical guideline - GERD (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gerd|ADJUSTS|iv-time-restricted-eating","type":"ADJUSTS","from":"md-gerd","to":"iv-time-restricted-eating","attrs":{"dimension":"timing","adjustment":"Place the eating window earlier in the day and finish at least three hours before lying down.","reason":"Late eating is one of the more consistent reflux aggravators, so the window placement matters more than its length."},"citations":["ACG clinical guideline - GERD (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-atrial-fibrillation|CAUTIONS|iv-vo2max-intervals","type":"CAUTIONS","from":"md-atrial-fibrillation","to":"iv-vo2max-intervals","attrs":{"caveat":"During an episode, heart rate is chaotic and can be very high at low workloads. Intensity targets set from heart rate become meaningless and can push effort far beyond what was intended.","severity":"moderate","resolution":"Prescribe intensity by perceived exertion or the talk test instead of heart rate. Stop for new breathlessness, chest discomfort or lightheadedness rather than pushing through."},"citations":["ESC atrial fibrillation guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-atrial-fibrillation|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-atrial-fibrillation","to":"iv-vo2max-intervals","attrs":{"dimension":"intensity","adjustment":"Use rating of perceived exertion or the talk test to set intensity; treat any heart-rate-derived zone as non-informative during atrial fibrillation.","reason":"The measurement the zone model depends on stops representing effort when the rhythm is irregular."},"citations":["ESC atrial fibrillation guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-atrial-fibrillation|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-atrial-fibrillation","to":"iv-zone2-running","attrs":{"dimension":"intensity","adjustment":"Set easy-pace effort by conversational ability rather than by a heart rate ceiling.","reason":"The whole point of a zone 2 prescription is a physiological intensity, and heart rate stops indexing it here."},"citations":["ESC atrial fibrillation guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-atrial-fibrillation|CAUTIONS|iv-swimming","type":"CAUTIONS","from":"md-atrial-fibrillation","to":"iv-swimming","attrs":{"caveat":"An episode with lightheadedness is a different problem in water than on land.","severity":"moderate","resolution":"Swim in supervised, lifeguarded settings and avoid solo open water while episodes are occurring."},"citations":["ESC atrial fibrillation guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|BLOCKS|iv-vo2max-intervals","type":"BLOCKS","from":"md-uncontrolled-hypertension","to":"iv-vo2max-intervals","attrs":{"reason":"With blood pressure persistently and substantially above target, maximal-effort work produces large transient pressure spikes on top of an already elevated baseline.","severity":"moderate","resolution":"Hold high-intensity intervals until blood pressure is under control. Walking, easy aerobic work and moderate resistance training continue, and they are part of what brings the pressure down.","routing":"review with the clinician managing blood pressure","temporary":true,"suppress_substitutes":false},"citations":["ACC/AHA hypertension guideline (2017)","AHA scientific statement - resistance exercise and cardiovascular disease (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|CAUTIONS|iv-resistance-training","type":"CAUTIONS","from":"md-uncontrolled-hypertension","to":"iv-resistance-training","attrs":{"caveat":"Resistance training is beneficial and recommended here. The narrow concern is maximal effort with prolonged breath-holding, which produces the largest acute pressure response of anything in training.","severity":"mild","resolution":"Keep training at moderate loads with controlled breathing; leave near-maximal singles until pressure is controlled."},"citations":["AHA scientific statement - resistance exercise and cardiovascular disease (2007)","ACC/AHA hypertension guideline (2017)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-uncontrolled-hypertension","to":"iv-resistance-training","attrs":{"dimension":"intensity","adjustment":"Work in the moderate load range with several repetitions in reserve, exhale through the effort, and avoid prolonged Valsalva.","reason":"The acute pressure response scales with effort and breath-holding far more than with total training volume."},"citations":["AHA scientific statement - resistance exercise and cardiovascular disease (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|ADJUSTS|iv-farmers-carry","type":"ADJUSTS","from":"md-uncontrolled-hypertension","to":"iv-farmers-carry","attrs":{"dimension":"intensity","adjustment":"Use moderate loads over longer distances rather than very heavy short carries, and keep breathing continuous.","reason":"Heavy carries encourage a sustained brace, which is the pressure-raising element."},"citations":["AHA scientific statement - resistance exercise and cardiovascular disease (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|ELEVATES|iv-walking","type":"ELEVATES","from":"md-uncontrolled-hypertension","to":"iv-walking","attrs":{"priority_delta":"moderate","reason":"Available immediately, no pressure spike, and a real contributor to bringing blood pressure down."},"citations":["ACC/AHA hypertension guideline (2017)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension|ELEVATES|iv-bp-control-adherence","type":"ELEVATES","from":"md-uncontrolled-hypertension","to":"iv-bp-control-adherence","attrs":{"priority_delta":"large","reason":"This is the modifier that unblocks the rest of the plan, so it sits above the training decisions rather than beside them."},"citations":["ACC/AHA hypertension guideline (2017)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-early-ckd|CAUTIONS|iv-protein-intake","type":"CAUTIONS","from":"md-early-ckd","to":"iv-protein-intake","attrs":{"caveat":"The athletic protein target and the kidney-protective target can point in opposite directions, and the correct number depends on stage and on what the treating clinician is aiming at.","severity":"moderate","resolution":"Set the protein target with your kidney clinician rather than from a general training recommendation. Resistance training itself is not in question."},"citations":["KDIGO CKD guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-early-ckd|ADJUSTS|iv-protein-intake","type":"ADJUSTS","from":"md-early-ckd","to":"iv-protein-intake","attrs":{"dimension":"dose","adjustment":"Do not adopt the standard 1.6 g/kg/day training target by default; agree a stage-appropriate number and revisit it as function changes.","reason":"Protein dosing is the one nutrition variable in this graph that a kidney diagnosis genuinely changes."},"citations":["KDIGO CKD guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-early-ckd|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-early-ckd","to":"iv-vo2max-intervals","attrs":{"dimension":"environment","adjustment":"Plan hydration deliberately and avoid combining hard sessions with heat and fluid restriction.","reason":"Volume depletion during intense exercise is harder on reduced kidney function, and the combination is what causes problems rather than the exercise alone."},"citations":["KDIGO CKD guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-early-ckd|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-early-ckd","to":"iv-resistance-training","attrs":{"priority_delta":"moderate","reason":"Muscle wasting is common in chronic kidney disease and resistance training is the direct counter to it."},"citations":["KDIGO CKD guideline (2024)","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-sleep-apnea|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"md-sleep-apnea","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"large","reason":"Weight loss reduces apnoea severity directly, which then improves the sleep quality every other intervention depends on."},"citations":["AASM/AHA scientific statement - obstructive sleep apnoea (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-sleep-apnea|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-sleep-apnea","to":"iv-resistance-training","attrs":{"priority_delta":"moderate","reason":"Tolerated even when daytime sleepiness makes long aerobic sessions unappealing, and it protects lean mass during weight loss."},"citations":["AASM/AHA scientific statement - obstructive sleep apnoea (2021)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-sleep-apnea|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-sleep-apnea","to":"iv-vo2max-intervals","attrs":{"dimension":"timing","adjustment":"Schedule hard sessions on days after better sleep, and treat a bad night as a reason to swap the session rather than push through it.","reason":"Fragmented sleep blunts the training response and raises injury risk, so scheduling around it recovers more of the benefit than forcing the calendar."},"citations":["AASM/AHA scientific statement - obstructive sleep apnoea (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-sleep-apnea|CAUTIONS|iv-vo2max-intervals","type":"CAUTIONS","from":"md-sleep-apnea","to":"iv-vo2max-intervals","attrs":{"caveat":"Untreated apnoea reduces recovery capacity, so the usual interval prescription accumulates fatigue faster than it builds fitness.","severity":"mild","resolution":"Reduce frequency until treatment is established, then rebuild."},"citations":["AASM/AHA scientific statement - obstructive sleep apnoea (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pcos|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-pcos","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Insulin resistance is present in the majority, and resistance training improves it while adding lean mass - both relevant here."},"citations":["International evidence-based PCOS guideline (2023)","ADA Standards of Care (2024) - physical activity"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pcos|ELEVATES|iv-walking","type":"ELEVATES","from":"md-pcos","to":"iv-walking","attrs":{"priority_delta":"moderate","reason":"Regular movement improves insulin sensitivity independently of weight change, which matters because weight loss is often harder in PCOS."},"citations":["International evidence-based PCOS guideline (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pcos|ELEVATES|iv-sleep-regularity","type":"ELEVATES","from":"md-pcos","to":"iv-sleep-regularity","attrs":{"priority_delta":"moderate","reason":"Sleep disruption worsens insulin resistance, and obstructive sleep apnoea is more common in PCOS than the age group would predict."},"citations":["International evidence-based PCOS guideline (2023)","AASM/AHA scientific statement - obstructive sleep apnoea (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout|BLOCKS|iv-zone2-running","type":"BLOCKS","from":"md-gout","to":"iv-zone2-running","attrs":{"reason":"During an acute flare, weight-bearing on the affected joint is intensely painful and prolongs the episode.","severity":"moderate","resolution":"Pause running until the flare settles - typically days to two weeks - then rebuild gradually. This block is time-boxed to the flare, not to the diagnosis.","temporary":true,"applies_when":"acute flare active"},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout|CAUTIONS|iv-resistance-training","type":"CAUTIONS","from":"md-gout","to":"iv-resistance-training","attrs":{"caveat":"Between flares, training is unrestricted. During one, loading the affected joint is not tolerable.","severity":"mild","resolution":"Train the unaffected areas through a flare rather than stopping altogether."},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-gout","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"After a flare, return at reduced volume over one to two weeks rather than resuming at the previous load.","reason":"The joint is still irritable after pain settles, and an abrupt return is a common way to provoke the next episode."},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout|ELEVATES|iv-alcohol-reduction","type":"ELEVATES","from":"md-gout","to":"iv-alcohol-reduction","attrs":{"priority_delta":"moderate","reason":"Alcohol, particularly beer, is among the better-established dietary flare triggers."},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout|ELEVATES|iv-swimming","type":"ELEVATES","from":"md-gout","to":"iv-swimming","attrs":{"priority_delta":"small","reason":"Keeps aerobic training going through a flare without weight-bearing on the affected joint."},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-migraine|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-migraine","to":"iv-vo2max-intervals","attrs":{"dimension":"intensity","adjustment":"Build intensity gradually within the session rather than starting hard, and keep hydration and pre-session food consistent.","reason":"Abrupt maximal effort, dehydration and skipped meals are common attack triggers; the session structure is adjustable around all three."},"citations":["International Headache Society - secondary headache red flags"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-migraine|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-migraine","to":"iv-zone2-running","attrs":{"dimension":"timing","adjustment":"Keep training time consistent day to day and avoid training in the hottest part of the day.","reason":"Routine disruption and heat a
