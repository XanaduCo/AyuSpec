 modest changes in pregnancy, inflammation and renal disease — which is what makes once-in-a-lifetime measurement defensible.","actionability_gap":"Elevated Lp(a) currently has no directly proven treatment; its value is that it reclassifies risk and sharpens everything else. Outcome trials of Lp(a)-lowering agents are ongoing."},"citations":["Kronenberg et al. Eur Heart J 2022 — EAS consensus on lipoprotein(a)","Emerging Risk Factors Collaboration, JAMA 2009","Marcovina & Albers, J Lipid Res 2016 — Lp(a) measurement and standardisation"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-cac-score","type":"Marker","title":"Coronary artery calcium score","summary":"A non-contrast cardiac CT quantifying calcified plaque — a direct look at whether the disease is already there, rather than a prediction that it might be.","attrs":{"quality_tier":"A","noise":"low","cost":"moderate","invasiveness":"minimal","min_useful_interval":"5 years","ingestible_via":"imaging","what_it_estimates":"Calcified atherosclerotic plaque burden in the coronary arteries, expressed as an Agatston score.","unit":"Agatston units","radiation":"Roughly 1 mSv on modern protocols, comparable to a mammogram.","the_zero_caveat":"A score of zero means no calcified plaque, not no plaque. Soft non-calcified plaque is invisible to it, which matters most in exactly the younger people most eager to be reassured.","risk_reclassification":"Its strongest evidence is for reclassifying people at borderline or intermediate risk — moving them off the fence in either direction.","attia_position":"Attia argues for imaging and advanced lipid assessment substantially earlier than guidelines contemplate, on the cumulative-exposure argument.","consensus_note":"USPSTF issued an I statement — insufficient evidence — for adding CAC to risk assessment in asymptomatic adults, while ACC/AHA endorses it for intermediate-risk decision-making. There is no trial showing that early screening in young low-risk adults improves outcomes, and repeat scanning has both radiation and incidental-finding costs. Evidence is rated moderate for reclassification and low for the early-screening strategy.","min_interval_reason":"Progression is slow; rescanning inside five years usually reads noise and adds radiation without changing a decision."},"citations":["Greenland et al. JACC 2018 — coronary artery calcium in cardiovascular risk assessment","USPSTF, JAMA 2018 — nontraditional risk factors including CAC, I statement","Budoff et al. Circulation 2018 — CAC progression and events (MESA)","Attia, Outlive (2023), ch. 7 — early imaging — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-bp-ambulatory","type":"Marker","title":"24-hour ambulatory blood pressure","summary":"Automated readings across a full day and night — the reference standard for blood pressure, and the only way to see the nocturnal pattern.","attrs":{"quality_tier":"A","noise":"low","cost":"moderate","invasiveness":"minimal","min_useful_interval":"12 months","ingestible_via":"ehr","what_it_estimates":"True average arterial pressure across waking and sleeping hours, plus nocturnal dipping behaviour.","unit":"mmHg","what_it_catches":"White-coat and masked hypertension, both of which a clinic reading gets wrong in opposite directions, and non-dipping at night which carries independent risk.","predictive_edge":"Predicts cardiovascular outcomes better than clinic measurement in every head-to-head cohort.","tolerability":"The cuff inflates through the night and many people sleep badly during it — a real reason repeat testing is resisted."},"citations":["Stergiou et al. J Hypertens 2021 — ESH recommendations on ambulatory blood pressure monitoring","Muntner et al. Hypertension 2019 — AHA statement on blood pressure measurement","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-bp-cuff","type":"Marker","title":"Home blood pressure by validated cuff","summary":"Self-measured seated blood pressure with a validated upper-arm device, averaged over multiple readings and days.","attrs":{"quality_tier":"B","noise":"moderate","cost":"low","invasiveness":"minimal","min_useful_interval":"1 week for an averaged series","ingestible_via":"manual","what_it_estimates":"Usual arterial pressure, when technique and averaging are adequate.","unit":"mmHg","technique_is_the_marker":"Cuff size, arm support, back support, five minutes of rest, feet flat, no talking. Poor technique routinely shifts systolic by 10–20 mmHg — larger than most treatment effects in this graph.","averaging":"A single reading is nearly meaningless. The unit of measurement is a week of duplicate morning and evening readings, first day discarded.","wrist_devices":"Wrist cuffs are materially less accurate than validated upper-arm devices and are not what this marker means."},"citations":["Muntner et al. Hypertension 2019 — AHA statement on blood pressure measurement","Whelton et al. 2017 ACC/AHA Hypertension Guideline","Stergiou et al. J Hypertens 2021 — home blood pressure monitoring"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-hba1c","type":"Marker","title":"HbA1c","summary":"The glycated fraction of haemoglobin, reflecting average glucose over roughly the preceding three months — ubiquitous, standardised, and late.","attrs":{"quality_tier":"B","noise":"low","cost":"low","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"Average glucose exposure over the red cell lifespan, weighted toward the most recent month.","unit":"percent (NGSP) or mmol/mol (IFCC)","min_interval_reason":"Physiologically incapable of reflecting anything shorter than red cell turnover; a repeat at six weeks is measuring the same period twice.","confounders":"Anaemia, haemoglobinopathies, recent blood loss or transfusion, iron deficiency, pregnancy and chronic kidney disease all shift it independently of glucose.","lateness":"Moves only after years of compensatory hyperinsulinaemia, so a normal value is much weaker reassurance than users assume."},"citations":["ADA Standards of Care in Diabetes 2025 — diagnosis","Cavagnolli et al. PLoS One 2017 — factors affecting HbA1c independent of glycaemia","Tabák et al. Lancet 2009 — Whitehall II trajectories"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-fasting-glucose","type":"Marker","title":"Fasting plasma glucose","summary":"A single morning glucose after an overnight fast — the most available metabolic number and among the least informative per measurement.","attrs":{"quality_tier":"B","noise":"moderate","cost":"free","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"Hepatic glucose output under fasting conditions; a late and partial view of glucose handling.","unit":"mg/dL or mmol/L","within-person variability":"Day-to-day biological variation is on the order of 5–8 percent, which is enough to move someone across the prediabetes threshold and back without anything changing.","blind_spot":"Normal fasting glucose coexists with a frankly abnormal 2-hour OGTT value in a substantial minority — isolated post-load hyperglycaemia is invisible here.","pre-analytic":"Glucose falls in the tube before separation unless a glycolysis inhibitor is used, which biases some outpatient draws downward."},"citations":["ADA Standards of Care in Diabetes 2025","Selvin et al. Diabetes Care 2007 — short-term variability of glucose measures","WHO/IDF 2006 — definition and diagnosis of diabetes and intermediate hyperglycaemia"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-ogtt","type":"Marker","title":"Oral glucose tolerance test","summary":"Glucose measured fasting and two hours after a standard 75 g load — a provocative test that exposes dysfunction a fasting panel cannot see.","attrs":{"quality_tier":"A","noise":"moderate","cost":"low","invasiveness":"moderate","min_useful_interval":"12 months","ingestible_via":"lab-pdf","what_it_estimates":"The body's response to a defined glucose challenge — how much glucose disposal capacity actually exists under load.","unit":"mg/dL at 2 hours","sensitivity_advantage":"Detects abnormal glucose handling years before HbA1c or fasting glucose move, which is the entire reason it is here.","reproducibility_caveat":"Test-retest agreement is only moderate — the same person can be classified differently on two occasions weeks apart, so a single borderline result should not be treated as a verdict.","with_insulin":"Adding insulin measurements at each timepoint converts it from a glucose test to a resistance test, which is what makes it interesting for early detection. That variant is not a standard clinical order in most systems.","burden":"Two to three hours of clinic time plus a very sweet drink that a meaningful fraction of people find unpleasant — the main reason it is under-used."},"citations":["ADA Standards of Care in Diabetes 2025 — diagnosis","WHO/IDF 2006 — definition and diagnosis of diabetes","Libman et al. JAMA 2008 — reproducibility of the oral glucose tolerance test","Hulman et al. Diabetologia 2018 — glucose response curve patterns"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-fasting-insulin","type":"Marker","title":"Fasting insulin","summary":"Circulating insulin after an overnight fast — the earliest routinely obtainable signal that the body is working harder to hold glucose normal.","attrs":{"quality_tier":"B","noise":"high","cost":"low","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"The insulin output needed to maintain fasting euglycaemia; indirectly, hepatic insulin resistance.","unit":"µIU/mL","assay_problem":"Insulin immunoassays are not harmonised between manufacturers, cross-react with proinsulin to varying degrees, and can differ by 30 percent or more on the same sample. Trending across labs is not valid.","biological_noise":"Within-person coefficient of variation is high — commonly cited around 20–30 percent — so a single value carries little information.","no_agreed_threshold":"There is no consensus reference range or cut-point. Widely circulated targets in the longevity community are not guideline-derived.","attia_position":"Attia treats fasting insulin as a routine early-warning test and acts on values well inside the conventional reference range.","consensus_note":"The physiology is sound and the marker genuinely does move first. But ADA does not recommend it for screening, no threshold is validated against outcomes, and the assay variability is large enough that acting on a single number is not well supported. Rated moderate evidence for what it estimates and low for any specific action threshold — this is one of the clearest gaps between the author position and the tested evidence in this graph."},"citations":["Tabák et al. Lancet 2009 — Whitehall II insulin trajectories","ADA Standards of Care in Diabetes 2025 — screening recommendations","Manley et al. Clin Chem 2007 — comparability of insulin assays","Matthews et al. Diabetologia 1985 — HOMA-IR"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-homa-ir","type":"Marker","title":"HOMA-IR","summary":"A simple index computed from fasting glucose and fasting insulin — a usable population-level estimate of insulin resistance that inherits every weakness of the insulin assay under it.","attrs":{"quality_tier":"B","noise":"high","cost":"free","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"Predominantly hepatic insulin resistance, as a unitless index.","derivation":"Computed, not measured — it adds no information beyond the two inputs and multiplies their noise.","validation":"Correlates reasonably with clamp-derived insulin sensitivity across groups, considerably less well for any individual.","threshold_variability":"Published cut-points vary widely by population and by insulin assay, so a threshold from one paper cannot be applied to another lab's result.","reference_standard":"The actual reference for insulin sensitivity is the hyperinsulinaemic-euglycaemic clamp, which is a research procedure and not obtainable outside a study."},"citations":["Matthews et al. Diabetologia 1985 — homeostasis model assessment","Wallace et al. Diabetes Care 2004 — use and abuse of HOMA modelling","Muniyappa et al. Am J Physiol Endocrinol Metab 2008 — insulin sensitivity index limitations"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-cgm-variability","type":"Marker","title":"Glycaemic variability from continuous glucose monitoring","summary":"Interstitial glucose sampled every few minutes, summarised as time in range, standard deviation, coefficient of variation and post-meal excursion size.","attrs":{"quality_tier":"B","noise":"moderate","cost":"moderate","invasiveness":"minimal","min_useful_interval":"14 days per wear period","ingestible_via":"cgm","what_it_estimates":"The shape of glucose across real days — excursion amplitude, duration above range, and overnight behaviour that no fasting draw can see.","unit":"mg/dL and percent time in range","tier_reasoning":"Tier B rather than A: modern sensors are validated devices with published accuracy, but they measure interstitial rather than plasma glucose, lag it by several minutes, and carry a mean absolute relative difference typically around 8–10 percent with meaningfully worse accuracy at the extremes.","sensor_variation":"Sensor-to-sensor differences mean the first day of a new sensor and the last day of the previous one are not directly comparable — a common source of false 'something changed' readings.","non_diabetic_use":"Reference ranges and clinical meaning for glycaemic variability in people without diabetes are not established. What counts as a concerning excursion in a healthy person is currently an opinion, not a standard.","why_it_is_the_demo_marker":"The only marker in this graph that responds within hours, which makes it the one honest option for a two-week n-of-1 on post-meal walking. Its 14-day minimum window and moderate noise are what the experimentation heuristics need."},"citations":["Battelino et al. Diabetes Care 2019 — international consensus on time in range","Shah et al. J Clin Endocrinol Metab 2019 — CGM-derived glycaemic metrics in non-diabetic adults","Freckmann et al. J Diabetes Sci Technol 2019 — CGM accuracy assessment","ADA Standards of Care in Diabetes 2025 — diabetes technology"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-dexa-visceral-fat","type":"Marker","title":"Visceral adipose tissue by DXA","summary":"Regional fat quantification from a dual-energy X-ray absorptiometry scan, with an algorithmic estimate of the visceral compartment specifically.","attrs":{"quality_tier":"A","noise":"low","cost":"moderate","invasiveness":"minimal","min_useful_interval":"6 months","ingestible_via":"imaging","what_it_estimates":"Total and regional fat mass, lean mass, and visceral adipose tissue in the android region.","unit":"grams or cm² of VAT","radiation":"Very low — on the order of a fraction of a day of background exposure.","calibration_caveat":"VAT estimation is manufacturer-specific and validated against CT within each vendor's software. Scans from different machines or software versions are not interchangeable, which matters because clinics upgrade silently.","why_a_scale_is_not_this":"Bioimpedance scales estimate the same quantities with far larger error and drift with hydration; they are not a cheap version of this marker.","dual_use":"Also the reference marker for lean mass, which is the musculoskeletal system's concern — one node, reached from both."},"citations":["Kaul et al. Obesity 2012 — DXA-derived visceral adipose tissue validation against CT","Neeland et al. Lancet Diabetes Endocrinol 2019 — visceral and ectopic fat","Shepherd et al. J Clin Densitom 2017 — body composition by DXA"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-waist-circumference","type":"Marker","title":"Waist circumference","summary":"A tape measure at the iliac crest — crude, free, and a better metabolic signal than body weight or BMI.","attrs":{"quality_tier":"B","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"1 month","ingestible_via":"manual","what_it_estimates":"Central adiposity, mixing visceral and subcutaneous abdominal fat without distinguishing them.","unit":"cm","technique_variance":"Measurement site, tape tension and breathing phase all move the number by centimetres; the same person measured by two people gets two answers. Self-measurement is consistent enough for trending only if the protocol is fixed.","threshold_ethnicity":"Risk thresholds differ substantially by ancestry — the cut-points that apply to European populations understate risk in South Asian and East Asian populations.","value_proposition":"Adds risk information beyond BMI at every BMI category, which is the consensus statement's central claim, and costs nothing."},"citations":["Ross et al. Nat Rev Endocrinol 2020 — waist circumference should be a vital sign, IAS/ICCR consensus","WHO 2008 — waist circumference and waist-hip ratio report","Neeland et al. Lancet Diabetes Endocrinol 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-liver-enzymes","type":"Marker","title":"Liver enzymes (ALT and AST)","summary":"Transaminases from a routine panel — sensitive to nothing in particular and normal in plenty of people with real liver disease.","attrs":{"quality_tier":"B","noise":"moderate","cost":"free","invasiveness":"minimal","min_useful_interval":"3 months","ingestible_via":"lab-pdf","what_it_estimates":"Hepatocellular injury, non-specifically. Elevated ALT raises suspicion of steatosis; normal ALT does not exclude it.","unit":"U/L","reference_range_problem":"Conventional upper limits of normal were derived from populations that included many people with undiagnosed steatosis, so the 'normal' range is arguably set too high — several groups propose lower sex-specific limits.","normal_despite_disease":"A substantial fraction of people with biopsy-confirmed steatohepatitis have normal ALT, which is why the graph routes to FIB-4 and imaging rather than stopping here.","acute_confounders":"A hard training session, recent alcohol, or muscle injury can raise AST and, less so, ALT independently of the liver."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Prati et al. Ann Intern Med 2002 — updated definitions of healthy ALT ranges","Kwo et al. Am J Gastroenterol 2017 — ACG guideline on abnormal liver chemistries"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-fib4","type":"Marker","title":"FIB-4 index","summary":"A four-variable score from age, AST, ALT and platelet count — the recommended first-line filter for advanced liver fibrosis, computable from labs a user already has.","attrs":{"quality_tier":"B","noise":"moderate","cost":"free","invasiveness":"minimal","min_useful_interval":"12 months","ingestible_via":"lab-pdf","what_it_estimates":"Probability of advanced fibrosis, as a triage rather than a diagnosis.","unit":"unitless index","how_it_is_used":"Below roughly 1.3 has a high negative predictive value and effectively rules out advanced fibrosis; above roughly 2.67 warrants specialist assessment; the wide middle band is indeterminate and needs elastography or an ELF test.","age_distortion":"Age is in the numerator, so FIB-4 systematically overcalls in people over 65 and undercalls under 35 — age-adjusted thresholds exist and are not always applied.","why_it_is_valuable_here":"Turns a panel the user already owns into a genuine risk statement with no extra cost or blood draw, which is exactly the kind of thing an ingestion-aware graph should surface."},"citations":["Sterling et al. Hepatology 2006 — FIB-4 index development","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","McPherson et al. Am J Gastroenterol 2017 — age-adjusted FIB-4 thresholds"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-mri-pdff","type":"Marker","title":"Hepatic fat fraction by MRI-PDFF","summary":"Proton density fat fraction from MRI — a precise, quantitative, non-invasive measure of how much fat the liver is actually holding.","attrs":{"quality_tier":"A","noise":"low","cost":"high","invasiveness":"none","min_useful_interval":"3 months","ingestible_via":"imaging","what_it_estimates":"Percentage of liver tissue that is fat, quantitatively and reproducibly.","unit":"percent","precision":"Reproducible enough across scanners and vendors to serve as the primary endpoint in MASLD drug trials, which is a strong statement about its measurement quality.","responsiveness":"Hepatic fat falls quickly under energy restriction — a relative reduction of 30 percent or more is achievable within weeks, and this marker can see it, where enzymes and ultrasound cannot.","access_reality":"Expensive and rarely reimbursed outside research or specialist hepatology, so it is aspirational for most users even though it is technically the best available answer.","versus_ultrasound":"Ultrasound is far cheaper but only semi-quantitative and insensitive below roughly 20 percent fat content."},"citations":["Caussy et al. Hepatology 2018 — MRI-PDFF as a biomarker in MASLD trials","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Tang et al. Radiology 2015 — MRI-PDFF accuracy against histology"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-resting-hr","type":"Marker","title":"Resting heart rate from a wearable","summary":"Overnight or seated resting heart rate captured by an optical sensor — a coarse, cheap, daily-available signal that tracks training state and illness.","attrs":{"quality_tier":"C","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"7 days for a rolling average","ingestible_via":"wearable-api","what_it_estimates":"Autonomic tone and, loosely, aerobic conditioning — lower usually means better trained or better rested, but it is not a fitness measurement.","accuracy":"Optical resting heart rate is one of the more accurate consumer measurements, typically within a few beats per minute of ECG at rest — accuracy degrades sharply during movement, not at rest.","confounders":"Alcohol, illness, poor sleep, heat, altitude, caffeine and stress all move it, often more than a month of training does.","use_it_as":"A rolling 7-day average trend, never a single night. A single elevated night is usually alcohol or a cold.","population_signal":"Higher resting heart rate associates with higher mortality in cohorts, but the association is weak enough at the individual level that it should not be read as a personal risk score."},"citations":["Nelson et al. JMIR Mhealth Uhealth 2020 — accuracy of consumer wearable heart rate measurement","Jensen et al. Heart 2013 — resting heart rate and mortality","Shaffer & Ginsberg, Front Public Health 2017 — heart rate metrics and norms"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-hrv-wearable","type":"Marker","title":"Heart rate variability from a wearable","summary":"Beat-to-beat interval variation, usually reported as overnight RMSSD — the most over-interpreted number in consumer health.","attrs":{"quality_tier":"C","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"14 days for a rolling baseline","ingestible_via":"wearable-api","what_it_estimates":"Parasympathetic activity during measurement. Loosely related to recovery and training load; not a measure of aerobic fitness and not a health score.","between_person_uselessness":"Between-person comparison is meaningless — normal RMSSD spans roughly an order of magnitude across healthy adults, and it falls steeply with age. Comparing your number to a friend's tells you nothing.","within_person_value":"Only interpretable as a personal deviation from a personal rolling baseline, and even then day-to-day variation is large enough that single-day changes are usually noise.","measurement_dependence":"Values depend on measurement window, posture, breathing rate, device and the manufacturer's algorithm — the same night processed two ways gives two numbers.","why_it_is_here":"It is the marker users most want to act on and the one where a Tier C label does the most work."},"citations":["Shaffer & Ginsberg, Front Public Health 2017 — an overview of heart rate variability metrics and norms","Plews et al. Sports Med 2013 — heart rate variability training monitoring in athletes","Task Force of ESC and NASPE, Circulation 1996 — HRV standards of measurement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-step-count","type":"Marker","title":"Daily step count","summary":"Steps counted by a phone or wrist device — the most-collected health datum in existence and a reasonable proxy for total activity volume.","attrs":{"quality_tier":"C","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"7 days","ingestible_via":"wearable-api","what_it_estimates":"Ambulatory activity volume. Not intensity, and not cardiorespiratory fitness.","device_disagreement":"Wrist and hip devices disagree by 10 percent or more, and phones miss everything done without the phone. Cross-device comparison is not valid.","dose_evidence":"Mortality benefit rises steeply from about 2,500 to 7,500 steps per day and plateaus after roughly 8,000–10,000 depending on age — the 10,000 figure originated in 1960s marketing, not evidence.","what_it_misses":"Cycling, swimming and rowing register as almost nothing, which will make a well-trained cyclist look sedentary."},"citations":["Paluch et al. Lancet Public Health 2022 — daily steps and all-cause mortality meta-analysis","Lee et al. JAMA Intern Med 2019 — steps per day and mortality in older women","Bassett et al. Med Sci Sports Exerc 2017 — step counting accuracy across devices"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-sleep-duration-wearable","type":"Marker","title":"Sleep duration from a wearable","summary":"Total sleep time estimated from movement and heart rate — good at total duration, considerably weaker at anything finer.","attrs":{"quality_tier":"C","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"14 days","ingestible_via":"wearable-api","what_it_estimates":"Total sleep time and, much less reliably, sleep stage composition.","what_it_is_good_at":"Total sleep duration in healthy sleepers, where consumer devices agree reasonably with polysomnography.","what_it_is_bad_at":"Stage classification, and detecting wake after sleep onset. Devices systematically overestimate sleep in people who sleep badly — precisely the people who want to know.","exposure_not_function":"Included as an exposure proxy rather than a direct measure of any metabolic function. It tells you whether the sleep-duration intervention is actually happening; it does not measure insulin sensitivity. The graph labels the link weak for exactly this reason.","reference_standard":"Polysomnography, which belongs to the sleep component rather than this one."},"citations":["de Zambotti et al. Sleep 2019 — validation of consumer sleep-tracking devices","Chinoy et al. Sleep 2021 — performance of seven consumer sleep-tracking devices against polysomnography","Watson et al. Sleep 2015 — AASM/SRS consensus on sleep duration"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-rpe-session","type":"Marker","title":"Session rating of perceived exertion","summary":"How hard the session felt, on a 0–10 scale, recorded shortly after finishing — subjective, free, and better at tracking training load than most people expect.","attrs":{"quality_tier":"D","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"per session, aggregated weekly","ingestible_via":"manual","what_it_estimates":"Internal training load. Multiplied by duration it gives a session load that tracks reasonably with heart-rate-derived load in trained people.","why_a_tier_D_marker_earns_its_place":"It works when the heart rate signal does not — swimming, heavy strength work, hot conditions, or a dead battery. A self-report that is always available beats a sensor value that is often missing.","known_biases":"Anchored to the individual's experience, drifts with mood and expectation, and is systematically compressed by people who have never trained hard.","scale_discipline":"Only meaningful if the same anchored scale is used every time; a scale re-explained differently is a new instrument."},"citations":["Borg G. Med Sci Sports Exerc 1982 — psychophysical bases of perceived exertion","Foster et al. J Strength Cond Res 2001 — session RPE method for monitoring training load","Haddad et al. Front Neurosci 2017 — session-RPE validity and influencing factors"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"mk-diet-recall","type":"Marker","title":"Self-reported dietary intake","summary":"What the user says they ate — food logs, recalls and questionnaires. The only practical way to know about diet, and the least accurate measurement in the graph.","attrs":{"quality_tier":"D","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"3 days of logging, repeated","ingestible_via":"manual","what_it_estimates":"Energy, macronutrient and fibre intake, with substantial and non-random error.","the_size_of_the_error":"Energy intake is under-reported by roughly 20–30 percent on average against doubly-labelled water, and the under-reporting is worse in people with higher body weight — so the error is systematic, not just noisy.","reactivity":"The act of logging changes what people eat, which is useful as an intervention and corrupting as a measurement.","honest_use":"Good for tracking a specific tracked thing — protein grams, fibre grams, alcohol units — and poor for total energy. Do not compute an energy deficit from it and treat the result as a number.","why_it_stays":"Every nutrition intervention in this graph is invisible without it. The right response is to label it Tier D loudly, not to pretend a better instrument exists outside a metabolic ward."},"citations":["Subar et al. Am J Epidemiol 2015 — addressing current criticism of dietary assessment methodology","Schoeller DA. Metabolism 1995 — limitations in the assessment of dietary energy intake by self-report","Freedman et al. Am J Epidemiol 2014 — biomarker-based validation of self-reported intake"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"sys-musculoskeletal","type":"System","title":"Musculoskeletal system","summary":"Muscle, bone, tendon and the control system that keeps you upright. The system whose decline is most visible in old age and most modifiable at any age.","attrs":{"navigation_order":3},"citations":["Attia, Outlive (2023) - author position","US Physical Activity Guidelines Advisory Committee Report (2018)","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-muscular-strength","type":"Function","title":"Muscular strength","summary":"Maximal force the muscles can produce. Falls roughly 1-1.5% per year from midlife, faster than muscle mass itself, and predicts disability independently of mass.","attrs":{"decline_onset":"mid-30s, accelerating after 60","primary_lever":"progressive resistance training"},"citations":["Cochrane - progressive resistance training in older adults (2009)","EWGSOP2 sarcopenia consensus (2019)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-lean-mass","type":"Function","title":"Lean muscle mass","summary":"The quantity of contractile tissue. A metabolic reservoir as well as a mechanical one - low lean mass tracks with worse outcomes after illness, surgery and injury.","attrs":{"decline_onset":"3rd-4th decade","primary_lever":"resistance training plus adequate protein"},"citations":["EWGSOP2 sarcopenia consensus (2019)","ISSN position stand - protein and exercise (2017)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-bone-density","type":"Function","title":"Bone mineral density","summary":"Skeletal mass and architecture. Bone responds to strain, not to activity in general, which is why loading matters more than time spent moving.","attrs":{"decline_onset":"after peak bone mass ~age 30; sharp post-menopause","primary_lever":"high-strain loading"},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-stability-balance","type":"Function","title":"Stability and balance","summary":"The ability to keep the centre of mass over the base of support and recover when it leaves. The function standing between an older adult and the fall that ends independence.","attrs":{"decline_onset":"measurable from the 50s","primary_lever":"specific balance training"},"citations":["Cochrane - exercise for preventing falls in older people (2019)","USPSTF falls prevention in community-dwelling older adults (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-joint-mobility","type":"Function","title":"Joint mobility","summary":"Usable range of motion under control. Distinct from passive flexibility - the question is whether you can reach a position and produce force there.","attrs":{"decline_onset":"gradual, highly load-history dependent","primary_lever":"loaded range-of-motion work"},"citations":["AAOS goniometric range-of-motion normative values","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"fn-tendon-capacity","type":"Function","title":"Tendon and connective tissue capacity","summary":"How much repeated load tendon can absorb before it becomes symptomatic. Adapts far more slowly than muscle, which is the usual reason training progressions fail.","attrs":{"decline_onset":"collagen turnover slows from midlife","primary_lever":"slow heavy and eccentric loading"},"citations":["Cook and Purdam tendon pathology continuum model (2009)","JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"out-fall-freedom","type":"Outcome","title":"Freedom from falls","summary":"Reaching late life without a fall that fractures a hip, causes a head injury, or starts the confidence spiral that ends in a care home. A cliff-edge outcome, not a gradual one.","attrs":{"polarity":"protective","why_it_matters":"one hip fracture at 80 frequently ends independent living outright"},"citations":["USPSTF falls prevention in community-dwelling older adults (2018)","Cochrane - exercise for preventing falls in older people (2019)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"out-adv-stress-fracture","type":"Outcome","title":"Bone stress injury","summary":"A stress reaction or stress fracture from repetitive loading outpacing bone remodelling. Typically 6-12 weeks of lost training and a hard reset of aerobic progress.","attrs":{"polarity":"adverse","typical_sites":"tibia, metatarsal, femoral neck, navicular"},"citations":["Consensus statements on bone stress injury in athletes","Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"out-adv-overuse-tendinopathy","type":"Outcome","title":"Overuse tendinopathy","summary":"Load-related tendon pain and stiffness from volume rising faster than tendon adaptation. Slow to settle and prone to recurrence when the underlying progression error is not fixed.","attrs":{"polarity":"adverse","typical_sites":"Achilles, patellar, gluteal, rotator cuff, elbow extensors"},"citations":["Cook and Purdam tendon pathology continuum model (2009)","JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"out-adv-acute-back-injury","type":"Outcome","title":"Acute back injury or flare","summary":"A sudden episode of disabling back pain, usually from a loaded lift with a load or technique the trunk was not prepared for. Mostly self-limiting, but a common reason people abandon training entirely.","attrs":{"polarity":"adverse","note":"imaging findings correlate poorly with pain; most episodes settle without them"},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-resistance-training","type":"Intervention","title":"Resistance training","summary":"Progressive loading of the major movement patterns two to three times a week. The single highest-yield musculoskeletal intervention and the one most often skipped in favour of cardio.","attrs":{"modality":"free weights, machines, bands or bodyweight","frequency":"2-3 sessions per week","equipment_floor":"bands and bodyweight are sufficient to start"},"citations":["ACSM Position Stand 2011 - quantity and quality of exercise","Cochrane - progressive resistance training in older adults (2009)","US Physical Activity Guidelines Advisory Committee Report (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-posterior-chain-strength","type":"Intervention","title":"Posterior chain strengthening","summary":"Deliberate loading of glutes, hamstrings and spinal extensors through hinge patterns. The base that makes running, carrying and lifting tolerable for a back that has been painful.","attrs":{"examples":"hip hinge, Romanian deadlift, hip thrust, back extension","frequency":"2 sessions per week"},"citations":["NICE NG59 low back pain and sciatica","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-grip-training","type":"Intervention","title":"Grip strength training","summary":"Direct loading of the hands and forearms via hangs, holds and thick-bar work. Grip is a cheap window onto whole-body strength and tracks with mortality across populations.","attrs":{"examples":"dead hangs, timed holds, towel or thick-bar work","frequency":"2-3 short sessions per week"},"citations":["Leong et al., Lancet (2015) - PURE grip strength and mortality","Attia, Outlive (2023) - author position","Roberts et al. - standardised protocol for grip strength measurement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-farmers-carry","type":"Intervention","title":"Loaded carries","summary":"Walking under load held at the sides or overhead. Trains grip, trunk and gait simultaneously and maps directly onto carrying shopping up a flight of stairs at 85.","attrs":{"examples":"farmer carry, suitcase carry, overhead carry","frequency":"1-2 sessions per week"},"citations":["Attia, Outlive (2023) - author position","Knapik et al. - load carriage physiology and injury, Military Medicine","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-calf-plantar-loading","type":"Intervention","title":"Calf and plantar loading","summary":"Progressive heel raises and plantar fascia loading, held under tension rather than bounced. The mainstay of both plantar heel pain rehabilitation and prevention of recurrence.","attrs":{"examples":"straight and bent-knee heel raises, high-load plantar fascia work","frequency":"most days, then 3 per week for maintenance"},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)","Alfredson eccentric calf loading protocol (1998)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-quadriceps-strengthening","type":"Intervention","title":"Quadriceps strengthening","summary":"Targeted loading of the knee extensors. The best-supported non-drug intervention for knee osteoarthritis pain and function, and quietly one of the strongest fall-prevention levers.","attrs":{"examples":"leg press, split squat, step-up, seated knee extension","frequency":"2-3 sessions per week"},"citations":["Cochrane - exercise for knee osteoarthritis (2015)","OARSI non-surgical management of knee osteoarthritis (2019)","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-trunk-stability","type":"Intervention","title":"Trunk stability training","summary":"Anti-extension, anti-rotation and anti-lateral-flexion work that teaches the trunk to resist movement under load rather than produce it.","attrs":{"examples":"dead bug, plank variants, Pallof press, side plank","frequency":"2-3 sessions per week"},"citations":["NICE NG59 low back pain and sciatica","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-balance-training","type":"Intervention","title":"Balance training","summary":"Specific practice of narrowed-base, single-leg and perturbed standing. Balance is trainable at any age and does not improve as a side effect of walking or cycling.","attrs":{"examples":"single-leg stance, tandem walking, reactive step training","frequency":"3 or more sessions per week, short doses"},"citations":["Cochrane - exercise for preventing falls in older people (2019)","USPSTF falls prevention in community-dwelling older adults (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-plyometrics","type":"Intervention","title":"Plyometric and impact loading","summary":"Brief bouts of hopping, jumping and landing. The strain rate, not the volume, is what bone responds to - a few dozen good jumps beats an hour of low-strain movement.","attrs":{"examples":"hops, drop jumps, skipping, low-box landings","frequency":"2-3 short sessions per week","volume":"tens rather than hundreds of contacts"},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-hip-mobility","type":"Intervention","title":"Hip mobility work","summary":"Loaded and end-range hip work to keep internal rotation, extension and flexion usable. Hip range loss shows up first as compensation elsewhere, usually the lower back.","attrs":{"examples":"90/90 transitions, hip airplanes, deep split-squat holds","frequency":"most days, short doses"},"citations":["AAOS goniometric range-of-motion normative values","NICE NG226 osteoarthritis in over 16s (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-eccentric-loading","type":"Intervention","title":"Eccentric loading","summary":"Slow lengthening contractions under load. The best-established mechanical stimulus for remodelling a painful tendon and for building tolerance to downhill and deceleration work.","attrs":{"examples":"Alfredson-style heel drops, slow tempo lowering, Nordic curls","frequency":"daily to every other day during rehabilitation"},"citations":["Alfredson eccentric calf loading protocol (1998)","JOSPT clinical practice guideline - Achilles tendinopathy (2018)","Cook and Purdam tendon pathology continuum model (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-footwear-selection","type":"Intervention","title":"Footwear selection","summary":"Choosing shoes by fit, stack and how they feel over a real run rather than by category label. Evidence for prescriptive matching of shoe type to foot type is weak; comfort filtering has better support.","attrs":{"note":"comfort-based selection has more support than motion-control prescription","replacement":"when cushioning or fit changes noticeably"},"citations":["Cochrane and BJSM reviews of foot orthoses - findings mixed","JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-load-management","type":"Intervention","title":"Training load management","summary":"Progressing volume and intensity gradually, tracking how much changed week to week, and inserting easier weeks. The least glamorous injury-prevention lever and the most reliable one.","attrs":{"heuristic":"raise one variable at a time; keep weekly jumps modest","note":"the specific 10% rule is a convention, not a validated threshold"},"citations":["BJSM consensus - return to running after injury","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"iv-heat-acclimatization","type":"Intervention","title":"Heat acclimatisation","summary":"Structured, progressive exposure to exercising in heat over roughly ten to fourteen days. Produces real physiological adaptation - plasma volume, sweat onset, sweat sodium - not just tolerance.","attrs":{"protocol":"10-14 consecutive days of gradually lengthening heat exposure","decay":"adaptation fades within 2-4 weeks without exposure"},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-dexa-lean-mass","type":"Marker","title":"DEXA appendicular lean mass","summary":"Whole-body composition scan reporting lean mass by region. The reference method for tracking muscle over years, and the only one precise enough to detect a real change in one person.","attrs":{"tier":"A","unit":"kg and kg/m2 ALMI","noise":"low","cost":"moderate","invasiveness":"minimal","min_useful_interval":"6 months","ingestible_via":["manual","pdf-report"]},"citations":["ISCD official positions on DXA (2019)","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-dexa-bmd","type":"Marker","title":"DEXA bone mineral density","summary":"Areal bone density at hip and spine, reported as T-score and Z-score. The measurement osteoporosis diagnosis is actually defined on.","attrs":{"tier":"A","unit":"g/cm2, T-score","noise":"low","cost":"moderate","invasiveness":"minimal","min_useful_interval":"12-24 months","ingestible_via":["epic","manual","pdf-report"]},"citations":["ISCD official positions on DXA (2019)","Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-tendon-ultrasound","type":"Marker","title":"Tendon ultrasound","summary":"Imaging of tendon thickness and structure. Useful for confirming a structural picture, but poorly correlated with pain - abnormal tendons are common in people with no symptoms.","attrs":{"tier":"A","unit":"mm thickness, qualitative structure","noise":"moderate","cost":"moderate","invasiveness":"none","min_useful_interval":"3 months","ingestible_via":["epic","manual"],"caveat":"structure and symptoms diverge often"},"citations":["Ultrasound tendon imaging reliability literature","Cook and Purdam tendon pathology continuum model (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-grip-strength","type":"Marker","title":"Grip strength (dynamometer)","summary":"Maximal isometric hand grip on a calibrated dynamometer. Cheap, fast, standardised, and one of the better-validated single predictors of mortality and disability.","attrs":{"tier":"B","unit":"kg","noise":"low","cost":"low","invasiveness":"none","min_useful_interval":"1 month","ingestible_via":["manual"],"protocol_sensitivity":"posture and elbow angle must be fixed between tests"},"citations":["Leong et al., Lancet (2015) - PURE grip strength and mortality","Roberts et al. - standardised protocol for grip strength measurement","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-1rm-estimate","type":"Marker","title":"Estimated one-rep max","summary":"Strength inferred from a set taken near failure at a submaximal load. Good for tracking one person over time; the prediction equations drift at very high or very low rep counts.","attrs":{"tier":"B","unit":"kg per lift","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"4 weeks","ingestible_via":["manual"]},"citations":["Brzycki and Epley 1RM prediction equations - validation literature","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-sit-to-stand","type":"Marker","title":"Five-times sit-to-stand","summary":"Time to rise from a chair five times without using the arms. Captures leg power, balance and confidence at once, and needs nothing but a chair and a stopwatch.","attrs":{"tier":"B","unit":"seconds","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"4 weeks","ingestible_via":["manual"]},"citations":["Bohannon - five-times sit-to-stand reference values","Guralnik et al. - Short Physical Performance Battery (1994)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-gait-speed","type":"Marker","title":"Usual gait speed","summary":"Comfortable walking speed over a measured short course. A remarkably strong summary signal in older adults - it aggregates strength, balance, cardiorespiratory reserve and neurological status.","attrs":{"tier":"B","unit":"m/s","noise":"low","cost":"free","invasiveness":"none","min_useful_interval":"3 months","ingestible_via":["manual","apple-health"]},"citations":["Studenski et al., JAMA (2011) - gait speed and survival","Guralnik et al. - Short Physical Performance Battery (1994)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-single-leg-balance","type":"Marker","title":"Single-leg stance time","summary":"How long you can stand on one leg, eyes open and then closed. Declines steeply with age and is the most direct available proxy for the function that prevents falls.","attrs":{"tier":"B","unit":"seconds","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"4 weeks","ingestible_via":["manual"],"age_dependence":"strong"},"citations":["Springer et al. - single-leg stance normative data by age","Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-vertical-jump","type":"Marker","title":"Countermovement jump height","summary":"Jump height from a standing countermovement. A power measure rather than a strength measure, and power declines earlier and faster with age than maximal force does.","attrs":{"tier":"B","unit":"cm","noise":"moderate","cost":"low","invasiveness":"none","min_useful_interval":"4 weeks","ingestible_via":["manual"]},"citations":["Countermovement jump reliability and normative data - sports science literature"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-heel-raise-endurance","type":"Marker","title":"Single-leg heel raise repetitions","summary":"Repetitions of a single-leg heel raise to fatigue through full range. The standard functional test of calf and Achilles capacity, and a sensible return-to-running gate.","attrs":{"tier":"B","unit":"repetitions","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"2 weeks","ingestible_via":["manual"]},"citations":["Hebert-Losier et al. - heel-rise test normative data","JOSPT clinical practice guideline - Achilles tendinopathy (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-hip-rom-goniometry","type":"Marker","title":"Hip range of motion (goniometry)","summary":"Measured hip flexion, extension and internal rotation. Reasonably repeatable when the same person measures with the same protocol; between-rater agreement is weaker.","attrs":{"tier":"B","unit":"degrees","noise":"moderate","cost":"low","invasiveness":"none","min_useful_interval":"6 weeks","ingestible_via":["manual"]},"citations":["AAOS goniometric range-of-motion normative values"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-bioimpedance-lean-mass","type":"Marker","title":"Bioimpedance lean mass","summary":"Consumer scale or handheld estimate of body composition from electrical impedance. Sensitive to hydration and time of day - readable as a trend under fixed conditions, not as an absolute number.","attrs":{"tier":"C","unit":"kg","noise":"high","cost":"low","invasiveness":"none","min_useful_interval":"2 weeks","ingestible_via":["apple-health","withings","manual"],"caveat":"absolute values disagree with DEXA by several kg"},"citations":["Consumer bioimpedance versus DXA agreement studies"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-wearable-step-count","type":"Marker","title":"Wearable step count","summary":"Daily steps from a phone or watch. A decent proxy for overall movement volume, a poor one for loading intensity - it cannot tell a heavy carry from a stroll.","attrs":{"tier":"C","unit":"steps/day","noise":"moderate","cost":"free","invasiveness":"none","min_useful_interval":"1 week","ingestible_via":["apple-health","oura","whoop","fitbit"]},"citations":["Consumer step-count accuracy validation studies"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-wearable-cadence","type":"Marker","title":"Running cadence","summary":"Steps per minute while running, from a watch or foot pod. Related to stride length and impact loading, but the popular universal target is not supported for every runner.","attrs":{"tier":"C","unit":"steps/min","noise":"low","cost":"free","invasiveness":"none","min_useful_interval":"1 week","ingestible_via":["apple-health","garmin","manual"],"caveat":"no single optimal cadence across runners"},"citations":["Running cadence and impact loading - biomechanics literature"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-pain-scale-selfreport","type":"Marker","title":"Pain rating (self-report)","summary":"A 0-10 numeric rating of pain, ideally recorded in a fixed context such as first steps in the morning. Subjective and noisy, but it is the outcome that actually matters to the person.","attrs":{"tier":"D","unit":"0-10","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"1 day","ingestible_via":["manual","app-entry"]},"citations":["Hawker et al. (2011) - measurement properties of pain rating scales"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"mk-perceived-exertion","type":"Marker","title":"Session rating of perceived exertion","summary":"How hard a session felt, on the Borg or 0-10 scale. Cheap load-monitoring input; it drifts with mood, sleep and caffeine, so it is a trend signal rather than a measurement.","attrs":{"tier":"D","unit":"6-20 or 0-10","noise":"high","cost":"free","invasiveness":"none","min_useful_interval":"1 day","ingestible_via":["manual","app-entry"]},"citations":["Borg RPE scale validation literature"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"rf-low-muscle-mass","type":"RiskFactor","title":"Low lean muscle mass","summary":"Appendicular lean mass index below the sarcopenia cut-point for age and sex. Sharpens the case for resistance training and protein rather than blocking anything.","attrs":{"thresholds":"ALMI below EWGSOP2 cut-points","detected_from":"mk-dexa-lean-mass"},"citations":["EWGSOP2 sarcopenia consensus (2019)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"rf-poor-grip-strength","type":"RiskFactor","title":"Low grip strength","summary":"Grip below the age and sex reference range. Rarely a hand problem - it is usually a whole-body strength signal, and it predicts hard outcomes.","attrs":{"thresholds":"below EWGSOP2 sex-specific cut-points","detected_from":"mk-grip-strength"},"citations":["Leong et al., Lancet (2015) - PURE grip strength and mortality","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"rf-osteopenia-bmd","type":"RiskFactor","title":"Low bone density (osteopenia range)","summary":"DEXA T-score between -1.0 and -2.5. Not a diagnosis of osteoporosis, but the point at which loading and fall prevention stop being optional.","attrs":{"thresholds":"T-score -1.0 to -2.5","detected_from":"mk-dexa-bmd"},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"rf-prior-fall","type":"RiskFactor","title":"Prior fall in the last 12 months","summary":"One of the strongest single predictors of the next fall. Turns balance work from a general recommendation into a specific priority.","attrs":{"detected_from":"history","note":"also a FRAX-relevant fracture risk input"},"citations":["USPSTF falls prevention in community-dwelling older adults (2018)","Kanis et al. - FRAX and prior falls as fracture risk input"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-chronic-low-back-pain","type":"Modifier","title":"Chronic low back pain","summary":"Back pain persisting beyond three months without a red-flag cause. Activity is part of the treatment, not a risk to be avoided - but the order in which activity is reintroduced matters.","attrs":{"category":"condition","typical_course":"fluctuating; flares do not mean damage","key_principle":"build tolerance before adding impact"},"citations":["NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-plantar-fasciitis","type":"Modifier","title":"Plantar heel pain (plantar fasciitis)","summary":"Load-related pain under the heel, classically worst on the first steps of the morning. Slow to settle, and the usual driver is a volume increase the tissue was not ready for.","attrs":{"category":"condition","hallmark":"first-step morning pain","typical_duration":"months"},"citations":["JOSPT clinical practice guideline - heel pain and plantar fasciitis (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-flat-feet","type":"Modifier","title":"Flat feet / pes planus","summary":"A low or absent medial arch. Extremely common and mostly asymptomatic - on its own it is a footwear and progression consideration, not a reason to avoid impact.","attrs":{"category":"anatomy","note":"poor predictor of injury in isolation"},"citations":["Cochrane and BJSM reviews of foot orthoses - findings mixed"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-knee-osteoarthritis","type":"Modifier","title":"Knee osteoarthritis","summary":"Degenerative knee joint change with pain and stiffness. The most consequential misconception in this whole graph is that it rules out running - the evidence does not support that.","attrs":{"category":"condition","misconception_corrected":"recreational running is not shown to accelerate knee OA; sedentary and elite-volume groups differ from recreational runners","first_line":"exercise therapy and weight management"},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","OARSI non-surgical management of knee osteoarthritis (2019)","Cochrane - exercise for knee osteoarthritis (2015)","ACR/Arthritis Foundation osteoarthritis guideline (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hip-osteoarthritis","type":"Modifier","title":"Hip osteoarthritis","summary":"Degenerative hip change, usually felt as groin pain and lost internal rotation. Exercise therapy is first-line here too, with range work alongside strengthening.","attrs":{"category":"condition","hallmark":"groin pain, restricted internal rotation"},"citations":["NICE NG226 osteoarthritis in over 16s (2022)","OARSI non-surgical management of knee osteoarthritis (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-shoulder-impingement","type":"Modifier","title":"Shoulder impingement / subacromial pain","summary":"Pain in the outer shoulder on overhead and reaching movement. Overhead loading is modified rather than removed - complete rest tends to prolong it.","attrs":{"category":"condition","aggravators":"repeated overhead reaching, pressing, freestyle swimming volume"},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-achilles-tendinopathy","type":"Modifier","title":"Achilles tendinopathy","summary":"Load-related pain and stiffness in the Achilles tendon. Responds to progressive loading; responds badly to rest followed by an abrupt return to previous volume.","attrs":{"category":"condition","hallmark":"morning stiffness, pain warming up then returning after activity"},"citations":["JOSPT clinical practice guideline - Achilles tendinopathy (2018)","Alfredson eccentric calf loading protocol (1998)","Cook and Purdam tendon pathology continuum model (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteoporosis","type":"Modifier","title":"Osteoporosis","summary":"Bone density at or below a T-score of -2.5, or a prior fragility fracture. Loading and balance work become more important, while loaded spinal flexion becomes the thing to design around.","attrs":{"category":"condition","thresholds":"T-score <= -2.5 or prior fragility fracture","key_avoidance":"heavily loaded end-range spinal flexion and twisting"},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ISCD official positions on DXA (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-osteopenia","type":"Modifier","title":"Osteopenia","summary":"Bone density between -1.0 and -2.5. The window where loading changes the trajectory, and where doing nothing is the actual risk.","attrs":{"category":"condition","thresholds":"T-score -1.0 to -2.5"},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-obesity","type":"Modifier","title":"Obesity","summary":"Body mass sufficient to change joint loading, thermoregulation and exercise tolerance. Reshapes how activity is introduced; almost never a reason to withhold it.","attrs":{"category":"condition","considerations":"joint load, heat dissipation, starting capacity, chafing and skin integrity"},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-asthma","type":"Modifier","title":"Asthma","summary":"Reversible airway narrowing, often provoked by exercise, cold dry air, or high ventilation rates. Well-controlled asthma is compatible with essentially all training.","attrs":{"category":"condition","triggers":"cold dry air, high ventilation, allergens","note":"reliever inhaler available before sessions"},"citations":["GINA global strategy for asthma management (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gerd","type":"Modifier","title":"Gastro-oesophageal reflux disease","summary":"Acid reflux provoked by position, meal timing and intra-abdominal pressure. Mostly a timing and technique modifier rather than an exercise-selection one.","attrs":{"category":"condition","aggravators":"supine positions, heavy Valsalva, exercising soon after eating, late meals"},"citations":["ACG clinical guideline - GERD (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-atrial-fibrillation","type":"Modifier","title":"Atrial fibrillation","summary":"Irregular atrial rhythm, paroxysmal or persistent. Two practical consequences: heart-rate-based intensity targets stop meaning anything, and unsupervised open water gets riskier.","attrs":{"category":"condition","key_consequence":"heart rate is not a usable intensity signal during AF","management_context":"assumes rate/rhythm control and anticoagulation decisions are already handled clinically"},"citations":["ESC atrial fibrillation guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-uncontrolled-hypertension","type":"Modifier","title":"Uncontrolled hypertension","summary":"Blood pressure persistently above target despite treatment, or untreated. Maximal-effort and heavy Valsalva work waits until it is controlled; walking does not.","attrs":{"category":"condition","threshold_context":"resting BP repeatedly at or above 180/110 warrants deferring high-intensity work"},"citations":["ACC/AHA hypertension guideline (2017)","AHA scientific statement - resistance exercise and cardiovascular disease (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-early-ckd","type":"Modifier","title":"Early chronic kidney disease","summary":"Reduced kidney function at stage G1-G3. Changes protein targets and hydration planning; exercise itself remains clearly beneficial.","attrs":{"category":"condition","stages":"G1-G3","note":"protein targets should be set with the treating clinician, not from a general athletic recommendation"},"citations":["KDIGO CKD guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-sleep-apnea","type":"Modifier","title":"Obstructive sleep apnoea","summary":"Repeated airway collapse in sleep, producing fragmentation and daytime fatigue. Depresses training tolerance and recovery quality until it is treated.","attrs":{"category":"condition","consequence":"reduced recovery capacity, blunted training response, daytime sleepiness"},"citations":["AASM/AHA scientific statement - obstructive sleep apnoea (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pcos","type":"Modifier","title":"Polycystic ovary syndrome","summary":"An endocrine and metabolic syndrome with insulin resistance in the majority. Sharpens the case for resistance training and regular movement.","attrs":{"category":"condition","metabolic_note":"insulin resistance common independent of body weight"},"citations":["International evidence-based PCOS guideline (2023)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-gout","type":"Modifier","title":"Gout","summary":"Crystal arthropathy with acute, extremely painful flares. Between flares, training is normal; during one, loading the affected joint is not.","attrs":{"category":"condition","flare_state":"acute flares are transient - this modifier should be time-boxed, not permanent"},"citations":["ACR gout management guideline (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-migraine","type":"Modifier","title":"Migraine","summary":"Recurrent disabling headache with common triggers in sleep disruption, dehydration and abrupt intensity. Regular aerobic activity tends to reduce frequency over months.","attrs":{"category":"condition","triggers":"sleep irregularity, dehydration, skipped meals, abrupt maximal effort, heat"},"citations":["International Headache Society - secondary headache red flags"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-masld","type":"Modifier","title":"Metabolic dysfunction-associated steatotic liver disease","summary":"Fat accumulation in the liver on a metabolic background. Both aerobic and resistance training reduce liver fat, partly independently of weight change.","attrs":{"category":"condition","note":"liver fat falls with training even without large weight loss"},"citations":["EASL-EASD-EASO MASLD clinical practice guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety","type":"Modifier","title":"Depression or anxiety","summary":"Mood or anxiety disorder affecting motivation, energy and follow-through. The adherence axis dominates here: the plan that gets done beats the optimal plan.","attrs":{"category":"condition","planning_principle":"reduce the activation cost of the first session, not the eventual dose"},"citations":["Cochrane - exercise for depression (2013)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hypothyroidism","type":"Modifier","title":"Hypothyroidism","summary":"Underactive thyroid, treated or not. Untreated or under-replaced, it slows recovery, reduces exercise tolerance and can cause exertional muscle symptoms.","attrs":{"category":"condition","note":"symptoms attributed to training may be replacement-dose related"},"citations":["ATA guideline - hypothyroidism treatment (2014)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive","type":"Modifier","title":"Heat sensitivity","summary":"A person who tolerates exertional heat poorly - by history, medication, or prior heat illness. Individual vulnerability, distinct from the ambient conditions themselves.","attrs":{"category":"condition","causes":"prior heat illness, anticholinergic or diuretic medication, poor acclimatisation state","subcategory":"individual_susceptibility"},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned","type":"Modifier","title":"Beginner or deconditioned","summary":"Little recent training history. The dominant risk is not the exercise but the rate of progression into it, and the dominant failure is starting at a dose that cannot be repeated.","attrs":{"category":"condition","subcategory":"training_status","principle":"the first eight weeks buy tolerance, not fitness"},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult","type":"Modifier","title":"Older adult (65+)","summary":"Age band where strength, power and balance decline steepen and where a fall stops being an inconvenience. Nothing is removed; priorities and progression rates change.","attrs":{"category":"life_stage","age_band":"65+","priority_shift":"balance, power and protein move up the list"},"citations":["WHO Guidelines on Physical Activity and Sedentary Behaviour (2020)","USPSTF falls prevention in community-dwelling older adults (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy","type":"Modifier","title":"Pregnancy","summary":"Physiological changes across trimesters affecting balance, core mechanics, thermoregulation and supine tolerance. Activity is recommended; a few specific things are not.","attrs":{"category":"life_stage","trimester_dependent":true,"note":"specific plans belong with the maternity care team"},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate","type":"Modifier","title":"Hot and humid conditions","summary":"High wet-bulb conditions where evaporative cooling fails. The single environmental modifier most capable of turning an ordinary session into a medical emergency.","attrs":{"category":"environment","key_metric":"wet bulb globe temperature","escalation":"activity restriction thresholds rise as WBGT rises"},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain","type":"Modifier","title":"Downhill-heavy terrain","summary":"Routes with substantial sustained descent. Eccentric loading on the descent causes far more muscle damage and soreness than the same distance on the flat.","attrs":{"category":"environment","mechanism":"eccentric quadriceps and calf loading","consequence":"delayed soreness, temporary strength loss, higher injury risk when unaccustomed"},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude","type":"Modifier","title":"High altitude","summary":"Elevations above roughly 2,500 m. Reduced oxygen availability lowers sustainable intensity and adds an acute mountain sickness risk on rapid ascent.","attrs":{"category":"environment","threshold":"~2,500 m and above","ascent_rule":"gradual ascent above 3,000 m sleeping altitude"},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate","type":"Modifier","title":"Cold conditions","summary":"Cold, wind and icy ground. The airway and clothing issues are manageable; the fall risk on ice is the part that gets underweighted.","attrs":{"category":"environment","risks":"airway irritation, frostbite at extremes, slips on ice"},"citations":["Wilderness Medical Society practice guidelines - cold injury (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access","type":"Modifier","title":"No gym access","summary":"No membership or facility. Constrains equipment and external load, but almost nothing in the strength list actually requires a gym to start.","attrs":{"category":"access","workarounds":"bands, adjustable dumbbells, backpack load, bodyweight progressions"},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-pool-access","type":"Modifier","title":"No pool access","summary":"No usable pool. A hard constraint on swimming specifically, and the clearest case in the graph for a block that immediately offers substitutes.","attrs":{"category":"access"},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor","type":"Modifier","title":"Limited time","summary":"Realistically under about three hours a week for training. Forces explicit prioritisation, which usually means strength and short high-intensity work survive and long slow volume does not.","attrs":{"category":"access","budget":"under ~3 hours per week","principle":"protect the sessions with the steepest dose-response first"},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift","type":"Modifier","title":"Night shift work","summary":"Work schedule misaligned with the circadian system. Changes when training and eating land, and lowers the recovery available from a given amount of sleep.","attrs":{"category":"access","consequences":"compressed and fragmented sleep, misaligned meal timing, variable session timing"},"citations":["AASM practice parameters - shift work disorder (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming","type":"Modifier","title":"Prefers swimming","summary":"A stated preference for swimming. Preference is a legitimate modifier, not a concession - a moderately effective intervention performed for years beats an optimal one abandoned in a month.","attrs":{"category":"preference","rationale":"adherence is an axis of effectiveness, not a soft consideration","gap_to_watch":"swimming does not load bone"},"citations":["Attia, Outlive (2023) - author position","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-outdoors","type":"Modifier","title":"Prefers training outdoors","summary":"A stated preference for outdoor activity. Raises the practical value of anything that happens outside and is worth honouring when the alternatives are close in effect.","attrs":{"category":"preference","gap_to_watch":"weather dependence can create long gaps unless an indoor fallback exists"},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-home-workouts","type":"Modifier","title":"Prefers training at home","summary":"A stated preference for home-based training. Overlaps with the no-gym constraint but is a choice rather than a limit, so the substitutions are the same and the fram
