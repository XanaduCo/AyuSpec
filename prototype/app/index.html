ing is not.","attrs":{"category":"preference","workarounds":"bands, adjustable dumbbells, bodyweight progressions"},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-dislikes-running","type":"Modifier","title":"Dislikes running","summary":"A stated aversion to running. Running has no property that other modalities cannot supply - only impact loading is genuinely harder to replace, and that has strength substitutes.","attrs":{"category":"preference","note":"the one thing not fully replaceable is bone loading; cover it with impact or resistance work"},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-exertional-chest-pain","type":"Modifier","title":"Chest pain on exertion","summary":"Chest discomfort, pressure or arm and jaw pain brought on by effort and relieved by rest. Until evaluated, this is not a training-planning problem.","attrs":{"category":"red_flag","routing":"clinician","urgency":"urgent - same-day or emergency assessment if pain is present at rest or new"},"citations":["AHA/ACSM joint position - exercise and acute cardiovascular events (2007)","ACSM preparticipation health screening algorithm (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-syncope","type":"Modifier","title":"Fainting or near-fainting with exertion","summary":"Loss or near-loss of consciousness during or immediately after effort. Needs cardiac evaluation before any exertion plan exists.","attrs":{"category":"red_flag","routing":"clinician","urgency":"urgent"},"citations":["AHA/ACSM joint position - exercise and acute cardiovascular events (2007)","ACSM preparticipation health screening algorithm (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-unexplained-weight-loss","type":"Modifier","title":"Unexplained weight loss","summary":"Unintended loss of body weight without a change in intake or activity. Needs a diagnosis before anything is prescribed that would push weight lower.","attrs":{"category":"red_flag","routing":"clinician","threshold_context":"commonly flagged at >5% of body weight over 6-12 months"},"citations":["ACSM preparticipation health screening algorithm (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-neurological-deficit","type":"Modifier","title":"New neurological deficit","summary":"New weakness, numbness, loss of coordination or speech or vision change. Needs assessment; no exercise plan is the right first response.","attrs":{"category":"red_flag","routing":"clinician","urgency":"urgent"},"citations":["NICE NG59 low back pain and sciatica","ACSM preparticipation health screening algorithm (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cauda-equina-symptoms","type":"Modifier","title":"Cauda equina symptoms","summary":"Saddle numbness, new bladder or bowel dysfunction, or progressive bilateral leg weakness with back pain. A surgical emergency where delay costs function permanently.","attrs":{"category":"red_flag","routing":"clinician","urgency":"emergency - same-day imaging and surgical assessment"},"citations":["NICE NG59 and spinal surgical society standards - cauda equina emergency","NICE NG59 low back pain and sciatica"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-new-severe-headache","type":"Modifier","title":"New or severe headache","summary":"A headache that is new in character, maximal within seconds, or brought on by exertion. Needs evaluation before exertion is planned around it.","attrs":{"category":"red_flag","routing":"clinician","urgency":"urgent - emergency assessment for thunderclap onset"},"citations":["International Headache Society - secondary headache red flags"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"}],"edges":[{"id":"fn-aerobic-capacity|PART_OF|sys-cardiovascular","type":"PART_OF","from":"fn-aerobic-capacity","to":"sys-cardiovascular","attrs":{"spine_order":1,"note":"Also reached from the metabolic and neurocognitive spines; canonical home is cardiovascular."},"citations":["Ross et al. Circulation 2016 — AHA statement on cardiorespiratory fitness"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|PART_OF|sys-cardiovascular","type":"PART_OF","from":"fn-vascular-health","to":"sys-cardiovascular","attrs":{"spine_order":2},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport|PART_OF|sys-cardiovascular","type":"PART_OF","from":"fn-lipid-transport","to":"sys-cardiovascular","attrs":{"spine_order":3,"note":"Sits at the cardiovascular/metabolic boundary; lipoprotein burden is driven metabolically and damages vascularly."},"citations":["Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|PART_OF|sys-cardiovascular","type":"PART_OF","from":"fn-cardiac-efficiency","to":"sys-cardiovascular","attrs":{"spine_order":4},"citations":["Fletcher et al. Circulation 2013 — AHA exercise standards"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|PART_OF|sys-cardiovascular","type":"PART_OF","from":"fn-blood-pressure-regulation","to":"sys-cardiovascular","attrs":{"spine_order":5},"citations":["Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|PART_OF|sys-metabolic","type":"PART_OF","from":"fn-insulin-sensitivity","to":"sys-metabolic","attrs":{"spine_order":1},"citations":["ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|PART_OF|sys-metabolic","type":"PART_OF","from":"fn-glycemic-control","to":"sys-metabolic","attrs":{"spine_order":2},"citations":["ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|PART_OF|sys-metabolic","type":"PART_OF","from":"fn-body-composition","to":"sys-metabolic","attrs":{"spine_order":3,"note":"Lean mass is the musculoskeletal system's concern; the fat compartment is metabolic. One node, two spines."},"citations":["Ross et al. Nat Rev Endocrinol 2020 — waist circumference consensus"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health|PART_OF|sys-metabolic","type":"PART_OF","from":"fn-liver-health","to":"sys-metabolic","attrs":{"spine_order":4,"note":"MASLD is named for its metabolic driver; the hepatic/renal spine reaches the same node."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|PART_OF|sys-metabolic","type":"PART_OF","from":"fn-mitochondrial-function","to":"sys-metabolic","attrs":{"spine_order":5},"citations":["Holloszy & Coyle, J Appl Physiol 1984"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-aerobic-capacity","to":"out-independent-mobility","attrs":{"mechanism":"Everyday tasks demand a fixed absolute oxygen cost. As VO2max falls, ordinary activities consume a larger fraction of the ceiling until they become intolerable and then impossible.","backcasting":"This is the arithmetic behind the Centenarian Decathlon: pick the task, price it in mL/kg/min, add back the decline you expect between now and then, and that is the number you need today.","evidence_strength":"high","certainty":"high"},"citations":["Ross et al. Circulation 2016","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Attia, Outlive (2023), ch. 11 — backcasting from the decathlon — author framing"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|PROTECTS|out-freedom-from-ascvd","type":"PROTECTS","from":"fn-aerobic-capacity","to":"out-freedom-from-ascvd","attrs":{"mechanism":"Higher fitness associates with lower incidence of coronary events across every cohort that has measured it, partly through blood pressure, lipids and insulin sensitivity and partly independently of them.","evidence_strength":"high","certainty":"moderate","honesty_note":"The association is observational and graded. Trials raising fitness have not been powered for hard cardiovascular endpoints, so the causal share is inferred rather than demonstrated."},"citations":["Kodama et al. JAMA 2009","Mandsager et al. JAMA Netw Open 2018","Ross et al. Circulation 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|PROTECTS|out-cognitive-independence","type":"PROTECTS","from":"fn-aerobic-capacity","to":"out-cognitive-independence","attrs":{"mechanism":"Cerebral perfusion, vascular health and possibly neurotrophic signalling; midlife fitness associates with lower later dementia incidence.","evidence_strength":"moderate","certainty":"low","honesty_note":"Trials of exercise for cognitive outcomes in older adults have been largely disappointing relative to the strength of the observational signal. Rated moderate deliberately — this is a place where the popular framing runs ahead of the trial record."},"citations":["Livingston et al. Lancet 2024 — dementia prevention commission","Hörder et al. Neurology 2018 — midlife cardiovascular fitness and dementia in women","Brasure et al. Ann Intern Med 2018 — physical activity interventions and cognitive outcomes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|PROTECTS|out-freedom-from-ascvd","type":"PROTECTS","from":"fn-vascular-health","to":"out-freedom-from-ascvd","attrs":{"mechanism":"Plaque burden is the disease. Preventing its accumulation is definitionally preventing the outcome.","evidence_strength":"high","certainty":"high"},"citations":["Greenland et al. JACC 2018","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|PROTECTS|out-cognitive-independence","type":"PROTECTS","from":"fn-vascular-health","to":"out-cognitive-independence","attrs":{"mechanism":"Small-vessel disease and silent infarcts contribute substantially to late-life cognitive decline; mixed vascular-degenerative pathology is the norm at autopsy rather than the exception.","evidence_strength":"moderate","certainty":"moderate"},"citations":["Livingston et al. Lancet 2024","Gorelick et al. Stroke 2011 — AHA/ASA statement on vascular contributions to cognitive impairment"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport|PROTECTS|out-freedom-from-ascvd","type":"PROTECTS","from":"fn-lipid-transport","to":"out-freedom-from-ascvd","attrs":{"mechanism":"Atherogenic particle burden is the causal exposure; Mendelian randomisation and randomised lowering trials agree on both direction and magnitude, which is an unusually strong pairing.","evidence_strength":"high","certainty":"high","cumulative":"Effect scales with the product of concentration and duration, which is why a small reduction sustained from age 30 outweighs a large one started at 60."},"citations":["Ference et al. Eur Heart J 2017 — EAS consensus on LDL causality","Cholesterol Treatment Trialists' Collaboration, Lancet 2010","Sniderman et al. JAMA Cardiol 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-cardiac-efficiency","to":"out-independent-mobility","attrs":{"mechanism":"Stroke volume and ventricular compliance set the cardiac contribution to the oxygen delivery chain; when they fall, sustained activity becomes limited by breathlessness rather than by the legs.","evidence_strength":"moderate","certainty":"moderate"},"citations":["Fletcher et al. Circulation 2013","Ross et al. Circulation 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|PROTECTS|out-freedom-from-ascvd","type":"PROTECTS","from":"fn-cardiac-efficiency","to":"out-freedom-from-ascvd","attrs":{"mechanism":"Chronotropic competence and recovery kinetics associate with cardiovascular events independently of established risk factors.","evidence_strength":"moderate","certainty":"low","honesty_note":"Largely observational and heavily confounded by underlying fitness; a low resting heart rate in a trained person and in a person on a beta blocker mean different things."},"citations":["Cole et al. NEJM 1999 — heart rate recovery and mortality","Jensen et al. Heart 2013 — resting heart rate and mortality"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|PROTECTS|out-freedom-from-ascvd","type":"PROTECTS","from":"fn-blood-pressure-regulation","to":"out-freedom-from-ascvd","attrs":{"mechanism":"Mechanical stress on the arterial wall accelerates plaque formation and rupture; lowering pressure reduces events in randomised trials with a consistent dose-response.","evidence_strength":"high","certainty":"high","magnitude":"Roughly 10 mmHg systolic reduction corresponds to about a fifth fewer major cardiovascular events."},"citations":["Ettehad et al. Lancet 2016","SPRINT Research Group, NEJM 2015","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|PROTECTS|out-cognitive-independence","type":"PROTECTS","from":"fn-blood-pressure-regulation","to":"out-cognitive-independence","attrs":{"mechanism":"Midlife hypertension is among the strongest modifiable dementia risk factors, acting through small-vessel disease and white matter injury.","evidence_strength":"moderate","certainty":"moderate","trial_note":"SPRINT MIND reduced mild cognitive impairment but missed its primary probable-dementia endpoint, partly for lack of events. Strong signal, incomplete proof."},"citations":["SPRINT MIND Investigators, JAMA 2019","Livingston et al. Lancet 2024","Gorelick et al. Stroke 2011"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|PROTECTS|out-freedom-from-t2d","type":"PROTECTS","from":"fn-insulin-sensitivity","to":"out-freedom-from-t2d","attrs":{"mechanism":"Type 2 diabetes is the point at which beta-cell output can no longer compensate for resistance. Preserving sensitivity keeps the compensation demand low enough that it never has to.","evidence_strength":"high","certainty":"high"},"citations":["Knowler et al. NEJM 2002","Tabák et al. Lancet 2009","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|PROTECTS|out-metabolic-freedom","type":"PROTECTS","from":"fn-insulin-sensitivity","to":"out-metabolic-freedom","attrs":{"mechanism":"Sensitivity is the reserve that absorbs an irregular meal, a bad night or a week of travel without the system destabilising.","evidence_strength":"moderate","certainty":"moderate","framing_caveat":"The outcome is a framing device rather than a validated endpoint; rated on the physiology, not on outcome trials."},"citations":["Tabák et al. Lancet 2009","Magkos et al. Cell Metab 2016 — graded weight loss and metabolic function"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|PROTECTS|out-freedom-from-t2d","type":"PROTECTS","from":"fn-glycemic-control","to":"out-freedom-from-t2d","attrs":{"mechanism":"Post-load and post-meal glucose define the diagnostic boundary and predict progression better than fasting values.","evidence_strength":"high","certainty":"high"},"citations":["ADA Standards of Care in Diabetes 2025","WHO/IDF 2006","Hulman et al. Diabetologia 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|PROTECTS|out-cognitive-independence","type":"PROTECTS","from":"fn-glycemic-control","to":"out-cognitive-independence","attrs":{"mechanism":"Diabetes and higher glucose exposure associate with faster cognitive decline, plausibly through both microvascular and direct routes.","evidence_strength":"moderate","certainty":"low","honesty_note":"Intensive glucose lowering has not reliably improved cognitive outcomes in trials — ACCORD-MIND found no benefit. Association is clear; the intervention case is not."},"citations":["Crane et al. NEJM 2013 — glucose levels and risk of dementia","Launer et al. Lancet Neurol 2011 — ACCORD-MIND","Livingston et al. Lancet 2024"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|PROTECTS|out-metabolic-freedom","type":"PROTECTS","from":"fn-body-composition","to":"out-metabolic-freedom","attrs":{"mechanism":"Visceral and ectopic fat drive hepatic and muscle insulin resistance; lean mass provides the glucose disposal sink.","evidence_strength":"high","certainty":"high"},"citations":["Neeland et al. Lancet Diabetes Endocrinol 2019","Magkos et al. Cell Metab 2016","Ross et al. Nat Rev Endocrinol 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-body-composition","to":"out-independent-mobility","attrs":{"mechanism":"Lean mass and the strength that comes with it determine whether you can rise from a chair, climb stairs and catch yourself in a stumble at 85.","evidence_strength":"high","certainty":"high","cross_system":"The lean-mass half of this claim belongs to the musculoskeletal spine; recorded here because body composition is one node reached from both."},"citations":["Cruz-Jentoft et al. Age Ageing 2019 — EWGSOP2 sarcopenia consensus","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health|PROTECTS|out-metabolic-freedom","type":"PROTECTS","from":"fn-liver-health","to":"out-metabolic-freedom","attrs":{"mechanism":"Hepatic steatosis both reflects and worsens insulin resistance, and advanced fibrosis is the step where the condition stops being reversible.","evidence_strength":"moderate","certainty":"moderate","the_real_endpoint":"Fibrosis stage, not steatosis, is what predicts liver-related and all-cause mortality in MASLD."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Angulo et al. Gastroenterology 2015 — fibrosis stage and long-term outcomes"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|PROTECTS|out-metabolic-freedom","type":"PROTECTS","from":"fn-mitochondrial-function","to":"out-metabolic-freedom","attrs":{"mechanism":"Oxidative capacity in muscle determines how much fat can be used as fuel and how well substrate switching works — the physical basis of metabolic flexibility.","evidence_strength":"moderate","certainty":"moderate","honesty_note":"Mechanistically well grounded; the step from muscle biopsy findings to a person's lived metabolic resilience is inference, not measurement."},"citations":["Holloszy & Coyle, J Appl Physiol 1984","San-Millán & Brooks, Sports Med 2018","Goodpaster & Sparks, Cell Metab 2017 — metabolic flexibility"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|PROTECTS|out-independent-mobility","type":"PROTECTS","from":"fn-mitochondrial-function","to":"out-independent-mobility","attrs":{"mechanism":"Muscle oxidative capacity sets endurance at submaximal loads — how long you can keep walking, not how fast you can start.","evidence_strength":"moderate","certainty":"moderate"},"citations":["Coen et al. J Gerontol A Biol Sci Med Sci 2013 — muscle mitochondrial energetics and walking performance","Holloszy & Coyle, J Appl Physiol 1984"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|MEASURED_BY|mk-vo2max-cpet","type":"MEASURED_BY","from":"fn-aerobic-capacity","to":"mk-vo2max-cpet","attrs":{"validity":"strong","noise":"low","quality_tier":"A","note":"Not a proxy — this is the function itself, directly measured. Everything else in this list is an estimate of this number."},"citations":["Ross et al. Circulation 2016","American College of Sports Medicine, Guidelines for Exercise Testing and Prescription, 11th ed."],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|MEASURED_BY|mk-vo2max-wearable","type":"MEASURED_BY","from":"fn-aerobic-capacity","to":"mk-vo2max-wearable","attrs":{"validity":"moderate","noise":"high","quality_tier":"C","note":"Tracks direction in one person over months. The absolute value should not be compared to a percentile table or to another device.","experiment_implication":"With this noise level, a four-week n-of-1 cannot detect a plausible training effect. Anyone planning one should be told that before they start."},"citations":["Molina-Garcia et al. Sports Med 2022","Passler et al. Sensors 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|MEASURED_BY|mk-resting-hr","type":"MEASURED_BY","from":"fn-aerobic-capacity","to":"mk-resting-hr","attrs":{"validity":"weak","noise":"moderate","quality_tier":"C","note":"A downward drift over months in a training block is weakly consistent with improving fitness. It is equally consistent with sleeping better or drinking less."},"citations":["Nelson et al. JMIR Mhealth Uhealth 2020","Jensen et al. Heart 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|MEASURED_BY|mk-step-count","type":"MEASURED_BY","from":"fn-aerobic-capacity","to":"mk-step-count","attrs":{"validity":"weak","noise":"moderate","quality_tier":"C","note":"Measures activity volume, not capacity. A cyclist with excellent aerobic capacity can register 3,000 steps a day."},"citations":["Paluch et al. Lancet Public Health 2022","Bassett et al. Med Sci Sports Exerc 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-aerobic-capacity|MEASURED_BY|mk-rpe-session","type":"MEASURED_BY","from":"fn-aerobic-capacity","to":"mk-rpe-session","attrs":{"validity":"weak","noise":"high","quality_tier":"D","note":"A known pace feeling easier over time is genuine information about improving capacity, and it is the only signal available in the pool or on a hot day when heart rate is uninterpretable."},"citations":["Foster et al. J Strength Cond Res 2001","Borg G. Med Sci Sports Exerc 1982"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|MEASURED_BY|mk-vo2max-cpet","type":"MEASURED_BY","from":"fn-cardiac-efficiency","to":"mk-vo2max-cpet","attrs":{"validity":"moderate","noise":"low","quality_tier":"A","note":"VO2max is the product of cardiac output and arteriovenous oxygen difference, so it reflects cardiac efficiency without isolating it. Echocardiography would isolate it and belongs to a clinical pathway, not this graph."},"citations":["Fletcher et al. Circulation 2013","American College of Sports Medicine, Guidelines for Exercise Testing and Prescription, 11th ed."],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|MEASURED_BY|mk-resting-hr","type":"MEASURED_BY","from":"fn-cardiac-efficiency","to":"mk-resting-hr","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"C","note":"A lower resting rate for the same stroke volume is more efficient pumping. Confounded by medication, illness and alcohol at least as much as by training."},"citations":["Jensen et al. Heart 2013","Nelson et al. JMIR Mhealth Uhealth 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-cardiac-efficiency|MEASURED_BY|mk-hrv-wearable","type":"MEASURED_BY","from":"fn-cardiac-efficiency","to":"mk-hrv-wearable","attrs":{"validity":"weak","noise":"high","quality_tier":"C","note":"Reflects autonomic tone rather than cardiac mechanics. Included because users read it as a fitness score and the graph should say plainly that it is not one.","experiment_implication":"Day-to-day variation is large enough that any n-of-1 shorter than several weeks with daily measurement is underpowered."},"citations":["Shaffer & Ginsberg, Front Public Health 2017","Plews et al. Sports Med 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|MEASURED_BY|mk-cac-score","type":"MEASURED_BY","from":"fn-vascular-health","to":"mk-cac-score","attrs":{"validity":"strong","noise":"low","quality_tier":"A","note":"Direct visualisation of the disease process rather than a prediction of it — with the caveat that it sees only the calcified fraction.","min_interval_reminder":"Five years. Anyone proposing an annual scan is trading radiation and anxiety for noise."},"citations":["Greenland et al. JACC 2018","Budoff et al. Circulation 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|MEASURED_BY|mk-lpa","type":"MEASURED_BY","from":"fn-vascular-health","to":"mk-lpa","attrs":{"validity":"moderate","noise":"low","quality_tier":"B","note":"Measures a fixed inherited exposure, not current arterial state. Its role is to tell you how hard the wall is being pushed, not what condition it is in."},"citations":["Kronenberg et al. Eur Heart J 2022","Emerging Risk Factors Collaboration, JAMA 2009"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-vascular-health|MEASURED_BY|mk-bp-cuff","type":"MEASURED_BY","from":"fn-vascular-health","to":"mk-bp-cuff","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Pulse pressure widening is an indirect signal of arterial stiffening. Pulse wave velocity would measure compliance directly but is not routinely obtainable."},"citations":["Muntner et al. Hypertension 2019","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport|MEASURED_BY|mk-apob","type":"MEASURED_BY","from":"fn-lipid-transport","to":"mk-apob","attrs":{"validity":"strong","noise":"low","quality_tier":"B","note":"The closest available thing to counting the causal particles. Tier B rather than A only because it is a well-standardised assay rather than a direct physiological measurement.","why_it_leads":"When ApoB and LDL-C disagree, ApoB is the one that tracks events."},"citations":["Sniderman et al. JAMA Cardiol 2019","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport|MEASURED_BY|mk-ldl-c","type":"MEASURED_BY","from":"fn-lipid-transport","to":"mk-ldl-c","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Deliberately rated a step below ApoB on validity despite the same tier. It is usually calculated rather than measured, and it misreads risk in exactly the insulin-resistant people this graph most wants to catch.","practical_role":"The number the user already has. Treat it as the reason to order the better one."},"citations":["2018 AHA/ACC/Multisociety Cholesterol Guideline","Sniderman et al. JAMA Cardiol 2019","Martin et al. JAMA 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-lipid-transport|MEASURED_BY|mk-lpa","type":"MEASURED_BY","from":"fn-lipid-transport","to":"mk-lpa","attrs":{"validity":"strong","noise":"low","quality_tier":"B","note":"Measures a specific atherogenic particle class that ApoB partly includes but does not resolve. Once in a lifetime is genuinely enough.","actionability_caveat":"Strong validity, weak actionability — no proven way to lower it yet."},"citations":["Kronenberg et al. Eur Heart J 2022","Marcovina & Albers, J Lipid Res 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|MEASURED_BY|mk-bp-ambulatory","type":"MEASURED_BY","from":"fn-blood-pressure-regulation","to":"mk-bp-ambulatory","attrs":{"validity":"strong","noise":"low","quality_tier":"A","note":"The reference standard, and the only one that sees the night. Nocturnal non-dipping carries risk information that no daytime measurement contains."},"citations":["Stergiou et al. J Hypertens 2021","Muntner et al. Hypertension 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|MEASURED_BY|mk-bp-cuff","type":"MEASURED_BY","from":"fn-blood-pressure-regulation","to":"mk-bp-cuff","attrs":{"validity":"strong","noise":"moderate","quality_tier":"B","note":"Averaged home readings approach ambulatory performance and beat clinic readings. The noise rating is about technique and single readings, not about the device.","experiment_implication":"A week of duplicate morning and evening readings is the minimum unit; comparing one reading before and after a change is not an experiment."},"citations":["Muntner et al. Hypertension 2019","Stergiou et al. J Hypertens 2021","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-blood-pressure-regulation|MEASURED_BY|mk-resting-hr","type":"MEASURED_BY","from":"fn-blood-pressure-regulation","to":"mk-resting-hr","attrs":{"validity":"weak","noise":"moderate","quality_tier":"C","note":"Shares autonomic input with blood pressure regulation but does not estimate pressure. Present so the interface can refuse the common inference that a low resting heart rate implies good blood pressure."},"citations":["Jensen et al. Heart 2013","Shaffer & Ginsberg, Front Public Health 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-ogtt","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-ogtt","attrs":{"validity":"strong","noise":"moderate","quality_tier":"A","note":"A provocative test beats a static one for this function. With paired insulin sampling it becomes the best obtainable estimate outside a research clamp.","burden_note":"Three hours and a very sweet drink. High-quality and genuinely unpleasant is a real trade the frame should show."},"citations":["ADA Standards of Care in Diabetes 2025","Hulman et al. Diabetologia 2018","Libman et al. JAMA 2008"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-fasting-insulin","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-fasting-insulin","attrs":{"validity":"moderate","noise":"high","quality_tier":"B","note":"Rises years before glucose does, which is the whole appeal. Undermined by unharmonised assays, high within-person variability and the absence of any validated threshold.","honesty_note":"This is the marker where the longevity-medicine enthusiasm most exceeds the measurement quality. Worth measuring; not worth reacting to a single value.","experiment_implication":"With a within-person CV around 20–30 percent, detecting a modest real change needs repeated measurement at the same lab, months apart."},"citations":["Tabák et al. Lancet 2009","Manley et al. Clin Chem 2007","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-homa-ir","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-homa-ir","attrs":{"validity":"moderate","noise":"high","quality_tier":"B","note":"A derived index with no information beyond its two inputs, and it compounds their error. Useful for population comparison, shaky for one person's trend."},"citations":["Matthews et al. Diabetologia 1985","Wallace et al. Diabetes Care 2004","Muniyappa et al. Am J Physiol Endocrinol Metab 2008"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-cgm-variability","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-cgm-variability","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Large post-meal excursions in someone with normal fasting values are a reasonable signal of reduced sensitivity. What counts as 'large' in a person without diabetes is not standardised, so the interpretation is softer than the data density suggests."},"citations":["Shah et al. J Clin Endocrinol Metab 2019","Battelino et al. Diabetes Care 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-waist-circumference","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-waist-circumference","attrs":{"validity":"weak","noise":"moderate","quality_tier":"B","note":"Central adiposity is the dominant driver of resistance in most people, so a tape measure carries real information. It is still measuring the cause rather than the function."},"citations":["Ross et al. Nat Rev Endocrinol 2020","Neeland et al. Lancet Diabetes Endocrinol 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-insulin-sensitivity|MEASURED_BY|mk-sleep-duration-wearable","type":"MEASURED_BY","from":"fn-insulin-sensitivity","to":"mk-sleep-duration-wearable","attrs":{"validity":"weak","noise":"moderate","quality_tier":"C","note":"An exposure proxy, not a measure of the function. Short sleep reduces insulin sensitivity experimentally, so tracked duration tells you whether the sleep intervention is happening — it does not tell you what the pancreas is doing.","why_it_is_still_here":"Because the honest thing is to show the user a weak link labelled weak, rather than to omit the only sleep signal they have."},"citations":["Spiegel et al. Lancet 1999","de Zambotti et al. Sleep 2019","Cappuccio et al. Diabetes Care 2010"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|MEASURED_BY|mk-ogtt","type":"MEASURED_BY","from":"fn-glycemic-control","to":"mk-ogtt","attrs":{"validity":"strong","noise":"moderate","quality_tier":"A","note":"The diagnostic reference for post-load glucose handling and the only test that reliably catches isolated post-challenge hyperglycaemia.","reproducibility_caveat":"Only moderate test-retest agreement — a single borderline result is not a verdict."},"citations":["ADA Standards of Care in Diabetes 2025","WHO/IDF 2006","Libman et al. JAMA 2008"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|MEASURED_BY|mk-hba1c","type":"MEASURED_BY","from":"fn-glycemic-control","to":"mk-hba1c","attrs":{"validity":"strong","noise":"low","quality_tier":"B","note":"Standardised, cheap and stable — the best available summary of average exposure. Its weakness is timing, not quality: it moves late, and it says nothing about excursion shape.","min_interval_reminder":"Three months, set by red cell lifespan. A six-week repeat is measuring the same period twice."},"citations":["ADA Standards of Care in Diabetes 2025","Cavagnolli et al. PLoS One 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|MEASURED_BY|mk-fasting-glucose","type":"MEASURED_BY","from":"fn-glycemic-control","to":"mk-fasting-glucose","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Ubiquitous and weakly informative on its own. Day-to-day biological variation is large enough to move someone across the prediabetes line and back with nothing having changed."},"citations":["ADA Standards of Care in Diabetes 2025","Selvin et al. Diabetes Care 2007"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|MEASURED_BY|mk-cgm-variability","type":"MEASURED_BY","from":"fn-glycemic-control","to":"mk-cgm-variability","attrs":{"validity":"strong","noise":"moderate","quality_tier":"B","note":"The only marker here that sees the shape of a day rather than a summary of a quarter. That temporal resolution is what makes same-week n-of-1 testing possible at all.","experiment_implication":"Fourteen days per wear period, with the first day discarded. Comparing days on one sensor is valid; comparing across sensors is not.","demo_note":"This is the marker the post-meal walking experiment reads."},"citations":["Battelino et al. Diabetes Care 2019","Shah et al. J Clin Endocrinol Metab 2019","Freckmann et al. J Diabetes Sci Technol 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-glycemic-control|MEASURED_BY|mk-diet-recall","type":"MEASURED_BY","from":"fn-glycemic-control","to":"mk-diet-recall","attrs":{"validity":"weak","noise":"high","quality_tier":"D","note":"Records the input rather than the response. Necessary to interpret a glucose curve at all — a spike without a meal record is uninterpretable — and systematically biased by 20–30 percent under-reporting."},"citations":["Subar et al. Am J Epidemiol 2015","Schoeller DA. Metabolism 1995"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|MEASURED_BY|mk-dexa-visceral-fat","type":"MEASURED_BY","from":"fn-body-composition","to":"mk-dexa-visceral-fat","attrs":{"validity":"strong","noise":"low","quality_tier":"A","note":"Directly quantifies the compartments that matter, including the visceral one that a scale and a mirror both miss.","comparability_caveat":"Vendor-specific algorithms — scans from different machines are separate series, not one trend."},"citations":["Kaul et al. Obesity 2012","Shepherd et al. J Clin Densitom 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|MEASURED_BY|mk-waist-circumference","type":"MEASURED_BY","from":"fn-body-composition","to":"mk-waist-circumference","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Free, immediate, and better than BMI at every BMI. Cannot separate visceral from subcutaneous fat, and thresholds differ substantially by ancestry."},"citations":["Ross et al. Nat Rev Endocrinol 2020","WHO 2008 — waist circumference and waist-hip ratio report"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-body-composition|MEASURED_BY|mk-diet-recall","type":"MEASURED_BY","from":"fn-body-composition","to":"mk-diet-recall","attrs":{"validity":"weak","noise":"high","quality_tier":"D","note":"Estimates energy and protein intake, the inputs that determine where composition goes. Under-reporting is systematic and worse at higher body weight, so a computed deficit from a food log is not a number to trust."},"citations":["Schoeller DA. Metabolism 1995","Freedman et al. Am J Epidemiol 2014","Subar et al. Am J Epidemiol 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health|MEASURED_BY|mk-mri-pdff","type":"MEASURED_BY","from":"fn-liver-health","to":"mk-mri-pdff","attrs":{"validity":"strong","noise":"low","quality_tier":"A","note":"Quantitative, reproducible and responsive within weeks — good enough to be a trial endpoint. The barrier is cost and access, not measurement quality."},"citations":["Caussy et al. Hepatology 2018","Tang et al. Radiology 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health|MEASURED_BY|mk-fib4","type":"MEASURED_BY","from":"fn-liver-health","to":"mk-fib4","attrs":{"validity":"moderate","noise":"moderate","quality_tier":"B","note":"Estimates fibrosis, the thing that actually predicts mortality, from labs the user already owns. Strong at ruling out advanced fibrosis, weak in the wide indeterminate middle band, and distorted by age at both extremes."},"citations":["Sterling et al. Hepatology 2006","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","McPherson et al. Am J Gastroenterol 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-liver-health|MEASURED_BY|mk-liver-enzymes","type":"MEASURED_BY","from":"fn-liver-health","to":"mk-liver-enzymes","attrs":{"validity":"weak","noise":"moderate","quality_tier":"B","note":"Normal ALT does not exclude steatosis or even steatohepatitis, and the conventional reference range was set from populations that included undiagnosed disease. A good tier, a weak proxy — which is exactly why the two axes are separate."},"citations":["Prati et al. Ann Intern Med 2002","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Kwo et al. Am J Gastroenterol 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|MEASURED_BY|mk-vo2max-cpet","type":"MEASURED_BY","from":"fn-mitochondrial-function","to":"mk-vo2max-cpet","attrs":{"validity":"moderate","noise":"low","quality_tier":"A","note":"A whole-body ceiling that is set as much by central oxygen delivery as by peripheral oxidative capacity. Submaximal lactate and substrate-oxidation data from the same test speak more directly to mitochondria than the peak number does.","reference_standard_caveat":"The real reference is muscle biopsy with respirometry, which is a research procedure and not in this graph."},"citations":["San-Millán & Brooks, Sports Med 2018","Holloszy & Coyle, J Appl Physiol 1984","American College of Sports Medicine, Guidelines for Exercise Testing and Prescription, 11th ed."],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|MEASURED_BY|mk-rpe-session","type":"MEASURED_BY","from":"fn-mitochondrial-function","to":"mk-rpe-session","attrs":{"validity":"weak","noise":"high","quality_tier":"D","note":"A given absolute workload feeling easier over months is weak but real evidence of improved oxidative capacity. It is also the only signal available without a lab, which is why a Tier D marker survives here."},"citations":["Foster et al. J Strength Cond Res 2001","Borg G. Med Sci Sports Exerc 1982"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"fn-mitochondrial-function|MEASURED_BY|mk-cgm-variability","type":"MEASURED_BY","from":"fn-mitochondrial-function","to":"mk-cgm-variability","attrs":{"validity":"weak","noise":"moderate","quality_tier":"B","note":"Metabolic flexibility should in principle show up as smaller, faster-resolving glucose excursions. The inferential chain from an interstitial glucose curve to mitochondrial substrate handling is long and largely untested — good tier, weak validity, and the frame should show both."},"citations":["Goodpaster & Sparks, Cell Metab 2017","Shah et al. J Clin Endocrinol Metab 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-walking|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-walking","to":"fn-aerobic-capacity","attrs":{"effect_size":"small","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"low","reversibility":"reversible","adherence_realism":"high","dose":"30–60 minutes most days, or roughly 7,000–8,000 steps per day accumulated however it fits; brisk enough that speaking in full sentences takes slight effort.","ceiling_note":"Raises VO2max meaningfully only in people starting from deconditioned. In an already-active person the aerobic effect approaches nothing, and the value moves entirely to metabolic and adherence terms.","why_it_ranks_where_it_does":"Small effect, top-of-graph adherence. Under the default ordering it sits below running; under a preference model weighted for sustainability it can beat everything."},"citations":["Paluch et al. Lancet Public Health 2022","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Murtagh et al. Prev Med 2015 — walking interventions and fitness meta-analysis"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-walking|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-walking","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"low","reversibility":"reversible","adherence_realism":"high","dose":"Daily accumulation; breaking up prolonged sitting matters roughly as much as the total. Effect on sensitivity decays within about 48–72 hours of the last session, so frequency beats duration.","note":"Most of the demonstrated benefit in sedentary people comes from replacing sitting rather than from the walking itself being potent."},"citations":["Diaz et al. Ann Intern Med 2017 — sedentary behaviour patterns and mortality","Dempsey et al. Diabetes Care 2016 — interrupting sitting and glucose metabolism","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-walking|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-walking","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"low","reversibility":"reversible","adherence_realism":"high","dose":"Most days, 30 minutes or more, brisk. Expect roughly 2–4 mmHg systolic in people with elevated pressure and less in those already normotensive.","magnitude_honesty":"Real and modest. It does not substitute for pharmacological control in someone with stage 2 hypertension, and presenting it as an alternative would be the harmful version of this claim."},"citations":["Cornelissen & Smart, J Am Heart Assoc 2013 — exercise training and resting blood pressure meta-analysis","Whelton et al. 2017 ACC/AHA Hypertension Guideline","Murtagh et al. Prev Med 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-post-meal-walking","to":"fn-glycemic-control","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"high","time_to_effect":"immediate","cost":"free","risk":"negligible","effort":"trivial","reversibility":"reversible","adherence_realism":"high","dose":"Start walking within about 15–30 minutes of finishing the meal. Two to five minutes measurably blunts the excursion; 10–20 minutes at an easy pace does more. Delay past roughly an hour and most of the effect is gone. Do it after the largest carbohydrate meal first if only one walk is realistic.","mechanism":"Contracting muscle translocates GLUT4 independently of insulin, so glucose is taken up during the absorptive window rather than after it.","magnitude":"Meta-analysed reductions in postprandial glucose area under the curve are consistent across trials and clinically visible on a CGM trace — typically a substantially lower and earlier-resolving peak.","evidence_ceiling":"Rated moderate rather than high because the outcome measured is a same-day surrogate. No trial has shown that habitual post-meal walking prevents diabetes or cardiovascular events over and above the effect of the activity volume it adds.","certainty_reasoning":"Certainty is rated high even though evidence is moderate: the acute effect is highly reproducible and mechanistically obvious. The uncertainty is about long-run consequence, not about whether the glucose curve moves.","demo_path":"The lowest-effort intervention in the graph with a same-day measurable response — the natural first n-of-1 experiment, paired with CGM over 14 days."},"citations":["Buffey et al. Sports Med 2022 — light-intensity walking breaks and postprandial glycaemia meta-analysis","Reynolds et al. Diabetologia 2016 — post-meal walking in type 2 diabetes","Bellini et al. Nutrients 2022 — exercise timing and postprandial glycaemia","Colberg et al. Diabetes Care 2016 — ADA physical activity position statement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-post-meal-walking","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"trivial","reversibility":"reversible","adherence_realism":"high","dose":"After each main meal, daily. The chronic sensitivity effect, unlike the acute glucose effect, depends on accumulated volume rather than on timing.","honest_downgrade":"Rated low evidence deliberately. The acute glycaemic effect is well demonstrated; that repeating it daily improves measured insulin sensitivity is an extrapolation with little direct testing, and any effect that does exist is hard to separate from simply having walked more."},"citations":["Dempsey et al. Diabetes Care 2016","Buffey et al. Sports Med 2022","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-post-meal-walking","to":"fn-aerobic-capacity","attrs":{"effect_size":"none","evidence_strength":"moderate","certainty":"high","time_to_effect":"months","cost":"free","risk":"negligible","effort":"trivial","reversibility":"reversible","adherence_realism":"high","dose":"Not applicable — no dose of post-meal walking meaningfully raises VO2max in anyone who is not severely deconditioned.","why_an_explicit_none":"Authored as an explicit 'none' rather than left absent. The claim is that this intervention does not do this job, which is different from nobody having checked — and the interface should be able to say so when a user assumes their post-meal walks are their cardio."},"citations":["2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Murtagh et al. Prev Med 2015","Milanović et al. Sports Med 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-post-meal-walking|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-post-meal-walking","to":"fn-body-composition","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"free","risk":"negligible","effort":"trivial","reversibility":"reversible","adherence_realism":"high","dose":"10–20 minutes after each main meal, daily, which adds roughly 100–150 kcal per day of expenditure at typical walking economy.","honest_caveat":"Energy expenditure at this volume is small and frequently offset by compensatory eating or reduced activity later in the day. Rated small effect with low certainty for that reason."},"citations":["Buffey et al. Sports Med 2022","Careau et al. Curr Biol 2021 — energy compensation in humans","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-aerobic-capacity","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions per week of 45–60 minutes at conversational pace, progressing weekly volume by no more than about 10 percent. Expect measurable VO2max change in 6–12 weeks and continued gains over a year or more in a previously untrained person.","magnitude":"Untrained adults typically gain 10–20 percent in VO2max over three to six months of consistent moderate aerobic training; trained people gain far less and need intensity work to move at all.","attia_position":"Attia prescribes roughly 3–4 hours per week of Zone 2 as the aerobic foundation — about double the guideline minimum of 150 minutes of moderate activity.","consensus_note":"The effect of this training on aerobic capacity is not in dispute and is rated high. What is an author position rather than a guideline is the specific volume and the claim that the low-intensity zone is the right place to put it; guidelines specify total moderate-intensity minutes and are agnostic about zone.","risk_reasoning":"Risk is rated moderate, not low, because running injury incidence in recreational runners is substantial and concentrated in the first months. The graph refuses to hide the main reason this intervention fails.","reversibility_note":"Detraining is fast — meaningful VO2max loss within two to four weeks of stopping. The gain is rented, not owned."},"citations":["Milanović et al. Sports Med 2015 — endurance training and VO2max meta-analysis","Bull et al. Br J Sports Med 2020 — WHO physical activity guidelines","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)","Videbæk et al. Sports Med 2015 — running injury incidence","Attia, The Drive — Zone 2 volume prescription — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-mitochondrial-function","attrs":{"effect_size":"large","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"Blocks of 45 minutes or more are conventionally recommended on the argument that mitochondrial signalling responds to sustained duration; total weekly volume of 3–4 hours. Held at or just below the first lactate threshold — nasal breathing sustainable, full sentences possible, roughly 1.7–2.0 mmol/L if you have lactate data.","mechanism":"Endurance training increases mitochondrial density, oxidative enzyme activity and fat oxidation capacity, and improves lactate clearance.","attia_position":"Attia treats Zone 2 as specifically and near-uniquely the driver of mitochondrial function and metabolic flexibility, with the 45-minute block length as a meaningful threshold.","consensus_note":"That endurance training builds mitochondria is settled physiology from the 1960s onward. The specific claims — that the low-intensity zone is privileged for this adaptation, and that 45 minutes is a threshold rather than a convention — rest on mechanistic reasoning and small studies. Higher-intensity work also drives mitochondrial biogenesis, in some comparisons more per unit time. Rated moderate evidence and moderate certainty on exactly that basis, which is lower than the confidence with which the claim is usually stated.","measurement_gap":"The user cannot measure this function directly. Anything the interface shows them here is a proxy, and it should say so."},"citations":["Holloszy & Coyle, J Appl Physiol 1984","Granata et al. Sports Med 2018 — training intensity and mitochondrial adaptations","San-Millán & Brooks, Sports Med 2018","MacInnis & Gibala, J Physiol 2017 — physiological adaptations to interval versus continuous training","Attia, The Drive — Zone 2 and mitochondrial function — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-cardiac-efficiency","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-cardiac-efficiency","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"Sustained volume over months to years. Ventricular remodelling and plasma volume expansion follow accumulated training rather than any single session; resting heart rate typically falls within weeks and stroke volume changes take longer.","evidence_note":"Cardiac remodelling with endurance training is well documented; the link from remodelling to healthspan-relevant outcomes is inferred through aerobic capacity rather than measured directly."},"citations":["Fletcher et al. Circulation 2013","Arbab-Zadeh et al. Circulation 2014 — cardiac remodelling with prolonged endurance training","Wisløff et al. Circulation 2007"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-insulin-sensitivity","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"days","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly. A single session improves insulin sensitivity for roughly 24–72 hours, so spacing sessions across the week matters more than concentrating volume at the weekend.","speed_note":"One of the fastest-acting edges in the graph — the acute post-exercise improvement is measurable the next day, which makes it feasible to test with CGM.","decay":"The acute effect disappears within about three days of the last session, which is the physiological argument for frequency over duration."},"citations":["Colberg et al. Diabetes Care 2016","Bird & Hawley, BMJ Open Sport Exerc Med 2017 — exercise and insulin sensitivity update","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-body-composition","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 hours weekly produces a meaningful energy expenditure, but exercise alone is a weak fat-loss tool because intake and non-exercise activity compensate substantially.","honesty_note":"Rated small deliberately. Exercise-only weight loss trials consistently underdeliver relative to the calories the training burns. Its real contribution to composition is preserving the result of an energy deficit, not creating one.","visceral_specificity":"Aerobic training does appear to reduce visceral fat somewhat out of proportion to total weight change, which is the part worth keeping."},"citations":["Thorogood et al. Am J Med 2011 — aerobic exercise and weight loss meta-analysis","Verheggen et al. Obes Rev 2016 — exercise versus diet on visceral fat","Careau et al. Curr Biol 2021 — energy compensation"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"small","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly of 45–60 minutes. Expect roughly 4–8 mmHg systolic in people with hypertension, appreciably less in normotensives.","magnitude_honesty":"Real, replicated, and smaller than a single antihypertensive agent. Worth doing on its own merits and not a substitute for treatment when treatment is indicated."},"citations":["Cornelissen & Smart, J Am Heart Assoc 2013","Whelton et al. 2017 ACC/AHA Hypertension Guideline","Pescatello et al. Med Sci Sports Exerc 2019 — ACSM position on exercise and hypertension"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-zone2-running","to":"fn-lipid-transport","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"moderate","dose":"Sustained weekly volume. Effects concentrate on triglycerides and HDL-C, with only a small effect on ApoB or LDL-C.","expectation_management":"This is the edge where users most often expect more than the evidence gives. Aerobic training barely moves ApoB. If the goal is lowering atherogenic particle count, the honest ranking puts pharmacological lowering far above this, and saying so is the point of the comparison frame."},"citations":["Kelley et al. Prev Med 2004 — aerobic exercise and lipoproteins meta-analysis","Mann et al. Sports Med 2014 — exercise and lipid profile","Cholesterol Treatment Trialists' Collaboration, Lancet 2010"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-vo2max-intervals","to":"fn-aerobic-capacity","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"One session weekly of 4 × 4 minutes at roughly 90–95 percent of maximum heart rate with 3 minutes of easy recovery, built on an existing base of easy aerobic volume. Two sessions weekly is the practical ceiling before recovery cost outweighs the gain.","efficiency":"Produces larger VO2max gains per training hour than continuous moderate work — the most replicated finding in the interval literature.","adherence_reality":"Rated low. Interval training is unpleasant by design; long-term adherence in free-living adults is markedly worse than for moderate continuous exercise, and an abandoned interval programme delivers nothing.","attia_position":"Attia treats one weekly VO2max session as essential, on the basis that VO2max percentile is the dominant modifiable mortality predictor.","consensus_note":"That intervals raise VO2max efficiently is high-evidence. That raising your own VO2max moves you along the observational mortality curve is an extrapolation from cross-sectional fitness data — no trial has tested a VO2max-targeted programme against mortality. The training claim is rated high; the longevity inference behind it is not, and the two are deliberately not merged."},"citations":["Milanović et al. Sports Med 2015","Weston et al. Br J Sports Med 2014","Wisløff et al. Circulation 2007","Mandsager et al. JAMA Netw Open 2018","Attia, Outlive (2023), ch. 12 — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|SUPPORTS|fn-cardiac-efficiency","type":"SUPPORTS","from":"iv-vo2max-intervals","to":"fn-cardiac-efficiency","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"One to two sessions weekly over months. Stroke volume and cardiac output improvements are documented in both healthy and heart failure populations.","population_caveat":"Much of the strongest cardiac remodelling evidence comes from cardiac rehabilitation and heart failure cohorts, where the starting point is low. Extrapolation to a healthy trained adult is weaker than it looks."},"citations":["Wisløff et al. Circulation 2007","Weston et al. Br J Sports Med 2014","Fletcher et al. Circulation 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-vo2max-intervals","to":"fn-insulin-sensitivity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"One to three sessions weekly. Glycogen depletion during hard intervals appears to drive a substantial part of the subsequent insulin sensitivity improvement.","comparison":"Roughly comparable to moderate continuous training at matched energy expenditure, and better per unit time — which matters only if the sessions actually happen."},"citations":["Jelleyman et al. Obes Rev 2015 — HIIT and insulin resistance meta-analysis","Bird & Hawley, BMJ Open Sport Exerc Med 2017","Colberg et al. Diabetes Care 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-vo2max-intervals","to":"fn-mitochondrial-function","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"One to two sessions weekly alongside easy volume.","the_contested_bit":"High-intensity work drives mitochondrial biogenesis at least as effectively as low-intensity work per unit time in several direct comparisons. This edge exists partly to keep the graph honest about the Zone 2 claim next to it: the interface should show both edges and let the user see that the intensity question is not settled."},"citations":["MacInnis & Gibala, J Physiol 2017","Granata et al. Sports Med 2018","Gibala et al. J Physiol 2012 — adaptations to low-volume high-intensity training"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-cycling|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-cycling","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–5 sessions weekly of 45–90 minutes at conversational intensity, or shorter with interval structure. Indoor trainers make intensity control easier and weather irrelevant, which is worth more for adherence than it sounds.","modality_note":"Cycling-specific VO2max improves more than treadmill-tested VO2max — the adaptation is partly peripheral and partly skill. A cyclist tested on a treadmill will look worse than they are.","impact_advantage":"Near-zero impact loading, which is why it is a first-line substitute when running is blocked."},"citations":["Oja et al. Scand J Med Sci Sports 2011","Milanović et al. Sports Med 2015","Bull et al. Br J Sports Med 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-cycling|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-cycling","to":"fn-mitochondrial-function","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Sustained blocks of 45–90 minutes at steady low intensity, 3–4 times weekly. Power meters make the intensity target far more reliable than heart rate does.","note":"Most of the classical human mitochondrial training literature was in fact done on cycle ergometers, so this is one of the better-evidenced modalities for this specific function."},"citations":["Holloszy & Coyle, J Appl Physiol 1984","Granata et al. Sports Med 2018","MacInnis & Gibala, J Physiol 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-cycling|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-cycling","to":"fn-insulin-sensitivity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"days","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–5 sessions weekly; commuting by bicycle achieves this without any session ever being scheduled, which is the single best adherence trick in this part of the graph.","cohort_support":"Active commuting by bicycle associates with substantially lower cardiovascular and all-cause mortality in large cohorts — observational, with the usual healthy-commuter confounding."},"citations":["Celis-Morales et al. BMJ 2017 — active commuting and mortality","Colberg et al. Diabetes Care 2016","Oja et al. Scand J Med Sci Sports 2011"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-swimming","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly of 30–45 minutes of continuous or interval swimming. For a competent swimmer, structured sets (for example 10 × 100 m with short rest) deliver a more reliable aerobic stimulus than unstructured lengths, because stroke fatigue otherwise silently drops the intensity.","effect_size_reasoning":"Rated moderate rather than large, and the reason is technique rather than physiology. A competent swimmer can reach the same aerobic stimulus as a runner; an inefficient one is limited by stroke mechanics long before the cardiovascular system is challenged, so the same 45 minutes yields much less. The frame should show that the effect size here is conditional on skill in a way that walking and cycling are not.","heart_rate_correction":"Heart rate runs roughly 10–13 bpm lower in the water at equivalent effort because of horizontal posture, cooler water and the diving reflex. Zone targets calculated on land will make a swimmer think they are working easier than they are — perceived exertion is the better guide in the pool.","evidence_note":"The swim-specific outcome literature is thinner and drawn from smaller samples than the running, walking and cycling literature. Rated moderate evidence for that reason, not because the physiology differs.","joint_advantage":"Essentially no impact loading — the reason this is the default substitute when knee osteoarthritis, plantar fasciitis, stress reaction or low back pain block running or rucking.","bone_caveat":"The flip side of zero impact: swimming contributes essentially nothing to bone density, and swimmers show lower bone mineral density than land-based athletes. Someone swimming because running is blocked needs a separate answer for bone."},"citations":["Tanaka H. Int J Sports Med 2009 — swimming exercise and cardiovascular health","Chase, Sui & Blair, Int J Aquat Res Educ 2008","Bull et al. Br J Sports Med 2020","Gomez-Bruton et al. Sports Med 2013 — swimming and bone mineral density"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-cardiac-efficiency","type":"SUPPORTS","from":"iv-swimming","to":"fn-cardiac-efficiency","attrs":{"effect_size":"moderate","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly over months.","mechanism":"Horizontal immersion increases central blood volume and cardiac preload, so stroke volume during swimming is higher than during equivalent land exercise — a plausible route to favourable cardiac adaptation.","honest_downgrade":"Rated low evidence and low certainty. The immersion physiology is well characterised acutely; that it translates into better long-run cardiac efficiency than land training is inference from small studies. This is a mechanistically attractive claim without the trial base to match."},"citations":["Tanaka H. Int J Sports Med 2009","Pendergast et al. Eur J Appl Physiol 2015 — cardiovascular responses to immersion and swimming","Fletcher et al. Circulation 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-swimming","to":"fn-mitochondrial-function","attrs":{"effect_size":"moderate","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Continuous swimming in blocks of 30–45 minutes at an intensity you could hold for well over an hour, 3–4 times weekly.","recruitment_note":"Swimming recruits substantial upper-body musculature that running does not train at all, so the adaptation is distributed differently even at matched whole-body oxygen cost.","honest_downgrade":"Rated low evidence: the mitochondrial training literature is overwhelmingly cycling and running based. Applying it to swimming is a reasonable transfer of physiology, not a documented finding, and the graph says so rather than borrowing the running edge's rating."},"citations":["Holloszy & Coyle, J Appl Physiol 1984","Tanaka H. Int J Sports Med 2009","Granata et al. Sports Med 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-swimming","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Three to four sessions weekly of 30–45 minutes; the trial that most directly supports this used roughly 12 weeks of supervised swim training.","magnitude":"Small randomised work in previously sedentary middle-aged and older adults found systolic reductions in the range of 5–9 mmHg, alongside improved arterial compliance.","honest_downgrade":"Rated low evidence deliberately: small samples, short duration, few replications. The equivalent walking and cycling claims rest on meta-analyses of dozens of trials; this one does not, and the interface should not present them as equally supported just because the effect sizes look similar."},"citations":["Nualnim et al. Am J Cardiol 2012 — swim training and blood pressure","Cornelissen & Smart, J Am Heart Assoc 2013","Tanaka H. Int J Sports Med 2009"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-swimming","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"moderate","time_to_effect":"days","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly, spaced across the week rather than clustered, since the acute effect decays within 48–72 hours.","reasoning":"Certainty is moderate while evidence is low: the acute post-exercise insulin sensitivity effect is a general property of aerobic exercise and there is little reason to think swimming is exempt, but swim-specific trials with insulin endpoints are scarce.","appetite_caveat":"Swimming in cool water is anecdotally associated with larger post-exercise appetite than land exercise, which can offset the metabolic benefit. Poorly studied and worth flagging rather than asserting."},"citations":["Colberg et al. Diabetes Care 2016","Bird & Hawley, BMJ Open Sport Exerc Med 2017","Tanaka H. Int J Sports Med 2009"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-swimming","to":"fn-body-composition","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly of 30–45 minutes, in the context of an energy deficit — without one, no amount of any exercise reliably changes fat mass.","known_oddity":"Swim training has repeatedly underperformed land exercise for fat loss in comparative studies, with compensatory intake in cool water the usual proposed explanation. The finding is old, small-sample and not well replicated, but it is consistent enough to be worth stating rather than assuming equivalence.","honest_position":"Rated small with low certainty. Swimming is an excellent choice for many reasons; fat loss is not the strongest of them."},"citations":["Gwinup G. Am J Sports Med 1987 — weight loss with swimming, walking and cycling","Tanaka H. Int J Sports Med 2009","Verheggen et al. Obes Rev 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rowing|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-rowing","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly of 30–45 minutes steady, or interval sets such as 4 × 1000 m. Technique instruction first — a badly rowed 45 minutes is both less effective and more likely to hurt.","recruitment_advantage":"Engages a larger active muscle mass than cycling, so the achievable aerobic demand per minute is high.","risk_note":"Risk rated moderate because lumbar loading under fatig
