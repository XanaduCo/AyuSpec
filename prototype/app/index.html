re both recognised triggers, and both are scheduling decisions."},"citations":["International Headache Society - secondary headache red flags"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-migraine|ELEVATES|iv-sleep-regularity","type":"ELEVATES","from":"md-migraine","to":"iv-sleep-regularity","attrs":{"priority_delta":"moderate","reason":"Irregular sleep timing is one of the more consistently reported migraine triggers, which makes regularity a treatment-adjacent intervention here."},"citations":["International Headache Society - secondary headache red flags","AASM/SRS consensus - recommended sleep duration (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-migraine|CAUTIONS|iv-heat-acclimatization","type":"CAUTIONS","from":"md-migraine","to":"iv-heat-acclimatization","attrs":{"caveat":"A protocol that deliberately induces heat strain and mild dehydration is targeting two known triggers at once.","severity":"mild","resolution":"Acclimatise more gradually with tighter hydration, and stop the session at early warning symptoms rather than completing it."},"citations":["ACSM Position Stand - exertional heat illness (2007)","International Headache Society - secondary headache red flags"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-masld|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-masld","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Reduces liver fat even without substantial weight loss, and is often more sustainable than the aerobic volume usually prescribed."},"citations":["EASL-EASD-EASO MASLD clinical practice guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-masld|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"md-masld","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"large","reason":"Weight loss remains the intervention with the largest effect on liver fat and on histology."},"citations":["EASL-EASD-EASO MASLD clinical practice guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-masld|ELEVATES|iv-alcohol-reduction","type":"ELEVATES","from":"md-masld","to":"iv-alcohol-reduction","attrs":{"priority_delta":"moderate","reason":"Alcohol compounds the same injury pathway, so reduction has an additive effect on the liver specifically."},"citations":["EASL-EASD-EASO MASLD clinical practice guideline (2024)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-depression-anxiety","to":"iv-resistance-training","attrs":{"priority_delta":"moderate","reason":"Shows a mood benefit in its own right, and sessions are short and structured enough to survive low-motivation weeks."},"citations":["Cochrane - exercise for depression (2013)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety|ELEVATES|iv-walking","type":"ELEVATES","from":"md-depression-anxiety","to":"iv-walking","attrs":{"priority_delta":"moderate","reason":"The lowest activation cost of anything in the graph, which is the constraint that actually binds here."},"citations":["Cochrane - exercise for depression (2013)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety|ELEVATES|iv-sleep-regularity","type":"ELEVATES","from":"md-depression-anxiety","to":"iv-sleep-regularity","attrs":{"priority_delta":"moderate","reason":"Sleep and mood move together, and regularity is more achievable than duration when sleep is already disturbed."},"citations":["AASM/SRS consensus - recommended sleep duration (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-depression-anxiety","to":"iv-resistance-training","attrs":{"dimension":"dose","adjustment":"Start at a dose that feels almost too easy - two short sessions a week - and hold it until it is automatic before adding anything.","reason":"The binding constraint is starting and continuing, not the training stimulus. A programme that gets done at half the dose beats one that gets abandoned."},"citations":["Cochrane - exercise for depression (2013)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-depression-anxiety|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-depression-anxiety","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Shorter, more frequent sessions with a fixed time and place rather than long weekend efforts.","reason":"Consistency dominates volume when adherence is the limiting factor."},"citations":["Cochrane - exercise for depression (2013)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hypothyroidism|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-hypothyroidism","to":"iv-resistance-training","attrs":{"dimension":"dose","adjustment":"Allow longer between hard sessions and progress load more slowly while replacement is being optimised.","reason":"Under-replaced thyroid function slows recovery and can cause exertional muscle symptoms that get misread as overtraining."},"citations":["ATA guideline - hypothyroidism treatment (2014)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hypothyroidism|CAUTIONS|iv-vo2max-intervals","type":"CAUTIONS","from":"md-hypothyroidism","to":"iv-vo2max-intervals","attrs":{"caveat":"Untreated or under-replaced hypothyroidism reduces exercise tolerance and can produce muscle aching and cramping with hard efforts.","severity":"mild","resolution":"Keep intensity moderate until replacement is stable; unexplained new muscle symptoms are worth mentioning to the prescribing clinician."},"citations":["ATA guideline - hypothyroidism treatment (2014)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hypothyroidism|ELEVATES|iv-load-management","type":"ELEVATES","from":"md-hypothyroidism","to":"iv-load-management","attrs":{"priority_delta":"moderate","reason":"Recovery capacity is the variable that changes here, which makes deliberate load progression more important than usual."},"citations":["ATA guideline - hypothyroidism treatment (2014)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-heat-sensitive","to":"iv-zone2-running","attrs":{"dimension":"timing","adjustment":"Move sessions to early morning or after dark, and treat midday training in warm conditions as off the table.","reason":"Individual heat vulnerability shifts the risk threshold downward, so the same conditions that are fine for others are not fine here."},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive|ADJUSTS|iv-rucking","type":"ADJUSTS","from":"md-heat-sensitive","to":"iv-rucking","attrs":{"dimension":"environment","adjustment":"Reduce pack weight in warm conditions, plan water resupply, and choose shaded routes.","reason":"Carrying load raises metabolic heat production while a pack reduces the skin area available for cooling."},"citations":["NATA position statement - exertional heat illnesses (2015)","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive|ADJUSTS|iv-hiking","type":"ADJUSTS","from":"md-heat-sensitive","to":"iv-hiking","attrs":{"dimension":"timing","adjustment":"Start early, plan to be off exposed sections before the afternoon, and carry more water than the distance suggests.","reason":"Hikes are long and often far from help, which makes heat exposure harder to abort than a road run."},"citations":["NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-heat-sensitive","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-heat-acclimatization","reason":"Poor heat tolerance is partly an acclimatisation state rather than a fixed trait, and a structured exposure block is what shifts it.","sequencing":"Complete a 10-14 day graded acclimatisation block before resuming normal warm-weather running volume.","resolution":"Acclimatise deliberately rather than by accident; that is what makes warm-weather running available again."},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-heat-sensitive|CAUTIONS|iv-heat-acclimatization","type":"CAUTIONS","from":"md-heat-sensitive","to":"iv-heat-acclimatization","attrs":{"caveat":"The protocol deliberately induces heat strain, and prior heat illness raises the risk of it going wrong.","severity":"moderate","resolution":"Progress the exposure more slowly than the standard protocol, do not do it alone, and stop at early symptoms rather than completing the session."},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-beginner-deconditioned","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Use run-walk intervals from the start, increase frequency before duration, and hold each step for at least a week.","reason":"Cardiovascular capacity improves faster than tendon and bone tolerance, so what feels easy is regularly more than the tissue is ready for. This mismatch is the main mechanism behind first-year running injuries."},"citations":["BJSM consensus - return to running after injury","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-beginner-deconditioned","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-walking","reason":"A walking base establishes both the habit and the baseline tissue tolerance that running progression is built on.","sequencing":"Several weeks of regular walking before adding running intervals.","resolution":"Walk first, then add running intervals into the walks."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","BJSM consensus - return to running after injury"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|REQUIRES|iv-vo2max-intervals","type":"REQUIRES","from":"md-beginner-deconditioned","to":"iv-vo2max-intervals","attrs":{"prerequisite_node_id":"iv-zone2-running","reason":"High-intensity work assumes a base that can absorb it. Without one it produces injury and aversion rather than adaptation.","sequencing":"Establish 6-8 weeks of comfortable easy aerobic work before adding hard intervals.","resolution":"Intervals come later. The easy base is not a warm-up phase to be skipped."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-beginner-deconditioned","to":"iv-resistance-training","attrs":{"dimension":"dose","adjustment":"Two full-body sessions a week, one or two sets per pattern, load light enough to complete every repetition well.","reason":"Early gains come almost entirely from neural adaptation, so a small dose produces most of the available progress with minimal soreness."},"citations":["ACSM Position Stand 2011 - quantity and quality of exercise","Cochrane - progressive resistance training in older adults (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|CAUTIONS|iv-plyometrics","type":"CAUTIONS","from":"md-beginner-deconditioned","to":"iv-plyometrics","attrs":{"caveat":"Jumping is a high-force activity that assumes a strength base and landing competence, neither of which is present yet.","severity":"moderate","resolution":"Build strength first, then add impact work - a few weeks of delay costs nothing and removes most of the risk."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|REQUIRES|iv-plyometrics","type":"REQUIRES","from":"md-beginner-deconditioned","to":"iv-plyometrics","attrs":{"prerequisite_node_id":"iv-resistance-training","reason":"Landing safely is a strength problem before it is a technique problem.","sequencing":"8-12 weeks of resistance training before introducing jumping.","resolution":"Strength block first; the bone benefit of jumping is still there in three months."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|ADJUSTS|iv-rucking","type":"ADJUSTS","from":"md-beginner-deconditioned","to":"iv-rucking","attrs":{"dimension":"dose","adjustment":"Begin with an unloaded or very light pack and add weight before distance; roughly 10% of body weight is a reasonable starting load.","reason":"Load carriage injuries track with how fast the load was added, not with the absolute weight."},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-beginner-deconditioned|ELEVATES|iv-walking","type":"ELEVATES","from":"md-beginner-deconditioned","to":"iv-walking","attrs":{"priority_delta":"large","reason":"The largest health return per unit of effort sits at the very bottom of the activity range, which is exactly where a deconditioned person is starting."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","WHO Guidelines on Physical Activity and Sedentary Behaviour (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-older-adult","to":"iv-resistance-training","attrs":{"priority_delta":"large","reason":"Strength and power decline steepen with age and resistance training reverses part of that at any age, including in the ninth decade."},"citations":["Cochrane - progressive resistance training in older adults (2009)","WHO Guidelines on Physical Activity and Sedentary Behaviour (2020)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ELEVATES|iv-balance-training","type":"ELEVATES","from":"md-older-adult","to":"iv-balance-training","attrs":{"priority_delta":"large","reason":"Guidelines specifically add balance training at this age band because falls become the dominant modifiable threat to independence."},"citations":["WHO Guidelines on Physical Activity and Sedentary Behaviour (2020)","USPSTF falls prevention in community-dwelling older adults (2018)","Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ELEVATES|iv-protein-intake","type":"ELEVATES","from":"md-older-adult","to":"iv-protein-intake","attrs":{"priority_delta":"moderate","reason":"Older muscle responds less to a given protein dose, so the per-meal amount needed to trigger synthesis rises."},"citations":["ISSN position stand - protein and exercise (2017)","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ELEVATES|iv-grip-training","type":"ELEVATES","from":"md-older-adult","to":"iv-grip-training","attrs":{"priority_delta":"moderate","reason":"Grip is both a functional requirement for daily tasks and one of the better prognostic markers in this age band."},"citations":["Leong et al., Lancet (2015) - PURE grip strength and mortality","EWGSOP2 sarcopenia consensus (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-older-adult","to":"iv-resistance-training","attrs":{"dimension":"dose","adjustment":"Keep the intensity but allow more recovery between hard sessions, and progress load in smaller steps.","reason":"Recovery time lengthens with age while the response to loading remains intact - the fix is scheduling, not lighter weights."},"citations":["Cochrane - progressive resistance training in older adults (2009)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ADJUSTS|iv-plyometrics","type":"ADJUSTS","from":"md-older-adult","to":"iv-plyometrics","attrs":{"dimension":"dose","adjustment":"Substitute low-amplitude hops, fast step-ups and heel drops for full jumps, with low contact counts.","reason":"Power training is valuable here, and it is available in forms with far lower landing forces."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|CAUTIONS|iv-plyometrics","type":"CAUTIONS","from":"md-older-adult","to":"iv-plyometrics","attrs":{"caveat":"Landing forces meet reduced bone density and slower reactive control at the same time.","severity":"moderate","resolution":"Keep impact work in the programme in a scaled form rather than removing it - bone still needs strain rate."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-older-adult|ADJUSTS|iv-heat-acclimatization","type":"ADJUSTS","from":"md-older-adult","to":"iv-heat-acclimatization","attrs":{"dimension":"dose","adjustment":"Extend the acclimatisation block and shorten individual exposures; hydrate to schedule rather than to thirst.","reason":"Thermoregulation and thirst sensitivity both decline with age, so the standard protocol carries more risk and works more slowly."},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-pregnancy","to":"iv-zone2-running","attrs":{"caveat":"Running is generally safe to continue in an uncomplicated pregnancy, including for people who were not runners before, but comfort, pelvic floor symptoms and balance all change across trimesters.","severity":"mild","resolution":"Continue while it is comfortable, adjusting pace and distance by how you feel rather than to a plan. Specific decisions belong with your maternity team."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-pregnancy","to":"iv-zone2-running","attrs":{"dimension":"intensity","adjustment":"Use the talk test rather than heart rate zones, and stop for warning symptoms rather than pushing through them.","reason":"Resting and exercising heart rate both shift in pregnancy, so heart-rate-based zones stop meaning what they did."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-pregnancy","to":"iv-resistance-training","attrs":{"dimension":"technique","adjustment":"Move away from prolonged supine positions after the first trimester, reduce heavy breath-holding, and adjust stance as the abdomen changes.","reason":"Supine positions can reduce venous return later in pregnancy, and Valsalva loads the pelvic floor at a time when it is already loaded."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|BLOCKS|iv-plyometrics","type":"BLOCKS","from":"md-pregnancy","to":"iv-plyometrics","attrs":{"reason":"Repetitive high-impact jumping combines fall risk from a shifted centre of mass with pelvic floor loading, and the potential benefit over the same months is small.","severity":"moderate","resolution":"Pause jumping for the duration. Resistance training supplies a bone stimulus without landing forces, and impact work can resume postpartum with pelvic floor guidance.","temporary":true},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|BLOCKS|iv-heat-acclimatization","type":"BLOCKS","from":"md-pregnancy","to":"iv-heat-acclimatization","attrs":{"reason":"The protocol deliberately raises core temperature, and sustained hyperthermia in pregnancy is one of the few genuinely avoidable exposures.","severity":"moderate","resolution":"Do not run a heat acclimatisation block during pregnancy. Train in cooler conditions or indoors instead.","temporary":true},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)","ACSM Position Stand - exertional heat illness (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|CAUTIONS|iv-balance-training","type":"CAUTIONS","from":"md-pregnancy","to":"iv-balance-training","attrs":{"caveat":"The centre of mass shifts forward as pregnancy progresses, which is exactly the perturbation balance training deliberately introduces.","severity":"mild","resolution":"Keep balance work - it is useful now and postpartum - but do it next to something to hold."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|ADJUSTS|iv-balance-training","type":"ADJUSTS","from":"md-pregnancy","to":"iv-balance-training","attrs":{"dimension":"environment","adjustment":"Work within reach of a wall or rail, on a stable surface, and skip eyes-closed progressions.","reason":"Preserves the training stimulus while removing the fall itself as a possible outcome."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|BLOCKS|iv-time-restricted-eating","type":"BLOCKS","from":"md-pregnancy","to":"iv-time-restricted-eating","attrs":{"reason":"Deliberate fasting windows conflict with the increased and more continuous nutritional demand of pregnancy.","severity":"moderate","resolution":"Set eating patterns with your maternity care team rather than from a metabolic protocol.","temporary":true},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-pregnancy|ELEVATES|iv-trunk-stability","type":"ELEVATES","from":"md-pregnancy","to":"iv-trunk-stability","attrs":{"priority_delta":"moderate","reason":"Trunk and pelvic floor capacity are directly relevant during pregnancy and to postpartum recovery."},"citations":["ACOG Committee Opinion 804 - physical activity in pregnancy (2020)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ADJUSTS|iv-zone2-running|timing","type":"ADJUSTS","from":"md-hot-humid-climate","to":"iv-zone2-running","attrs":{"dimension":"timing","adjustment":"Move the session to early morning or after dark, and treat afternoon running in high wet-bulb conditions as a different activity rather than the same one in worse weather.","reason":"When humidity blocks evaporative cooling, core temperature climbs at a given workload regardless of fitness. Timing is the single highest-yield adjustment.","escalates_to":"BLOCKS","escalation_when":"wet bulb globe temperature above the activity-cancellation threshold, or moderate conditions combined with anticholinergic, diuretic or stimulant medication, or a history of heat illness","qualifier":"timing"},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ADJUSTS|iv-zone2-running|intensity","type":"ADJUSTS","from":"md-hot-humid-climate","to":"iv-zone2-running","attrs":{"dimension":"intensity","adjustment":"Run to effort rather than to pace, and expect pace to drop meaningfully at the same effort. Plan fluid intake rather than relying on thirst.","reason":"Cardiac drift in heat means the same pace is a materially harder session, and holding pace is how a routine run becomes a heat casualty.","escalates_to":"BLOCKS","escalation_when":"extreme wet bulb globe temperature, or symptoms of heat illness during the session","qualifier":"intensity"},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|REQUIRES|iv-zone2-running","type":"REQUIRES","from":"md-hot-humid-climate","to":"iv-zone2-running","attrs":{"prerequisite_node_id":"iv-heat-acclimatization","reason":"Acclimatisation is a real physiological adaptation - plasma volume, earlier sweat onset, lower sweat sodium - and it is the difference between tolerating the conditions and being at risk in them.","sequencing":"10-14 days of progressive heat exposure before normal warm-season training volume; repeat after any extended break because the adaptation decays within weeks.","resolution":"Acclimatise deliberately over about two weeks before resuming full volume in the heat."},"citations":["ACSM Position Stand - exertional heat illness (2007)","NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ADJUSTS|iv-rucking","type":"ADJUSTS","from":"md-hot-humid-climate","to":"iv-rucking","attrs":{"dimension":"timing","adjustment":"Ruck at the cool ends of the day, cut pack weight in heat, and plan water resupply into the route.","reason":"A pack raises heat production and covers the back, cutting the skin area available for evaporation - load carriage in heat is disproportionately hard.","escalates_to":"BLOCKS","escalation_when":"high wet bulb globe temperature combined with pack loads above roughly 15% of body weight"},"citations":["NATA position statement - exertional heat illnesses (2015)","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ADJUSTS|iv-hiking","type":"ADJUSTS","from":"md-hot-humid-climate","to":"iv-hiking","attrs":{"dimension":"timing","adjustment":"Start at first light, aim to clear exposed sections before midday, and carry more water than the distance would normally require.","reason":"Hikes are long, remote and hard to abort, so heat exposure has to be planned out rather than managed in the moment.","escalates_to":"BLOCKS","escalation_when":"extreme heat warning on an exposed route with no bail-out point"},"citations":["NATA position statement - exertional heat illnesses (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|REQUIRES|iv-rucking","type":"REQUIRES","from":"md-hot-humid-climate","to":"iv-rucking","attrs":{"prerequisite_node_id":"iv-heat-acclimatization","reason":"Loaded walking in heat is the combination with the highest documented heat illness rate, and acclimatisation is the established mitigation.","sequencing":"Acclimatise unloaded or lightly loaded first, then reintroduce pack weight.","resolution":"Acclimatise before loaded distance in the heat, not during it."},"citations":["NATA position statement - exertional heat illnesses (2015)","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-hot-humid-climate","to":"iv-vo2max-intervals","attrs":{"dimension":"environment","adjustment":"Move hard sessions indoors to air conditioning, or lengthen recoveries and cut the number of repetitions.","reason":"High-intensity work generates the most metabolic heat of anything in the programme, and it is the easiest session to relocate."},"citations":["ACSM Position Stand - exertional heat illness (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-hot-humid-climate|ELEVATES|iv-swimming","type":"ELEVATES","from":"md-hot-humid-climate","to":"iv-swimming","attrs":{"priority_delta":"moderate","reason":"Water removes the thermoregulatory constraint entirely, which makes it the obvious warm-season aerobic option where a pool exists."},"citations":["ACSM Position Stand - exertional heat illness (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-downhill-terrain","to":"iv-zone2-running","attrs":{"caveat":"Descent loads the quadriceps and calf eccentrically, which produces far more muscle damage, soreness and temporary strength loss than the same distance on the flat. Injury risk is concentrated here rather than on the climbs.","severity":"moderate","resolution":"Keep the routes. Introduce descent volume deliberately as its own training variable, and expect two to three days of soreness after an unaccustomed descent."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-downhill-terrain","to":"iv-hiking","attrs":{"caveat":"Most hiking injuries happen on the way down, when eccentric fatigue has already accumulated and attention has dropped.","severity":"moderate","resolution":"Plan descents as the demanding half of the day rather than the reward, and keep something in reserve for them."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-downhill-terrain","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Add descent gradually as a separate variable from total distance, shorten stride and raise cadence on steep sections.","reason":"Downhill tolerance is trainable and adapts quickly, but only if it is progressed rather than encountered."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage","Running cadence and impact loading - biomechanics literature"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|ADJUSTS|iv-hiking","type":"ADJUSTS","from":"md-downhill-terrain","to":"iv-hiking","attrs":{"dimension":"equipment","adjustment":"Use trekking poles on sustained descents and footwear with reliable grip and a secure heel.","reason":"Poles measurably reduce lower limb loading on descent, which is the highest-load and highest-fall-risk part of the day."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|ELEVATES|iv-eccentric-loading","type":"ELEVATES","from":"md-downhill-terrain","to":"iv-eccentric-loading","attrs":{"priority_delta":"moderate","reason":"Eccentric strength work is specifically protective against the muscle damage descents cause - the repeated bout effect is what training it buys."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage","Alfredson eccentric calf loading protocol (1998)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-downhill-terrain|ELEVATES|iv-quadriceps-strengthening","type":"ELEVATES","from":"md-downhill-terrain","to":"iv-quadriceps-strengthening","attrs":{"priority_delta":"moderate","reason":"The quadriceps do the braking on every descent step; capacity there is what determines how the last kilometre goes."},"citations":["Sports Medicine review - eccentric exercise and exercise-induced muscle damage"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-high-altitude","to":"iv-zone2-running","attrs":{"dimension":"intensity","adjustment":"Run to effort, not to pace - expect pace at a given effort to be substantially slower, and more so above 3,000 m.","reason":"Reduced oxygen availability lowers sustainable workload. Holding sea-level pace converts an easy run into a hard one without any sign of it in the plan."},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-high-altitude","to":"iv-vo2max-intervals","attrs":{"dimension":"intensity","adjustment":"Cut repetition count and lengthen recoveries for the first week at altitude; expect maximal power to be lower.","reason":"Maximal aerobic capacity falls with altitude, so the same session prescription is a materially harder one."},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude|ADJUSTS|iv-hiking","type":"ADJUSTS","from":"md-high-altitude","to":"iv-hiking","attrs":{"dimension":"dose","adjustment":"Limit gains in sleeping altitude above 3,000 m and build in acclimatisation days rather than pushing height.","reason":"Acute mountain sickness tracks with rate of ascent more than with fitness or effort."},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-high-altitude","to":"iv-hiking","attrs":{"caveat":"Headache, nausea and disproportionate breathlessness at altitude are the early signs of acute mountain sickness, and continuing to ascend is what turns it serious.","severity":"moderate","resolution":"Descend on worsening symptoms rather than pushing on. Ataxia or confusion at altitude is an emergency."},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-high-altitude|ADJUSTS|iv-rucking","type":"ADJUSTS","from":"md-high-altitude","to":"iv-rucking","attrs":{"dimension":"dose","adjustment":"Reduce both pack weight and distance for the first days at altitude.","reason":"Load carriage raises oxygen demand at exactly the point where supply is limited."},"citations":["Wilderness Medical Society practice guidelines - acute altitude illness (2019)","Knapik et al. - load carriage physiology and injury, Military Medicine"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-cold-climate","to":"iv-zone2-running","attrs":{"dimension":"equipment","adjustment":"Layer for the temperature you will be at twenty minutes in, cover the extremities, and use grip footwear or traction devices on ice.","reason":"Cold is largely a clothing problem; the exception is traction, which is a safety problem."},"citations":["Wilderness Medical Society practice guidelines - cold injury (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate|CAUTIONS|iv-zone2-running","type":"CAUTIONS","from":"md-cold-climate","to":"iv-zone2-running","attrs":{"caveat":"Ice is the actual hazard. A fall on frozen ground is the most likely cold-weather injury by a wide margin, and it matters more where bone density is low.","severity":"moderate","resolution":"Move to a treadmill or cleared surface on icy days rather than running the same route more carefully."},"citations":["Wilderness Medical Society practice guidelines - cold injury (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate|ADJUSTS|iv-cycling","type":"ADJUSTS","from":"md-cold-climate","to":"iv-cycling","attrs":{"dimension":"environment","adjustment":"Move to an indoor trainer when roads are icy or temperatures are low - riding speed makes wind chill much worse than the air temperature suggests.","reason":"Cycling loses more to cold than running does because of the self-generated wind, and the fall consequences on ice are worse."},"citations":["Wilderness Medical Society practice guidelines - cold injury (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate|ELEVATES|iv-balance-training","type":"ELEVATES","from":"md-cold-climate","to":"iv-balance-training","attrs":{"priority_delta":"moderate","reason":"Slip recovery is a trainable skill, and the season that makes falls likely is the season it pays off."},"citations":["Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-cold-climate|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-cold-climate","to":"iv-resistance-training","attrs":{"priority_delta":"small","reason":"Indoor and weather-independent, so it holds the programme together through the months when outdoor consistency drops."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-no-gym-access","to":"iv-resistance-training","attrs":{"dimension":"equipment","adjustment":"Build the programme from resistance bands, a pair of adjustable dumbbells or a loaded backpack, and bodyweight progressions - single-leg and elevated variants supply progression once bodyweight becomes easy.","reason":"The stimulus is progressive load, not a barbell. The genuine limitation is the top end of loading, which most people are years away from reaching."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ADJUSTS|iv-grip-training","type":"ADJUSTS","from":"md-no-gym-access","to":"iv-grip-training","attrs":{"dimension":"equipment","adjustment":"Use a doorway pull-up bar, a towel over a rail, or heavy shopping bags for timed holds.","reason":"Grip work needs something to hold, and almost anything will do."},"citations":["Roberts et al. - standardised protocol for grip strength measurement"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ADJUSTS|iv-farmers-carry","type":"ADJUSTS","from":"md-no-gym-access","to":"iv-farmers-carry","attrs":{"dimension":"equipment","adjustment":"Carry shopping bags, water containers or a loaded backpack over a fixed distance.","reason":"Loaded carries are the strength exercise least dependent on equipment, which is why they survive this constraint best."},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ADJUSTS|iv-quadriceps-strengthening","type":"ADJUSTS","from":"md-no-gym-access","to":"iv-quadriceps-strengthening","attrs":{"dimension":"equipment","adjustment":"Use split squats, step-ups onto a stair, and slow tempo sit-to-stands; add a backpack for load.","reason":"Knee extensor loading scales well with single-leg variants and needs no machine."},"citations":["Cochrane - exercise for knee osteoarthritis (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ADJUSTS|iv-posterior-chain-strength","type":"ADJUSTS","from":"md-no-gym-access","to":"iv-posterior-chain-strength","attrs":{"dimension":"equipment","adjustment":"Single-leg Romanian deadlifts with a backpack, hip thrusts from a sofa, and Nordic curl progressions with a fixed anchor.","reason":"Hinge loading is achievable without a barbell; it just requires more attention to progression."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|BLOCKS|iv-elliptical","type":"BLOCKS","from":"md-no-gym-access","to":"iv-elliptical","attrs":{"reason":"The machine is the intervention, and there is no home-equivalent substitute for it.","severity":"mild","resolution":"Not available without a facility. Outdoor walking, running, cycling or stair repeats supply the same aerobic stimulus.","suppress_substitutes":false},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ELEVATES|iv-rucking","type":"ELEVATES","from":"md-no-gym-access","to":"iv-rucking","attrs":{"priority_delta":"moderate","reason":"Turns a backpack and a pavement into a combined aerobic and loading session, which is the best answer this constraint has."},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-gym-access|ELEVATES|iv-plyometrics","type":"ELEVATES","from":"md-no-gym-access","to":"iv-plyometrics","attrs":{"priority_delta":"moderate","reason":"The bone stimulus with no equipment requirement at all, which matters more when heavy loading is not available."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-pool-access|BLOCKS|iv-swimming","type":"BLOCKS","from":"md-no-pool-access","to":"iv-swimming","attrs":{"reason":"Swimming requires a pool or safe open water. This is a facility constraint, not a health one.","severity":"mild","resolution":"Not currently available. Cycling, rowing and the elliptical give a comparable low-impact aerobic stimulus, and any of them can carry the same weekly dose.","suppress_substitutes":false},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-pool-access|ELEVATES|iv-cycling","type":"ELEVATES","from":"md-no-pool-access","to":"iv-cycling","attrs":{"priority_delta":"moderate","reason":"The closest available match on impact and on aerobic stimulus."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-pool-access|ELEVATES|iv-rowing","type":"ELEVATES","from":"md-no-pool-access","to":"iv-rowing","attrs":{"priority_delta":"small","reason":"Keeps the whole-body pattern swimmers tend to prefer, though it loads the lumbar spine in a way swimming does not."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-no-pool-access|ELEVATES|iv-elliptical","type":"ELEVATES","from":"md-no-pool-access","to":"iv-elliptical","attrs":{"priority_delta":"small","reason":"Low impact and widely available, at the cost of being the least engaging option on the list."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ELEVATES|iv-vo2max-intervals","type":"ELEVATES","from":"md-time-poor","to":"iv-vo2max-intervals","attrs":{"priority_delta":"large","reason":"The steepest aerobic return per minute available. When the budget is the binding constraint, this is where it goes."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ELEVATES|iv-post-meal-walking","type":"ELEVATES","from":"md-time-poor","to":"iv-post-meal-walking","attrs":{"priority_delta":"moderate","reason":"Costs no dedicated time at all because it attaches to something already happening."},"citations":["ADA Standards of Care (2024) - physical activity"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ELEVATES|iv-farmers-carry","type":"ELEVATES","from":"md-time-poor","to":"iv-farmers-carry","attrs":{"priority_delta":"moderate","reason":"One exercise covering grip, trunk and legs is the right shape for a fifteen-minute session."},"citations":["Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ELEVATES|iv-stair-climbing","type":"ELEVATES","from":"md-time-poor","to":"iv-stair-climbing","attrs":{"priority_delta":"moderate","reason":"High intensity with no travel time and no equipment - usable in whatever gap exists."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-time-poor","to":"iv-resistance-training","attrs":{"dimension":"dose","adjustment":"Two full-body sessions a week built from compound patterns, with sets taken close to failure to compensate for lower volume.","reason":"Most of the strength benefit is available in two sessions a week; the fourth and fifth sessions add much less than people assume."},"citations":["ACSM Position Stand 2011 - quantity and quality of exercise","Cochrane - progressive resistance training in older adults (2009)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-time-poor","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Shorter, more frequent runs rather than one long weekend effort, and consider commuting on foot to absorb the time cost.","reason":"Frequency survives a constrained schedule better than duration does."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|ADJUSTS|iv-balance-training","type":"ADJUSTS","from":"md-time-poor","to":"iv-balance-training","attrs":{"dimension":"timing","adjustment":"Attach it to an existing daily routine - single-leg stance while brushing teeth or waiting for the kettle.","reason":"Balance work is effective in very short doses, which makes it the intervention best suited to being embedded rather than scheduled."},"citations":["Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-time-poor|CAUTIONS|iv-hiking","type":"CAUTIONS","from":"md-time-poor","to":"iv-hiking","attrs":{"caveat":"The activity is fine; the problem is that a half-day commitment is the first thing to get cancelled, so it rarely accumulates.","severity":"mild","resolution":"Keep it as the enjoyable occasional session, but do not let the weekly plan depend on it."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|ADJUSTS|iv-vo2max-intervals","type":"ADJUSTS","from":"md-night-shift","to":"iv-vo2max-intervals","attrs":{"dimension":"timing","adjustment":"Put hard sessions early in a run of shifts rather than at the end, and avoid them immediately before a sleep period.","reason":"Accumulated sleep debt across a shift block degrades both performance and recovery, and hard exercise close to sleep delays it further."},"citations":["AASM practice parameters - shift work disorder (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|ADJUSTS|iv-resistance-training","type":"ADJUSTS","from":"md-night-shift","to":"iv-resistance-training","attrs":{"dimension":"timing","adjustment":"Anchor sessions to a fixed point in the shift cycle rather than to clock time, so the schedule survives rotation.","reason":"Consistency relative to the work pattern is more achievable than consistency relative to the calendar, and it is what actually keeps the habit."},"citations":["AASM practice parameters - shift work disorder (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-night-shift","to":"iv-zone2-running","attrs":{"dimension":"timing","adjustment":"Use daylight exposure at the start of the waking period as part of the session where the shift pattern allows.","reason":"Combining light exposure with training gets a circadian benefit out of a session that was happening anyway."},"citations":["AASM practice parameters - shift work disorder (2007)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|CAUTIONS|iv-time-restricted-eating","type":"CAUTIONS","from":"md-night-shift","to":"iv-time-restricted-eating","attrs":{"caveat":"Standard eating windows assume a day-aligned schedule. Applied to a night shift, the protocol can end up concentrating food at the circadian low point.","severity":"mild","resolution":"If used at all, align the window to the waking period rather than to clock hours, and expect the metabolic evidence to transfer poorly."},"citations":["AASM practice parameters - shift work disorder (2007)","ADA Standards of Care (2024) - physical activity"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|ADJUSTS|iv-time-restricted-eating","type":"ADJUSTS","from":"md-night-shift","to":"iv-time-restricted-eating","attrs":{"dimension":"timing","adjustment":"Anchor the window to waking rather than to the clock, and keep the overnight period as light as the shift allows.","reason":"The evidence base assumes circadian alignment that a night shift does not provide, so the protocol needs restating rather than transplanting."},"citations":["ADA Standards of Care (2024) - physical activity"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-night-shift|ELEVATES|iv-sleep-regularity","type":"ELEVATES","from":"md-night-shift","to":"iv-sleep-regularity","attrs":{"priority_delta":"large","reason":"Sleep regularity is the variable most damaged by shift work and the one with the widest downstream effect on everything else in the plan."},"citations":["AASM practice parameters - shift work disorder (2007)","AASM/SRS consensus - recommended sleep duration (2015)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming|ELEVATES|iv-swimming","type":"ELEVATES","from":"md-prefers-swimming","to":"iv-swimming","attrs":{"priority_delta":"large","reason":"Preference is a legitimate input, not a compromise. Adherence is one of the axes effectiveness is judged on, and a moderately effective intervention sustained for a decade beats a theoretically superior one abandoned in a month."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","Attia, Outlive (2023) - author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming|ELEVATES|iv-rowing","type":"ELEVATES","from":"md-prefers-swimming","to":"iv-rowing","attrs":{"priority_delta":"small","reason":"The nearest land-based match on movement pattern and impact, useful as the fallback when the pool is closed."},"citations":["ACSM Guidelines for Exercise Testing and Prescription, 11th ed. (2021)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming|ELEVATES|iv-resistance-training","type":"ELEVATES","from":"md-prefers-swimming","to":"iv-resistance-training","attrs":{"priority_delta":"moderate","reason":"Swimming does not load bone. Making resistance training the deliberate complement is what keeps a swimming-centred plan from having a hole in it."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming|CAUTIONS|iv-swimming","type":"CAUTIONS","from":"md-prefers-swimming","to":"iv-swimming","attrs":{"caveat":"The gap is bone. Swimming is non-weight-bearing, so a plan built around it needs an explicit loading component rather than assuming one.","severity":"mild","resolution":"Keep swimming as the aerobic centre of the plan and add two resistance sessions a week to cover what it does not."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-swimming|ADJUSTS|iv-zone2-running","type":"ADJUSTS","from":"md-prefers-swimming","to":"iv-zone2-running","attrs":{"dimension":"dose","adjustment":"Keep a small amount of weight-bearing work - even two short runs or walks a week - rather than dropping it entirely.","reason":"The aerobic dose is fully covered by swimming; the residual reason to keep any running is skeletal loading, and it takes very little."},"citations":["Bone Health and Osteoporosis Foundation Clinician's Guide (2022)","US Physical Activity Guidelines Advisory Committee Report (2018)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-outdoors|ELEVATES|iv-hiking","type":"ELEVATES","from":"md-prefers-outdoors","to":"iv-hiking","attrs":{"priority_delta":"moderate","reason":"Directly matches the stated preference, and uneven terrain adds a balance stimulus indoor work does not."},"citations":["US Physical Activity Guidelines Advisory Committee Report (2018)","Cochrane - exercise for preventing falls in older people (2019)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"msk-modifiers.json"},{"id":"md-prefers-outdoors|ELEVATES|iv-rucking","type":"ELEVATES","from":"md-prefers-outdoors","to":"iv-rucking","attrs":{"priority_delta":"moderate","reason":"Outdoor, weight-bearing, and combines aerobic and loading work in one session."},"citations":["Knapik et al. - load carriage physiology and injury, Military Medicine","Attia, Outlive (2023) - author position"],"last_reviewed":"2026 const N = new Map(GRAPH.nodes.map(n => [n.id, n]));
const E = GRAPH.edges;
const byType = t => E.filter(e => e.type === t);
const nodesOf = t => GRAPH.nodes.filter(n => n.type === t);
const title = id => N.get(id)?.title ?? id;

/* ---------- ordinal scales: declaration order IS the ordering ------------- */
const ORD = {
  effect_size:['none','small','moderate','large'],
  evidence_strength:['none','low','moderate','high'],
  certainty:['low','moderate','high'],
  adherence_realism:['low','moderate','high'],
  effort:['trivial','low','moderate','high'],
  priority_delta:['none','small','moderate','large'],
};
const rank = (scale, v) => { const i = ORD[scale].indexOf(v); return i < 0 ? -1 : i; };
const PRECEDENCE = { BLOCKS:1, REQUIRES:2, ADJUSTS:3, CAUTIONS:4, ELEVATES:5 };

const factNodes = [...nodesOf('Modifier'), ...nodesOf('RiskFactor')];
const facts = new Set();

const PRESETS = [
  ['I want to swim, and my heel hurts', ['md-prefers-swimming','md-plantar-fasciitis']],
  ['Chronic back pain, want to get fitter', ['md-chronic-low-back-pain']],
  ['Pre-diabetic, deskbound, no gym', ['rf-prediabetes','md-no-gym-access','md-time-poor']],
  ['Knee osteoarthritis in a hot climate', ['md-knee-osteoarthritis','md-hot-humid-climate']],
  ['Low bone density, older adult', ['md-osteoporosis','md-older-adult']],
  ['Chest pain when I exert myself', ['md-exertional-chest-pain']],
];

/* ---------- resolver — see prototype/ARCHITECTURE.md §Modifier resolution -- */
function resolve(functionId) {
  const supports = byType('SUPPORTS').filter(e => e.to === functionId);
  const active = [...facts];

  const collect = ivId => E.filter(e =>
    PRECEDENCE[e.type] && active.includes(e.from) &&
    (e.to === ivId || (e.to === '*' && e.type === 'BLOCKS')));

  // Phase 4 — fold in precedence order. Only BLOCKS is terminal; REQUIRES /
  // ADJUSTS / CAUTIONS accumulate. ELEVATES takes max, never a sum.
  function fold(ivId) {
    const applied = collect(ivId).sort((a, b) =>
      PRECEDENCE[a.type] - PRECEDENCE[b.type] || a.from.localeCompare(b.from));

    let state = 'available', promotion = null, redFlag = null, suppress = false;

    for (const e of applied) {
      const a = e.attrs ?? {};
      const text = a.resolution_text ?? a.caveat ?? a.adjustment ?? a.reason ?? '';
      trail.push({ type:e.type, modifier:e.from, text, citations:e.citations ?? [],
                   dimension:a.dimension, escalates:a.escalates_to, when:a.escalation_when });
      if (e.type === 'BLOCKS') {
        state = 'blocked';
        if (a.routing === 'clinician') redFlag = e;
        if (a.suppress_substitutes) suppress = true;
      } else if (e.type === 'REQUIRES') {
        if (state === 'available') state = 'sequenced';
        if (a.prerequisite_node_id) prereqs.set(a.prerequisite_node_id, e.from);
      } else if (e.type === 'ADJUSTS') {
        if (state === 'available') state = 'adjusted';
        const d = a.dimension ?? 'other';
        if (!adjustments.has(d)) adjustments.set(d, []);
        adjustments.get(d).push({ text:a.adjustment ?? text, by:e.from });
      } else if (e.type === 'CAUTIONS') {
        if (state === 'available') state = 'cautioned';
      } else if (e.type === 'ELEVATES') {
        const d = rank('priority_delta', a.priority_delta ?? 'moderate');
        if (!promotion || d > promotion.delta)
          promotion = { delta:d, by:e.from, reason:a.reason ?? '' };
      }
    }
    return { state, trail, prereqs, adjustments, promotion, redFlag, suppress };
  }

  const rows = supports.map(s => ({ id:s.from, node:N.get(s.from), support:s, ...fold(s.from) }))
                       .filter(r => r.node);

  // substitute-of-a-substitute is a content smell, not a feature.
  for (const r of rows.filter(r => r.state === 'blocked' && !r.suppress)) {
    r.substitutes = byType('SUBSTITUTES')
      .filter(e => e.from === r.id &&
        (!e.attrs?.serves_function_id || e.attrs.serves_function_id === functionId))
      .map(e => ({ to:e.to, delta:e.attrs?.effect_delta, reason:e.attrs?.reason }))
      .filter(s => N.has(s.to) && fold(s.to).state !== 'blocked');
  }

  // Phase 6 — Pareto tiers over (effect_size, evidence_strength).
  const live = rows.filter(r => r.state !== 'blocked');
  const pair = r => [rank('effect_size', r.support.attrs?.effect_size),
                     rank('evidence_strength', r.support.attrs?.evidence_strength)];
  const dominates = (a, b) => {
    const [ae, av] = pair(a), [be, bv] = pair(b);
    return ae >= be && av >= bv && (ae > be || av > bv);
  };
  let pool = [...live], depth = 0;
  while (pool.length) {
    const front = pool.filter(a => !pool.some(b => b !== a && dominates(b, a)));
    if (!front.length) { pool.forEach(r => r.tier = depth); break; }
    front.forEach(r => r.tier = depth);
    pool = pool.filter(r => !front.includes(r));
    depth++;
  }
  // Promotion: at most one tier, never past the top, always labelled.
  for (const r of live) if (r.promotion && r.tier > 0) { r.tier -= 1; r.promoted = true; }

  const maxTier = live.reduce((m, r) => Math.max(m, r.tier ?? 0), 0);
  const grouped = [];
  for (let i = 0; i <= maxTier; i++) {
    const members = live.filter(r => r.tier === i).sort((a, b) =>
      rank('certainty', b.support.attrs?.certainty) - rank('certainty', a.support.attrs?.certainty) ||
      rank('adherence_realism', b.support.attrs?.adherence_realism) - rank('adherence_realism', a.support.attrs?.adherence_realism) ||
      rank('effort', a.support.attrs?.effort) - rank('effort', b.support.attrs?.effort) ||
      a.id.localeCompare(b.id));
    if (members.length) grouped.push(members);
  }
  return { grouped, blocked: rows.filter(r => r.state === 'blocked') };
}

/* ---------- rendering ----------------------------------------------------- */
const AXES = ['effect_size','evidence_strength','certainty','time_to_effect','cost','risk','effort','reversibility','adherence_realism'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sysId = 'sys-cardiovascular', fnId = null;

function functionsOf(system) {
  return byType('PART_OF').filter(e => e.to === system)
    .map(e => N.get(e.from)).filter(n => n && n.type === 'Function');
}
function systems() {
  const el = document.getElementById('systems');
  el.innerHTML = nodesOf('System').map(s =>
    `<button data-sys="${s.id}" aria-pressed="${s.id===sysId}">${esc(s.title)}</button>`).join('');
  el.onclick = ev => { const b = ev.target.closest('button'); if (!b) return;
    sysId = b.dataset.sys; fnId = null; render(); };
}
function fnTabs() {
  const fns = functionsOf(sysId);
  if (!fnId || !fns.some(f => f.id === fnId)) fnId = fns[0]?.id ?? null;
  const el = document.getElementById('fns');
  el.innerHTML = fns.map(f =>
    `<button class="fn-tab" data-fn="${f.id}" aria-pressed="${f.id===fnId}">${esc(f.title)}</button>`).join('');
  el.onclick = ev => { const b = ev.target.closest('button'); if (!b) return;
    fnId = b.dataset.fn; render(); };
}
function axesHtml(s) {
  return `<div class="axes">` + AXES.map(k => {
    const v = s.attrs?.[k];
    return v == null
      ? `<span class="ax hole" title="Missing cell — a hole in the content, shown rather than hidden">${k.replace(/_/g,' ')}: —</span>`
      : `<span class="ax">${k.replace(/_/g,' ')} <b>${esc(v)}</b></span>`;
  }).join('') + `</div>`;
}
function trailHtml(r) {
  if (!r.trail.length) return '';
  const items = r.trail.map(t => `
    <li><span class="who ${t.type}">${t.type}</span>
      &nbsp;·&nbsp;<b>${esc(title(t.modifier))}</b>${t.dimension ? ` <i>(${esc(t.dimension)})</i>` : ''}
      <div>${esc(t.text)}</div>
      ${t.escalates ? `<div class="note">Escalates to ${esc(t.escalates)} when ${esc(JSON.stringify(t.when))}</div>` : ''}
      ${t.citations.length ? `<div class="cite">${t.citations.map(esc).join(' · ')}</div>` : ''}
    </li>`).join('');
  return `<details><summary>Why this changed — ${r.trail.length} modification${r.trail.length>1?'s':''}, with sources</summary><ul class="trail">${items}</ul></details>`;
}
function attiaHtml(s) {
  const a = s.attrs ?? {};
  if (!a.attia_position && !a.consensus_note) return '';
  return `<div class="attia">${a.attia_position ? `<b>Attia's position:</b> ${esc(a.attia_position)}<br>` : ''}
    ${a.consensus_note ? `<b>Where the evidence sits:</b> ${esc(a.consensus_note)}` : ''}</div>`;
}
function cardHtml(r) {
  const prereq = [...r.prereqs.entries()].map(([p, by]) =>
    `<li>First: <b>${esc(title(p))}</b> — required by ${esc(title(by))}</li>`).join('');
  const adj = [...r.adjustments.entries()].map(([dim, list]) =>
    `<li><b>${esc(dim)}</b>${list.length > 1 ? ' <i>(two modifiers — both shown, prose is never merged)</i>' : ''}
      <ul>${list.map(x => `<li>${esc(x.text)} <span class="cite">— ${esc(title(x.by))}</span></li>`).join('')}</ul></li>`).join('');
  return `<div class="card ${r.state}">
    <h4>${esc(r.node.title)}
      <span class="state ${r.state}">${r.state}</span>
      ${r.promoted ? `<span class="moved">↑ moved up because of ${esc(title(r.promotion.by))}</span>` : ''}
    </h4>
    <p class="summary">${esc(r.node.summary)}</p>
    ${axesHtml(r.support)}
    ${r.support.attrs?.dose ? `<div class="note"><b>Dose:</b> ${esc(r.support.attrs.dose)}</div>` : ''}
    ${prereq ? `<div class="subs"><b>Sequence before starting:</b><ul>${prereq}</ul></div>` : ''}
    ${adj ? `<div class="subs"><b>Adjustments:</b><ul>${adj}</ul></div>` : ''}
    ${attiaHtml(r.support)}
    ${trailHtml(r)}
  </div>`;
}
function blockedHtml(r) {
  const subs = (r.substitutes ?? []).map(s =>
    `<li><b>${esc(title(s.to))}</b> — ${esc(s.delta ?? 'comparable')} effect. ${esc(s.reason ?? '')}</li>`).join('');
  return `<div class="card blocked">
    <h4>${esc(r.node.title)}<span class="state blocked">blocked</span></h4>
    <p class="summary">${esc(r.node.summary)}</p>
    ${trailHtml(r)}
    ${subs ? `<div class="subs"><b>Serves the same function:</b><ul>${subs}</ul></div>`
           : r.suppress ? `<div class="subs">No alternatives offered — this needs clinical evaluation first.</div>` : ''}
  </div>`;
}
function markersHtml() {
  const ms = byType('MEASURED_BY').filter(e => e.from === fnId);
  if (!ms.length) return '';
  const elevated = new Set(E.filter(e => e.type === 'ELEVATES' && facts.has(e.from)).map(e => e.to));
  const rows = ms.map(e => ({ e, m:N.get(e.to) })).filter(x => x.m)
    // Reference methods first: 'A' < 'B' < 'C' < 'D' ascending.
    .sort((a, b) => String(a.e.attrs?.quality_tier ?? 'D').localeCompare(String(b.e.attrs?.quality_tier ?? 'D')));
  return `<h3>How you'd measure this</h3>
    <p class="note">Tier A is a reference method. Tier C is a consumer estimate — useful for your
    own trend, unreliable in absolute terms. Tier D is self-report. Noise is what decides how long
    an n-of-1 experiment has to run before it can detect anything at all.</p>
    <table><thead><tr><th>Tier</th><th>Marker</th><th>Noise</th><th>Cost</th><th>Get it via</th></tr></thead><tbody>
    ${rows.map(({e, m}) => {
      const a = m.attrs ?? {};
      return `<tr><td><span class="tierbadge ${esc(e.attrs?.quality_tier ?? 'D')}">${esc(e.attrs?.quality_tier ?? '?')}</span></td>
        <td><b>${esc(m.title)}</b>${elevated.has(m.id) ? ` <span class="moved">↑ prioritised by your facts</span>` : ''}
          <div class="note">${esc(a.what_it_estimates ?? m.summary ?? '')}</div></td>
        <td>${esc(e.attrs?.noise ?? a.noise ?? '—')}</td><td>${esc(a.cost ?? '—')}</td>
        <td>${esc([].concat(a.ingestible_via ?? []).join(', ') || '—')}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function renderFacts() {
  const el = document.getElementById('facts');
  if (!facts.size) {
    el.innerHTML = '<span class="note">Nothing stated yet — showing the unmodified baseline.</span>';
    return;
  }
  el.innerHTML = [...facts].map(id => {
    const n = N.get(id);
    return `<span class="chip ${n?.attrs?.category === 'red_flag' ? 'redflag' : ''}" data-id="${esc(id)}">${esc(n?.title ?? id)}<button title="remove">×</button></span>`;
  }).join('');
  el.onclick = ev => { const c = ev.target.closest('.chip'); if (!c) return;
    facts.delete(c.dataset.id); render(); };
}

function render() {
  document.getElementById('hdr').textContent =
    `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} edges · v0.1.0-prototype · ${facts.size} fact${facts.size===1?'':'s'} active`;
  renderFacts(); systems(); fnTabs();

  const flags = [...facts].map(f => N.get(f)).filter(n => n?.attrs?.category === 'red_flag');
  const rf = document.getElementById('redflag');
  rf.innerHTML = flags.length ? `<div class="banner">
      <h3>Stop — this needs a clinician, not a plan</h3>
      ${flags.map(f => {
        const b = E.find(e => e.type === 'BLOCKS' && e.from === f.id);
        return `<p><b>${esc(f.title)}</b>: ${esc(b?.attrs?.reason ?? b?.attrs?.resolution_text ?? f.summary)}</p>`;
      }).join('')}
      <p class="note">Plan generation is halted across every intervention and no alternatives are
      offered. This is the one place the system is deliberately directive — and the direction is
      toward a doctor.</p></div>` : '';

  const out = document.getElementById('out'), mk = document.getElementById('markers');
  if (flags.length) { out.innerHTML = ''; mk.innerHTML = ''; return; }
  if (!fnId) { out.innerHTML = '<p class="empty">No function selected.</p>'; mk.innerHTML = ''; return; }

  const { grouped, blocked } = resolve(fnId);
  const fn = N.get(fnId);
  const protects = byType('PROTECTS').filter(e => e.from === fnId).map(e => title(e.to));
  out.innerHTML = `<h2>${esc(fn.title)}</h2><p class="summary">${esc(fn.summary)}</p>
    ${protects.length ? `<p class="note"><b>Protects:</b> ${protects.map(esc).join(' · ')}</p>` : ''}
    ${grouped.map((t, i) => `<div class="tier"><h3>Tier ${i+1}</h3>
       <span>${t.length} option${t.length>1?'s':''} — incomparable to one another, not ranked within</span></div>
       ${t.map(cardHtml).join('')}`).join('')}
    ${blocked.length ? `<div class="tier"><h3>Ruled out by your facts</h3>
       <span>shown, never silently removed</span></div>${blocked.map(blockedHtml).join('')}` : ''}`;
  mk.innerHTML = markersHtml();
}

const qEl = document.getElementById('q'), sEl = document.getElementById('suggest');
qEl.oninput = () => {
  const v = qEl.value.trim().toLowerCase();
  if (!v) { sEl.hidden = true; return; }
  const words = v.split(/\s+/).filter(w => w.length > 2);
  const hits = factNodes.filter(n => {
    if (facts.has(n.id)) return false;
    const hay = `${n.title} ${n.summary ?? ''} ${n.attrs?.category ?? ''} ${n.id}`.toLowerCase();
    return hay.includes(v) || (words.length > 0 && words.some(w => hay.includes(w)));
  }).slice(0, 24);
  sEl.hidden = false;
  sEl.innerHTML = hits.length
    ? hits.map(n => `<div class="sug" data-id="${esc(n.id)}"><div class="cat">${esc(n.attrs?.category ?? n.type)}</div>${esc(n.title)}</div>`).join('')
    : '<div class="sug">Nothing in the graph matches that yet.</div>';
};
sEl.onclick = ev => { const s = ev.target.closest('.sug'); if (!s?.dataset.id) return;
  facts.add(s.dataset.id); qEl.value = ''; sEl.hidden = true; render(); };

document.getElementById('presets').innerHTML = PRESETS.map((p, i) =>
  `<button class="preset" data-i="${i}">${esc(p[0])}</button>`).join('');
document.getElementById('presets').onclick = ev => {
  const b = ev.target.closest('.preset'); if (!b) return;
  facts.clear(); PRESETS[+b.dataset.i][1].forEach(f => { if (N.has(f)) facts.add(f); }); render();
};

render();
</script>
</body>
</html>
