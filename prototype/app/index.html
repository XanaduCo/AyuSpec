ue with poor sequencing is a recognised and common injury mechanism in rowers."},"citations":["Yoshiga & Higuchi, Eur J Appl Physiol 2003","Thornton et al. Clin J Sport Med 2017 — rowing injuries","Bull et al. Br J Sports Med 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rowing|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-rowing","to":"fn-mitochondrial-function","attrs":{"effect_size":"moderate","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Steady blocks of 40–60 minutes at conversational intensity, 3 times weekly.","honest_downgrade":"Transferred physiology rather than rowing-specific evidence. Rated low for the same reason as the swimming equivalent — the mitochondrial literature is cycling and running."},"citations":["Holloszy & Coyle, J Appl Physiol 1984","Granata et al. Sports Med 2018","Yoshiga & Higuchi, Eur J Appl Physiol 2003"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rucking|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-rucking","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Start at roughly 10 percent of body weight for 30–45 minutes, twice weekly. Progress load or distance, never both in the same week, and hold total weekly increases near 10 percent. Military load-carriage data show injury incidence climbing steeply with load, distance and rate of progression.","why_it_works":"Adds enough metabolic cost to walking to produce a genuine training stimulus while keeping walking's adherence profile and low technical demand.","risk_note":"Moderate rather than low: load carriage raises foot, knee, hip and low back injury rates well above unloaded walking, and blisters and shoulder issues are near-universal at first."},"citations":["Knapik et al. Mil Med 2004 — load carriage physiology and injury","Orr et al. Appl Ergon 2014 — load carriage injury risk","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rucking|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-rucking","to":"fn-body-composition","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Two to three loaded walks weekly of 45–60 minutes at 10–20 percent of body weight, within an overall energy deficit if fat loss is the goal.","reasoning":"Energy cost is meaningfully higher than unloaded walking, and the loading gives a mild stimulus to the posterior chain. Direct trial evidence for body composition change from rucking specifically is thin — most of the load-carriage literature is about injury and performance in military populations, not about civilian body composition."},"citations":["Knapik et al. Mil Med 2004","Orr et al. Appl Ergon 2014","Careau et al. Curr Biol 2021"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-hiking|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-hiking","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"One to two outings weekly of 90 minutes or more with meaningful elevation gain. Grade does most of the work: the same pace uphill can double the metabolic cost.","adherence_advantage":"Frequently sustained for decades because it is recreation, not training. The graph rates adherence realism high for this reason even though the session count is low.","risk_note":"Moderate, driven almost entirely by descent — eccentric loading, uneven ground and fatigue late in a long day are where ankles and knees are injured. Remote terrain also raises the consequence of any incident."},"citations":["Mitten et al. Am J Lifestyle Med 2018","Gatterer et al. Int J Environ Res Public Health 2021","Bull et al. Br J Sports Med 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-hiking|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-hiking","to":"fn-mitochondrial-function","attrs":{"effect_size":"moderate","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"low","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Long outings of two hours or more at low intensity — arguably the most natural way anyone accumulates the sustained low-intensity duration that the Zone 2 argument is built on.","note":"Rated low evidence as transferred physiology. Worth surfacing because a weekend hiker may already be doing more of this than a person following a structured Zone 2 plan, and the graph should be able to tell them so."},"citations":["Gatterer et al. Int J Environ Res Public Health 2021","Holloszy & Coyle, J Appl Physiol 1984","San-Millán & Brooks, Sports Med 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-stair-climbing|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-stair-climbing","to":"fn-aerobic-capacity","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"low","effort":"low","reversibility":"reversible","adherence_realism":"high","dose":"Three bouts per day of one to two minutes of brisk ascent, most days; or three sets of 60 stair-climbing sprints weekly, which is roughly the protocol used in the small trials that show VO2max gains.","why_it_is_interesting":"One of the few interventions that requires no equipment, no clothing change and no scheduled time, which makes it available to people for whom every other option fails on logistics.","evidence_caveat":"Small trials with fitness endpoints, plus new accelerometer cohorts on brief vigorous bursts. The cohort work is observational and vulnerable to reverse causation — people who bound up stairs are healthier already."},"citations":["Allison et al. Med Sci Sports Exerc 2017 — brief stair-climbing sprints","Boreham et al. Br J Sports Med 2005","Stamatakis et al. Nat Med 2022 — vigorous intermittent lifestyle physical activity"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-stair-climbing|SUPPORTS|fn-cardiac-efficiency","type":"SUPPORTS","from":"iv-stair-climbing","to":"fn-cardiac-efficiency","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"months","cost":"free","risk":"low","effort":"low","reversibility":"reversible","adherence_realism":"high","dose":"Daily short vigorous bouts over months.","honest_position":"Weak. Total volume is low, and the cardiac remodelling literature deals with far larger training doses. Included as an honest small entry rather than omitted, so a user relying on stairs alone can see where it sits."},"citations":["Boreham et al. Br J Sports Med 2005","Stamatakis et al. Nat Med 2022","Fletcher et al. Circulation 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-elliptical|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-elliptical","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"low","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"3–4 sessions weekly of 40–60 minutes at conversational intensity, or with interval structure. Resistance and incline settings should be raised rather than cadence, which otherwise drifts up while effort drifts down.","reasoning":"Certainty is moderate while evidence is low: the acute physiological responses closely match treadmill exercise at matched effort, so the training effect should follow. Outcome trials with elliptical training specifically are scarce.","substitution_role":"Its value in this graph is almost entirely as an impact-free stand-in for running. Boredom is the main adherence threat and is worth naming explicitly."},"citations":["Green et al. J Strength Cond Res 2004","Egaña et al. Eur J Appl Physiol 2010","Bull et al. Br J Sports Med 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-elliptical|SUPPORTS|fn-mitochondrial-function","type":"SUPPORTS","from":"iv-elliptical","to":"fn-mitochondrial-function","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"low","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Steady 45-minute blocks at low intensity, 3 times weekly.","honest_position":"Transferred physiology with essentially no modality-specific evidence. Rated low on both axes rather than borrowing the cycling rating."},"citations":["Green et al. J Strength Cond Res 2004","Holloszy & Coyle, J Appl Physiol 1984","Granata et al. Sports Med 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-protein-intake|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-protein-intake","to":"fn-body-composition","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"low","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Roughly 1.6 g/kg/day is where the meta-analytic benefit for lean mass with resistance training plateaus. Distribute across 3–4 meals of 25–40 g rather than concentrating at dinner. During an energy deficit, protein needs go up, not down — this is the input that decides whether the weight lost is fat or muscle.","attia_position":"Attia recommends about 1 g per pound of body weight daily, roughly 2.2 g/kg — above the RDA by nearly three times and above the point where added benefit has been demonstrated.","consensus_note":"The RDA of 0.8 g/kg is a deficiency-prevention floor and is genuinely too low for an ageing person who trains; older-adult consensus groups already recommend 1.0–1.2 g/kg. The evidence supports going higher than the RDA. It does not currently demonstrate additional lean-mass benefit above roughly 1.6 g/kg, so the higher target is recorded as an author position rather than folded into the rating. Intakes at that level appear safe in normal kidney function, but safe is not the same as better.","cost_note":"Cost rated low rather than free because hitting these targets from whole food is genuinely more expensive than not, and this is a real barrier the frame should not hide."},"citations":["Morton et al. Br J Sports Med 2018 — protein supplementation and resistance training meta-analysis","Bauer et al. JAMDA 2013 — PROT-AGE recommendations","Institute of Medicine Dietary Reference Intakes 2005","Attia, Outlive (2023), ch. 15 — protein intake — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-protein-intake|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-protein-intake","to":"fn-glycemic-control","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"immediate","cost":"low","risk":"low","effort":"low","reversibility":"reversible","adherence_realism":"moderate","dose":"20–30 g of protein eaten before or alongside the carbohydrate portion of a meal blunts the glucose excursion in small crossover studies.","honest_downgrade":"The acute meal-order and protein-preload effects are real in small trials with surrogate endpoints. Whether habitually doing this improves any durable measure of glycaemic control is untested, and the wider claim circulating in this audience runs well ahead of the data."},"citations":["Shukla et al. Diabetes Care 2015 — food order and postprandial glucose","Nesti et al. Nutrients 2019 — protein preload and glycaemic response","ADA Standards of Care in Diabetes 2025 — nutrition therapy"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-fiber-intake|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-fiber-intake","to":"fn-lipid-transport","attrs":{"effect_size":"small","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"low","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"5–10 g/day of viscous soluble fibre — oats, barley, psyllium, legumes — within a total of 25–35 g/day. Ramp over several weeks; increasing quickly reliably produces bloating and abandonment.","magnitude_honesty":"Expect single-digit percentage LDL-C reduction. Well replicated, genuinely worth doing, and roughly an order of magnitude smaller than statin therapy. Presenting it as an alternative to lipid-lowering treatment for someone who needs treatment would be the harmful reading of this edge."},"citations":["Brown et al. Am J Clin Nutr 1999 — soluble fibre and cholesterol meta-analysis","Reynolds et al. Lancet 2019 — carbohydrate quality and health","US 2020–2025 Dietary Guidelines for Americans"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-fiber-intake|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-fiber-intake","to":"fn-glycemic-control","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"low","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"25–35 g/day total, with the highest-fibre choice made at the carbohydrate-heaviest meal. Whole intact grains beat milled ones at equal fibre grams.","evidence_quality":"Among the strongest dietary edges in this graph — prospective cohorts and randomised trials both point the same way, with a dose-response, which is unusual in nutrition.","mechanism":"Slows gastric emptying and carbohydrate absorption; the fermentable fraction produces short-chain fatty acids with additional metabolic signalling."},"citations":["Reynolds et al. Lancet 2019 — carbohydrate quality and human health","Reynolds et al. PLoS Med 2020 — fibre and glycaemic control in diabetes","ADA Standards of Care in Diabetes 2025 — nutrition therapy"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-fiber-intake|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-fiber-intake","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"low","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"25–35 g/day sustained. Cereal fibre specifically carries the strongest cohort association with lower diabetes incidence.","confounding_caveat":"High fibre intake travels with a great deal else — less processed food, more vegetables, higher socioeconomic status. The cohort signal is consistent, and residual confounding is not excluded."},"citations":["Reynolds et al. Lancet 2019","InterAct Consortium, Diabetologia 2015 — dietary fibre and type 2 diabetes","Weickert & Pfeiffer, J Nutr 2018 — fibre and insulin sensitivity mechanisms"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-insulin-sensitivity","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"low","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"A sustained deficit producing 5–10 percent body weight loss over 3–6 months. Five percent already improves hepatic and adipose insulin sensitivity measurably; each further increment adds more, with no plateau found up to about 16 percent in graded studies.","why_adherence_is_rated_low":"Regain is the modal outcome and is physiologically defended by falling energy expenditure and rising appetite signalling. This is a statement about biology, not willpower, and the frame should present it that way.","risk_note":"Rated low rather than negligible: applied to someone without excess adiposity this becomes harmful, and rapid loss without adequate protein and resistance training costs lean mass."},"citations":["Magkos et al. Cell Metab 2016 — graded weight loss and metabolic function","Knowler et al. NEJM 2002","Look AHEAD Research Group, NEJM 2013","Hall & Kahan, Med Clin North Am 2018 — maintenance of lost weight"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-liver-health","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-liver-health","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"low","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"3–5 percent weight loss reduces hepatic steatosis; 7–10 percent is the threshold associated with improvement in steatohepatitis; roughly 10 percent or more is where fibrosis regression starts appearing.","speed":"Hepatic fat falls faster than almost anything else in this graph — substantial reductions are measurable on MRI-PDFF within two to four weeks, well before the scale moves much.","guideline_status":"Weight loss is the first-line recommendation in the MASLD guideline, with these thresholds stated explicitly — one of the few places where an intervention and its dose-response are both formally endorsed."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Vilar-Gomez et al. Gastroenterology 2015 — weight loss and histological response in NASH","Lean et al. Lancet 2018 — DiRECT"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-glycemic-control","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"For prevention, 5–7 percent loss plus 150 minutes weekly of activity — the DPP protocol, which cut progression to diabetes by 58 percent. For remission in recent-onset type 2 diabetes, 15 kg or roughly 15 percent, as in DiRECT.","magnitude":"The largest single effect in this entire graph. DPP outperformed metformin; DiRECT achieved remission in 46 percent at one year.","risk_note":"Rated moderate because in someone taking insulin or a sulfonylurea, rapid improvement in glycaemic control without medication adjustment causes hypoglycaemia. That is a medication-supervision matter, and the modifier edges that encode it are owned elsewhere in the graph."},"citations":["Knowler et al. NEJM 2002","Lean et al. Lancet 2018 and Lancet Diabetes Endocrinol 2019 — DiRECT","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-body-composition","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"months","cost":"free","risk":"moderate","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"A deficit of roughly 500 kcal/day, with protein held at 1.6 g/kg or above and resistance training maintained throughout. Without those two guardrails, a quarter or more of the weight lost is lean mass.","visceral_priority":"Visceral fat falls preferentially early in a deficit, which means the metabolic benefit arrives ahead of the cosmetic one — worth telling people, because the mirror lags the bloodwork.","risk_note":"Moderate: lean mass loss, and in older adults the accompanying bone loss, are real harms of unguarded weight loss."},"citations":["Magkos et al. Cell Metab 2016","Cava et al. Adv Nutr 2017 — preserving lean mass during weight loss","Verheggen et al. Obes Rev 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"low","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"Roughly 1 mmHg systolic reduction per kilogram lost, holding across a wide range in meta-analysis — one of the cleaner dose-response relationships in lifestyle medicine.","note":"Effect regresses with regain, on approximately the same slope."},"citations":["Neter et al. Hypertension 2003 — weight reduction and blood pressure meta-analysis","Whelton et al. 2017 ACC/AHA Hypertension Guideline","Look AHEAD Research Group, NEJM 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-energy-balance-weight-loss|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-energy-balance-weight-loss","to":"fn-lipid-transport","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"low","effort":"high","reversibility":"reversible","adherence_realism":"low","dose":"Weight loss of 5–10 percent. Triglycerides fall substantially; ApoB and LDL-C move much less.","expectation_management":"A frequent surprise: someone loses 10 kg, transforms their triglycerides and HDL-C, and finds ApoB barely moved. That is the expected result, not a failure, and the interface should say so before the labs come back."},"citations":["Dattilo & Kris-Etherton, Am J Clin Nutr 1992 — weight reduction and lipids meta-analysis","Magkos et al. Cell Metab 2016","2018 AHA/ACC/Multisociety Cholesterol Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-added-sugar-reduction|SUPPORTS|fn-liver-health","type":"SUPPORTS","from":"iv-added-sugar-reduction","to":"fn-liver-health","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Eliminate sugar-sweetened beverages first, then bring total added sugar below 10 percent of energy. Randomised fructose restriction reduced liver fat measurably within roughly eight weeks even with weight held stable.","mechanism":"Liquid fructose is delivered rapidly to the liver and preferentially routed to de novo lipogenesis.","confounding_caveat":"In most trials the sugar reduction also reduces total energy, so isolating a sugar-specific effect is difficult. The weight-stable trials are the strongest evidence here and they are small."},"citations":["Schwarz et al. Gastroenterology 2017 — fructose restriction and hepatic fat","EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Malik & Hu, J Am Coll Cardiol 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-added-sugar-reduction|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-added-sugar-reduction","to":"fn-glycemic-control","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"high","time_to_effect":"immediate","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Remove sugar-sweetened drinks entirely; they are the single largest source of rapidly absorbed carbohydrate in most diets and they do not reduce subsequent eating.","visible_immediately":"The change is visible on a CGM trace the same day, which makes this a strong candidate for a short n-of-1 alongside post-meal walking.","evidence_note":"Certainty high, evidence moderate: the acute glycaemic effect is not in doubt; the long-run outcome data are cohort-based with the usual confounding by overall diet quality."},"citations":["Malik & Hu, J Am Coll Cardiol 2015","Imamura et al. BMJ 2015 — sugar-sweetened beverages and type 2 diabetes","US 2020–2025 Dietary Guidelines for Americans"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-added-sugar-reduction|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-added-sugar-reduction","to":"fn-lipid-transport","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Below 10 percent of energy from added sugar, ideally below 5 percent.","specificity":"The effect concentrates on triglycerides and on the small dense particle fraction rather than on total ApoB, which limits how much of the atherogenic burden it moves."},"citations":["Te Morenga et al. Am J Clin Nutr 2014 — sugars and lipids meta-analysis","Malik & Hu, J Am Coll Cardiol 2015","WHO Guideline on sugars intake 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-alcohol-reduction|SUPPORTS|fn-liver-health","type":"SUPPORTS","from":"iv-alcohol-reduction","to":"fn-liver-health","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"low","effort":"moderate","reversibility":"partial","adherence_realism":"moderate","dose":"Toward zero where any steatosis is present. Hepatic fat and transaminases improve within weeks of abstinence; the benefit scales with the amount removed.","reversibility_note":"Rated partial rather than reversible because steatosis and inflammation improve while established fibrosis and cirrhosis largely do not. Where you are on that path determines what stopping can buy back.","risk_note":"Low rather than negligible only because abrupt cessation in physical dependence is medically dangerous and needs supervision."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Åberg et al. Hepatology 2020 — alcohol and liver outcomes in fatty liver disease","WHO 2023 statement on alcohol"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-alcohol-reduction|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-alcohol-reduction","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"free","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"In people drinking more than about two drinks daily, halving intake lowers systolic pressure by roughly 5 mmHg within weeks, with a clear dose-response above that.","evidence_quality":"One of the better-supported lifestyle effects on blood pressure — meta-analysed randomised reduction trials, not just observational data."},"citations":["Roerecke et al. Lancet Public Health 2017 — alcohol reduction and blood pressure meta-analysis","Whelton et al. 2017 ACC/AHA Hypertension Guideline","Biddinger et al. JAMA Netw Open 2022"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-alcohol-reduction|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-alcohol-reduction","to":"fn-glycemic-control","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"days","cost":"free","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Reduction from moderate or heavy intake; the mechanism runs largely through the calories, the disrupted sleep and the food eaten alongside rather than through glucose handling directly.","honest_position":"Weak and indirect. Alcohol acutely lowers rather than raises glucose by suppressing hepatic output, so the story here is not the simple one people expect."},"citations":["Steiner et al. Nutrients 2015 — alcohol and glucose metabolism","Biddinger et al. JAMA Netw Open 2022","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-time-restricted-eating|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-time-restricted-eating","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"free","risk":"low","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"An 8–10 hour eating window, ideally ending in the early evening. Early windows outperform late ones on glycaemic measures in small crossover trials; late windows are what people actually manage.","honest_downgrade":"Rated small and low deliberately, against the weight of enthusiasm this intervention carries in the longevity community. When calories are matched, the added benefit over eating the same food across a longer window is small or absent. Its practical value is as a way of eating less without counting — which is a real benefit, but a different claim from the metabolic one usually made.","attia_note":"Attia has publicly revised his earlier enthusiasm for fasting protocols, citing lean-mass loss — a rare and worth-recording case of an author position moving toward the evidence rather than away from it.","risk_note":"Low rather than negligible: compressed windows reduce protein intake in practice, and in people on insulin or sulfonylureas a long fast is a hypoglycaemia risk."},"citations":["Lowe et al. JAMA Intern Med 2020 — TREAT randomised trial","Liu et al. NEJM 2022 — calorie restriction with or without time restriction","Sutton et al. Cell Metab 2018 — early time-restricted feeding","Attia, The Drive — revised position on fasting — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-time-restricted-eating|SUPPORTS|fn-body-composition","type":"SUPPORTS","from":"iv-time-restricted-eating","to":"fn-body-composition","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"moderate","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"8–10 hour window sustained daily, with deliberate attention to hitting protein targets inside it.","what_the_trials_found":"TREAT produced modest weight loss versus control, and a significant share of the loss was lean mass. A larger trial found no added benefit over matched calorie restriction alone.","risk_note":"Rated moderate on risk specifically because of the lean-mass signal — this intervention sits in direct tension with the protein-intake edge, and the graph should show that rather than list them as complementary."},"citations":["Lowe et al. JAMA Intern Med 2020","Liu et al. NEJM 2022","Cava et al. Adv Nutr 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-mediterranean-pattern|SUPPORTS|fn-vascular-health","type":"SUPPORTS","from":"iv-mediterranean-pattern","to":"fn-vascular-health","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"years","cost":"moderate","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Whole-pattern adoption: extra-virgin olive oil as the primary fat, nuts most days, legumes and fish several times weekly, vegetables at most meals, minimal processed meat and refined grain.","evidence_note":"PREDIMED reported roughly a 30 percent relative reduction in major cardiovascular events — the strongest trial evidence for any dietary pattern and a hard endpoint.","the_asterisk":"PREDIMED was retracted and republished in 2018 after protocol deviations in randomisation at some sites. The republished analysis preserved direction and magnitude, and the flaw is real. Rated moderate rather than high on exactly this basis; a trial that had to be reanalysed is not the same evidentiary object as one that did not.","adherence_advantage":"Rated high — it is a cuisine rather than a protocol, and people stay on it for years."},"citations":["Estruch et al. NEJM 2018 — PREDIMED, republished","Rees et al. Cochrane Database Syst Rev 2019","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-mediterranean-pattern|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-mediterranean-pattern","to":"fn-lipid-transport","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"moderate","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Sustained pattern adoption, with saturated fat displaced by monounsaturated and polyunsaturated sources.","magnitude_honesty":"Modest effect on ApoB — the pattern's cardiovascular benefit in PREDIMED was larger than its lipid changes could explain, which suggests the mechanism is not primarily lipid-mediated."},"citations":["Estruch et al. NEJM 2018","Mensink et al. Am J Clin Nutr 2003 — dietary fatty acids and lipoproteins meta-analysis","2018 AHA/ACC/Multisociety Cholesterol Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-mediterranean-pattern|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-mediterranean-pattern","to":"fn-glycemic-control","attrs":{"effect_size":"small","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"moderate","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"high","dose":"Sustained pattern adoption. The PREDIMED cohort showed lower incident diabetes in the intervention arms, a prespecified secondary outcome.","note":"Part of the effect is attributable to the fibre and the displacement of refined carbohydrate, which are separately represented in this graph — the edges are not fully independent and the ranking should not double-count them."},"citations":["Salas-Salvadó et al. Ann Intern Med 2014 — Mediterranean diet and diabetes prevention in PREDIMED","Estruch et al. NEJM 2018","ADA Standards of Care in Diabetes 2025 — nutrition therapy"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-duration|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-sleep-duration","to":"fn-insulin-sensitivity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"days","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"7–9 hours of sleep opportunity nightly. Experimental restriction to 4–5 hours reduced measured insulin sensitivity by a large margin within under a week in healthy young adults.","speed":"Among the fastest-acting interventions here — days, not months. Also among the fastest to reverse.","evidence_shape":"Strong short-term experimental data plus consistent cohort associations; what is missing is a trial showing that extending habitually short sleep produces durable metabolic benefit, which is a much harder study to run.","effort_note":"Rated moderate rather than trivial. For anyone with young children, shift work or insomnia, 'sleep more' is not a low-effort instruction, and treating it as free advice is a failure of realism."},"citations":["Spiegel et al. Lancet 1999 — sleep debt and metabolic function","Cappuccio et al. Diabetes Care 2010 — sleep duration and incident diabetes","Watson et al. Sleep 2015 — AASM/SRS consensus"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-duration|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-sleep-duration","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"7–9 hours nightly; the observational association between short sleep and hypertension is consistent but modest.","confounding_caveat":"Undiagnosed obstructive sleep apnoea confounds this relationship heavily and is itself a major treatable cause of hypertension. A user with short, fragmented sleep and high blood pressure should be pointed at that question rather than told to go to bed earlier."},"citations":["Gangwisch et al. Hypertension 2006 — short sleep duration and incident hypertension","Watson et al. Sleep 2015","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-regularity|SUPPORTS|fn-glycemic-control","type":"SUPPORTS","from":"iv-sleep-regularity","to":"fn-glycemic-control","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"moderate","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Consistent bed and wake times within roughly 30–60 minutes night to night, including weekends. Laboratory circadian misalignment protocols impair glucose tolerance independently of total sleep time.","evidence_stage":"Strong mechanistic support and consistent but young observational data. No trial has randomised people to a regularity target with metabolic endpoints, so this is rated low evidence with moderate certainty — the physiology is convincing, the clinical demonstration is missing."},"citations":["Scheer et al. PNAS 2009 — circadian misalignment and metabolic consequences","Huang et al. Diabetes Care 2019 — sleep irregularity and metabolic risk","Windred et al. Sleep 2024 — sleep regularity and mortality"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-sleep-regularity|SUPPORTS|fn-insulin-sensitivity","type":"SUPPORTS","from":"iv-sleep-regularity","to":"fn-insulin-sensitivity","attrs":{"effect_size":"small","evidence_strength":"low","certainty":"low","time_to_effect":"weeks","cost":"free","risk":"negligible","effort":"moderate","reversibility":"reversible","adherence_realism":"moderate","dose":"Fixed wake time is the more tractable anchor than fixed bedtime, and it drags bedtime along with it.","note":"Shift workers show elevated diabetes risk in cohorts, which is the strongest real-world evidence for this pathway — and it is also the population least able to act on the advice."},"citations":["Huang et al. Diabetes Care 2019","Gan et al. Occup Environ Med 2015 — shift work and type 2 diabetes meta-analysis","Scheer et al. PNAS 2009"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-smoking-cessation|SUPPORTS|fn-vascular-health","type":"SUPPORTS","from":"iv-smoking-cessation","to":"fn-vascular-health","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"months","cost":"free","risk":"negligible","effort":"high","reversibility":"partial","adherence_realism":"low","dose":"Complete cessation. Partial reduction delivers far less than proportional benefit — the dose-response for cardiovascular risk is steeply non-linear at the low end, so cutting from 20 to 5 a day retains much more risk than the arithmetic suggests.","magnitude":"Excess cardiovascular risk falls substantially within one to two years and approaches never-smoker levels over roughly 10–15 years for most endpoints.","reversibility_note":"Partial, not full: risk falls a long way but does not entirely return to baseline for every endpoint, and existing plaque does not disappear.","adherence_note":"Rated low honestly. Most quit attempts fail and repeated attempts are the normal route to success — a fact that belongs in the frame rather than in a motivational aside.","priority_note":"If this edge applies to a user, it dominates every other cardiovascular intervention in this graph."},"citations":["US Surgeon General Report 2020 — Smoking Cessation","Duncan et al. JAMA 2019 — smoking cessation and cardiovascular risk","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-smoking-cessation|SUPPORTS|fn-aerobic-capacity","type":"SUPPORTS","from":"iv-smoking-cessation","to":"fn-aerobic-capacity","attrs":{"effect_size":"moderate","evidence_strength":"moderate","certainty":"moderate","time_to_effect":"months","cost":"free","risk":"negligible","effort":"high","reversibility":"partial","adherence_realism":"low","dose":"Complete cessation. Carbon monoxide clears within a day and oxygen carrying capacity normalises quickly; the decline in lung function slows to a normal age-related rate but does not reverse.","reversibility_note":"Partial: the accelerated component of decline stops, the lost function does not come back."},"citations":["US Surgeon General Report 2020","Anthonisen et al. Am J Respir Crit Care Med 2002 — smoking cessation and lung function decline","2018 Physical Activity Guidelines Advisory Committee Scientific Report (US HHS)"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-lipid-lowering-adherence|SUPPORTS|fn-lipid-transport","type":"SUPPORTS","from":"iv-lipid-lowering-adherence","to":"fn-lipid-transport","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"low","risk":"low","effort":"trivial","reversibility":"reversible","adherence_realism":"moderate","dose":"Take the prescribed agent as prescribed, and recheck ApoB roughly 6–12 weeks after any change. Effect is fully present within weeks and disappears within weeks of stopping.","magnitude":"Roughly a 22 percent reduction in major vascular events per 1 mmol/L of LDL-C lowering, per year of treatment, with benefit compounding over years.","comparison_honesty":"No dietary or exercise intervention in this graph comes close to this effect on atherogenic particle count. Ranking them as comparable options would be the dishonest move, and the graph declines to make it.","effort_versus_adherence":"Effort is trivial — one tablet. Adherence realism is only moderate, because roughly half of people stop within a year. That gap between effort and adherence is itself the interesting finding, and blinded rechallenge work suggests much of the symptom burden driving discontinuation is not pharmacological.","scope_boundary":"This edge is about adherence to an existing prescription. Drug selection, initiation and dosing are out of scope by design."},"citations":["Cholesterol Treatment Trialists' Collaboration, Lancet 2010 and 2012","Wood et al. NEJM 2020 — SAMSON n-of-1 statin symptom trial","2018 AHA/ACC/Multisociety Cholesterol Guideline","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-lipid-lowering-adherence|SUPPORTS|fn-vascular-health","type":"SUPPORTS","from":"iv-lipid-lowering-adherence","to":"fn-vascular-health","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"years","cost":"low","risk":"low","effort":"trivial","reversibility":"partial","adherence_realism":"moderate","dose":"Sustained treatment over years. Benefit accrues with duration — the event-reduction curves separate slowly and keep separating.","the_calcium_paradox":"Statin treatment can increase measured coronary calcium score while reducing events, because it stabilises and calcifies soft plaque. Anyone tracking CAC while on treatment needs this explained in advance or they will read a good outcome as a bad one.","reversibility_note":"Partial — plaque stabilisation and modest regression are achievable; established structural disease is not undone."},"citations":["Cholesterol Treatment Trialists' Collaboration, Lancet 2010","Puri et al. J Am Coll Cardiol 2015 — statin therapy and coronary plaque calcification","Greenland et al. JACC 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-bp-control-adherence|SUPPORTS|fn-blood-pressure-regulation","type":"SUPPORTS","from":"iv-bp-control-adherence","to":"fn-blood-pressure-regulation","attrs":{"effect_size":"large","evidence_strength":"high","certainty":"high","time_to_effect":"weeks","cost":"low","risk":"low","effort":"trivial","reversibility":"reversible","adherence_realism":"moderate","dose":"Take as prescribed and confirm with averaged home readings rather than clinic values. Roughly 10 mmHg systolic reduction corresponds to about a fifth fewer major cardiovascular events, with a larger relative effect on stroke.","risk_note":"Low rather than negligible: over-treatment causes orthostatic hypotension and falls, which matters more with age than the blood pressure number does.","measurement_pairing":"Pairs with home cuff measurement — the intervention is unverifiable without it, and clinic readings are the wrong instrument for judging it."},"citations":["Ettehad et al. Lancet 2016","SPRINT Research Group, NEJM 2015","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-bp-control-adherence|SUPPORTS|fn-vascular-health","type":"SUPPORTS","from":"iv-bp-control-adherence","to":"fn-vascular-health","attrs":{"effect_size":"moderate","evidence_strength":"high","certainty":"high","time_to_effect":"years","cost":"low","risk":"low","effort":"trivial","reversibility":"partial","adherence_realism":"moderate","dose":"Sustained control over years. Benefit for stroke and small-vessel disease accrues with duration of control rather than with any single reading.","cognitive_dividend":"SPRINT MIND found fewer cases of mild cognitive impairment under intensive control — among the few randomised cognitive signals available anywhere in this graph."},"citations":["Ettehad et al. Lancet 2016","SPRINT MIND Investigators, JAMA 2019","Gorelick et al. Stroke 2011"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes|ELEVATES|iv-post-meal-walking","type":"ELEVATES","from":"rf-prediabetes","to":"iv-post-meal-walking","attrs":{"priority_delta":"large","reason":"In prediabetes the post-meal excursion is where the dysfunction actually lives, so an intervention that directly blunts it does far more work here than it does in someone with normal glucose handling. It is also the cheapest thing on the list, which is why it moves to the top rather than merely up.","measurement_shift":"Pairs with CGM rather than with HbA1c — the effect is same-day and a quarterly average cannot see it."},"citations":["Buffey et al. Sports Med 2022","Reynolds et al. Diabetologia 2016","Colberg et al. Diabetes Care 2016"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"rf-prediabetes","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"large","reason":"The DPP protocol — 5–7 percent weight loss plus 150 minutes weekly of activity — cut progression to diabetes by 58 percent in exactly this population, outperforming metformin. There is no comparable direct evidence for any other intervention in this graph at this state.","dose_specificity":"The 5–7 percent target is a tested number in this population, not an extrapolation."},"citations":["Knowler et al. NEJM 2002","Diabetes Prevention Program Outcomes Study, Lancet Diabetes Endocrinol 2015","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes|ELEVATES|iv-fiber-intake","type":"ELEVATES","from":"rf-prediabetes","to":"iv-fiber-intake","attrs":{"priority_delta":"moderate","reason":"Fibre's effect concentrates on post-meal glucose handling, which is the impaired mechanism here, and cereal fibre carries the strongest cohort association with lower diabetes incidence. Cheap, low-risk, and pointed at the right target."},"citations":["Reynolds et al. Lancet 2019","InterAct Consortium, Diabetologia 2015","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes|ELEVATES|fn-insulin-sensitivity","type":"ELEVATES","from":"rf-prediabetes","to":"fn-insulin-sensitivity","attrs":{"priority_delta":"large","reason":"Prediabetes is by definition the state where this function has already degraded but the outcome has not yet arrived. It is the highest-yield window in the whole graph — the same interventions applied here have a several-fold larger absolute effect than they do in someone with normal glucose tolerance.","measurement_shift":"Moves the honest marker set toward Tier A and B — OGTT, HbA1c, fasting insulin, CGM — and away from the Tier C consumer signals that would otherwise dominate the dashboard."},"citations":["Knowler et al. NEJM 2002","Tabák et al. Lancet 2012 — prediabetes as a high-risk state","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-prediabetes|ELEVATES|mk-cgm-variability","type":"ELEVATES","from":"rf-prediabetes","to":"mk-cgm-variability","attrs":{"priority_delta":"moderate","reason":"At this state, the day-shape of glucose carries information that a quarterly HbA1c destroys by averaging. CGM is also the only marker fast enough to let the user run a meaningful two-week experiment on their own meals.","caveat":"Interpretation thresholds for people without diabetes are not standardised, so it should be read as a personal before-and-after rather than against a published range."},"citations":["Battelino et al. Diabetes Care 2019","Shah et al. J Clin Endocrinol Metab 2019","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-type2-diabetes|ELEVATES|fn-glycemic-control","type":"ELEVATES","from":"rf-type2-diabetes","to":"fn-glycemic-control","attrs":{"priority_delta":"large","reason":"The function has failed by definition; everything downstream — retinopathy, nephropathy, neuropathy, and roughly a doubling of cardiovascular risk — tracks cumulative glycaemic exposure from here.","medication_interaction":"Several interventions in this graph interact with glucose-lowering drugs. Those are modifier edges owned elsewhere, and they must resolve before any of this is presented as a plan."},"citations":["ADA Standards of Care in Diabetes 2025","Emerging Risk Factors Collaboration, Lancet 2010","Lean et al. Lancet 2018"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-type2-diabetes|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"rf-type2-diabetes","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"large","reason":"In recent-onset type 2 diabetes, weight loss of roughly 15 kg produced remission in nearly half of participants at one year in DiRECT. Remission is an available outcome here, which is not true of most chronic disease and is not widely enough known.","window":"The remission effect is much larger within the first few years of diagnosis, so the priority is time-sensitive rather than merely high."},"citations":["Lean et al. Lancet 2018 and Lancet Diabetes Endocrinol 2019","Look AHEAD Research Group, NEJM 2013","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-type2-diabetes|ELEVATES|iv-lipid-lowering-adherence","type":"ELEVATES","from":"rf-type2-diabetes","to":"iv-lipid-lowering-adherence","attrs":{"priority_delta":"large","reason":"Diabetes roughly doubles cardiovascular risk, so the absolute benefit of a given reduction in atherogenic particles is roughly doubled too. This is the clearest case in the graph of a metabolic risk factor sharpening a cardiovascular intervention rather than a metabolic one."},"citations":["Emerging Risk Factors Collaboration, Lancet 2010","Cholesterol Treatment Trialists' Collaboration, Lancet 2008 — statin efficacy in diabetes","ADA Standards of Care in Diabetes 2025 — cardiovascular risk management"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-apob|ELEVATES|iv-lipid-lowering-adherence","type":"ELEVATES","from":"rf-elevated-apob","to":"iv-lipid-lowering-adherence","attrs":{"priority_delta":"large","reason":"Absolute risk reduction from lowering scales with baseline particle burden, so the same proportional reduction buys more when ApoB is high. Where a prescription already exists, adherence is the single highest-yield action available.","honesty_note":"This edge sharpens adherence to existing treatment. Whether treatment should be started is a clinical decision the graph does not make."},"citations":["Cholesterol Treatment Trialists' Collaboration, Lancet 2010","Sniderman et al. JAMA Cardiol 2019","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-apob|ELEVATES|fn-lipid-transport","type":"ELEVATES","from":"rf-elevated-apob","to":"fn-lipid-transport","attrs":{"priority_delta":"large","reason":"Cumulative particle-years is the exposure that drives plaque, so a high level compounds every year it persists. This is the strongest argument in the graph for acting early rather than waiting for a risk calculator to catch up with age.","attia_position":"Attia argues for driving ApoB far below guideline thresholds and starting decades earlier than guidelines contemplate.","consensus_note":"Direction agreed and well supported by Mendelian randomisation. The aggressive absolute target in low-risk primary prevention is untested against outcomes, and the yearly absolute benefit for a young low-risk person is small even where the lifetime case is strong. Recorded as elevated priority with a moderate rather than high evidence footing for the specific target."},"citations":["Ference et al. Eur Heart J 2017","Sniderman et al. JAMA Cardiol 2019","Attia, Outlive (2023), ch. 7 — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-apob|ELEVATES|mk-apob","type":"ELEVATES","from":"rf-elevated-apob","to":"mk-apob","attrs":{"priority_delta":"moderate","reason":"Once known to be elevated, ApoB rather than LDL-C becomes the number worth tracking through any change, because it is the one that reflects the causal exposure and does not mislead in insulin-resistant physiology.","interval":"Recheck 6–12 weeks after any intervention change; more often reads assay and biological noise."},"citations":["Sniderman et al. JAMA Cardiol 2019","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-lpa|ELEVATES|iv-lipid-lowering-adherence","type":"ELEVATES","from":"rf-elevated-lpa","to":"iv-lipid-lowering-adherence","attrs":{"priority_delta":"large","reason":"Lp(a) cannot currently be lowered by anything in this graph, and it does not respond to diet or exercise. The rational response to a risk you cannot remove is to work harder on the ones you can, which in practice means driving ApoB lower than you otherwise would.","honesty_note":"This is a compensatory strategy, not a treatment for Lp(a). No completed outcome trial yet shows that lowering Lp(a) itself reduces events, and this edge should not be read as implying otherwise."},"citations":["Kronenberg et al. Eur Heart J 2022 — EAS consensus on Lp(a)","2019 ESC/EAS Guidelines for the Management of Dyslipidaemias","Emerging Risk Factors Collaboration, JAMA 2009"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-lpa|ELEVATES|fn-vascular-health","type":"ELEVATES","from":"rf-elevated-lpa","to":"fn-vascular-health","attrs":{"priority_delta":"moderate","reason":"An inherited, unmodifiable atherogenic exposure raises the value of knowing the actual state of the arterial wall rather than relying on a risk estimate that may not fully account for it.","measurement_shift":"Strengthens the case for imaging — CAC — in someone whose calculated risk score looks unremarkable."},"citations":["Kronenberg et al. Eur Heart J 2022","Greenland et al. JACC 2018","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-family-history-early-cad|ELEVATES|fn-lipid-transport","type":"ELEVATES","from":"rf-family-history-early-cad","to":"fn-lipid-transport","attrs":{"priority_delta":"large","reason":"Named as a risk-enhancing factor in the primary prevention guideline, used precisely to move borderline decisions. It also raises the prior for both familial hypercholesterolaemia and elevated Lp(a), each of which changes what should be measured.","what_it_should_trigger":"ApoB rather than LDL-C alone, a once-in-a-lifetime Lp(a), and an earlier conversation about imaging than age alone would prompt."},"citations":["2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease — risk-enhancing factors","Lloyd-Jones et al. Circulation 2004","Kronenberg et al. Eur Heart J 2022"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-family-history-early-cad|ELEVATES|mk-cac-score","type":"ELEVATES","from":"rf-family-history-early-cad","to":"mk-cac-score","attrs":{"priority_delta":"moderate","reason":"Family history is one of the situations where a calculated risk score is least trustworthy and direct imaging adds the most — it is the canonical use case for reclassifying someone off the fence.","consensus_note":"ACC/AHA supports CAC for exactly this borderline-risk decision; USPSTF found the evidence insufficient overall. The disagreement is real and the interface should show it rather than pick a side silently."},"citations":["Greenland et al. JACC 2018","USPSTF, JAMA 2018 — nontraditional risk factors, I statement","2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-low-vo2max-percentile|ELEVATES|iv-zone2-running","type":"ELEVATES","from":"rf-low-vo2max-percentile","to":"iv-zone2-running","attrs":{"priority_delta":"large","reason":"The steepest part of the fitness-mortality gradient is between the bottom quartile and the one above it, and the untrained also gain the most VO2max per unit of training. Both the effect and the return are largest exactly here.","practical_note":"For someone in the bottom quartile, walking may be the honest starting point and running the twelve-week destination. The graph should sequence rather than prescribe."},"citations":["Mandsager et al. JAMA Netw Open 2018","Kodama et al. JAMA 2009","Milanović et al. Sports Med 2015"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-low-vo2max-percentile|ELEVATES|iv-vo2max-intervals","type":"ELEVATES","from":"rf-low-vo2max-percentile","to":"iv-vo2max-intervals","attrs":{"priority_delta":"large","reason":"Interval work raises VO2max faster per training hour than continuous exercise, which matters most when the starting point is low and the mortality gradient is steepest.","safety_counterweight":"The same population has the highest transient cardiac risk from abrupt vigorous exertion. Priority up, onset gradual — this is the clearest case in the graph where an elevated priority still needs a staged entry."},"citations":["Milanović et al. Sports Med 2015","Weston et al. Br J Sports Med 2014","Franklin et al. Circulation 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-low-vo2max-percentile|ELEVATES|fn-aerobic-capacity","type":"ELEVATES","from":"rf-low-vo2max-percentile","to":"fn-aerobic-capacity","attrs":{"priority_delta":"large","reason":"Observational hazard ratios for bottom-quartile fitness exceed those for smoking, diabetes and hypertension in the same cohorts. Whatever the causal share turns out to be, this is the largest measured gap most users will have.","attia_position":"Attia treats moving out of the bottom quartile as the highest-yield act in preventive medicine.","consensus_note":"The gradient is genuine and consistent. It is observational: reverse causation from subclinical disease is incompletely excluded, and no trial has randomised people to a fitness target with a mortality endpoint. Priority is elevated on a strong association, not on demonstrated causation, and the interface should carry that distinction rather than round it off."},"citations":["Mandsager et al. JAMA Netw Open 2018","Kodama et al. JAMA 2009","Ross et al. Circulation 2016","Attia, Outlive (2023), ch. 11 — author position"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-visceral-adiposity|ELEVATES|iv-energy-balance-weight-loss","type":"ELEVATES","from":"rf-visceral-adiposity","to":"iv-energy-balance-weight-loss","attrs":{"priority_delta":"large","reason":"Visceral and hepatic fat are mobilised preferentially and early in an energy deficit, so the metabolic return per kilogram lost is highest in exactly the people carrying fat in this compartment.","normal_weight_note":"Applies at normal BMI too. Someone lean by the scale with a high waist and a fatty liver benefits from this edge, which a weight-based rule would miss entirely."},"citations":["Magkos et al. Cell Metab 2016","Neeland et al. Lancet Diabetes Endocrinol 2019","Ross et al. Nat Rev Endocrinol 2020"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-visceral-adiposity|ELEVATES|fn-liver-health","type":"ELEVATES","from":"rf-visceral-adiposity","to":"fn-liver-health","attrs":{"priority_delta":"moderate","reason":"Visceral adiposity is the dominant driver of hepatic steatosis, and fibrosis stage — not steatosis — is what predicts mortality. The presence of one makes checking for the other worthwhile.","cheap_first_step":"FIB-4 is computable from labs most users already have, so the first move costs nothing and no extra blood."},"citations":["EASL-EASD-EASO 2024 Clinical Practice Guideline on MASLD","Sterling et al. Hepatology 2006","Neeland et al. Lancet Diabetes Endocrinol 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-hypertension|ELEVATES|iv-bp-control-adherence","type":"ELEVATES","from":"rf-hypertension","to":"iv-bp-control-adherence","attrs":{"priority_delta":"large","reason":"Absolute benefit from lowering scales with starting pressure, and the lifestyle interventions in this graph deliver only a fraction of what treatment does at stage 2. Where a prescription exists, adherence is the highest-yield action.","measurement_pairing":"Unverifiable without averaged home readings; clinic values are the wrong instrument for judging control."},"citations":["Ettehad et al. Lancet 2016","SPRINT Research Group, NEJM 2015","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-hypertension|ELEVATES|iv-alcohol-reduction","type":"ELEVATES","from":"rf-hypertension","to":"iv-alcohol-reduction","attrs":{"priority_delta":"moderate","reason":"Among the lifestyle levers, alcohol reduction has one of the best-evidenced and fastest blood pressure effects in people drinking more than about two units daily — roughly 5 mmHg systolic from halving intake, within weeks.","conditionality":"Only elevated if the person actually drinks. In a non-drinker this edge should not appear at all."},"citations":["Roerecke et al. Lancet Public Health 2017","Whelton et al. 2017 ACC/AHA Hypertension Guideline"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-hypertension|ELEVATES|fn-blood-pressure-regulation","type":"ELEVATES","from":"rf-hypertension","to":"fn-blood-pressure-regulation","attrs":{"priority_delta":"large","reason":"The function is already impaired and the damage it causes is silent and cumulative across the arteries, kidneys and brain simultaneously. Few other single functions in this graph protect three outcome families at once.","threshold_note":"The 130/80 threshold is the ACC/AHA position; ESC/ESH labels at 140/90. The disagreement is about where to draw a line on a continuous risk curve, not about the direction — worth showing the user rather than resolving silently."},"citations":["Whelton et al. 2017 ACC/AHA Hypertension Guideline","Ettehad et al. Lancet 2016","SPRINT MIND Investigators, JAMA 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-hba1c|ELEVATES|iv-added-sugar-reduction","type":"ELEVATES","from":"rf-elevated-hba1c","to":"iv-added-sugar-reduction","attrs":{"priority_delta":"moderate","reason":"Rapidly absorbed liquid carbohydrate is the largest single contributor to glycaemic exposure in most diets that produce an elevated HbA1c, and removing it is a discrete, achievable change rather than a diffuse instruction to eat better."},"citations":["Malik & Hu, J Am Coll Cardiol 2015","Imamura et al. BMJ 2015","ADA Standards of Care in Diabetes 2025"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"rf-elevated-hba1c|ELEVATES|fn-glycemic-control","type":"ELEVATES","from":"rf-elevated-hba1c","to":"fn-glycemic-control","attrs":{"priority_delta":"large","reason":"An elevated HbA1c is a late signal — it moves only after years of compensatory hyperinsulinaemia. By the time it is abnormal, the process is well advanced and the case for acting is correspondingly stronger.","measurement_shift":"Warrants adding a marker that can see the shape of a day, since a quarterly average cannot show which meals or which times are responsible."},"citations":["Tabák et al. Lancet 2009","ADA Standards of Care in Diabetes 2025","Battelino et al. Diabetes Care 2019"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-zone2-running","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"moderate","baseline_incidence":"roughly 2–10 injuries per 1000 hours of running in recreational runners, with novices at the high end of that range and up to a quarter to a third of new runners injured within their first year","severity_note":"Mostly self-limiting overuse injury — tendinopathy, patellofemoral pain, shin pain. A minority (bone stress injury) requires months away from loading.","incidence_note":"Risk concentrates in the first three months and in weeks where volume rises quickly. It is not evenly distributed across the year, so an annual average understates the early danger.","modifiers_that_raise_it":["rapid volume progression","prior injury at the same site","downhill-heavy routes","abrupt surface change","body weight","inadequate recovery"],"why_it_is_authored":"This is the single largest reason a running programme fails. Leaving it out of the comparison frame would make running look strictly better than swimming, which is not true."},"citations":["Videbæk et al. Sports Med 2015 — incidence of running-related injuries per 1000 hours","Nielsen et al. Int J Sports Phys Ther 2012 — training errors and running injury","van Gent et al. Br J Sports Med 2007 — injuries in long-distance runners"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|RISK_OF|out-adv-cardiac-event-exertion","type":"RISK_OF","from":"iv-zone2-running","to":"out-adv-cardiac-event-exertion","attrs":{"severity":"severe","baseline_incidence":"very low in absolute terms — on the order of one cardiac arrest per 100,000 to 200,000 hours of vigorous exertion in adults, and roughly one per 100,000 participants in long-distance running events","severity_note":"Catastrophic when it happens, which is why it appears at all despite the tiny incidence.","incidence_note":"Habitual exercise substantially lowers overall cardiac risk; the transient elevation during exertion is real and is greatest in people who are habitually sedentary and start abruptly. Zone 2 by definition is not vigorous for a trained person, so this edge applies mainly at initiation.","modifiers_that_raise_it":["known coronary disease","exertional chest pain","unexplained syncope","sedentary baseline","abrupt onset of vigorous intensity"],"red_flag_note":"Exertional chest pain or syncope is a clinician-routing matter, authored as a blocking modifier edge elsewhere in the graph."},"citations":["Franklin et al. Circulation 2020 — exercise-related acute cardiovascular events","Kim et al. NEJM 2012 — cardiac arrest during long-distance running races","Albert et al. NEJM 2000 — triggering of sudden death by vigorous exertion"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-zone2-running|RISK_OF|out-adv-heat-illness","type":"RISK_OF","from":"iv-zone2-running","to":"out-adv-heat-illness","attrs":{"severity":"moderate","baseline_incidence":"uncommon in temperate conditions; rises steeply with heat and humidity, and event-day rates in hot races can reach several cases per 1000 participants","severity_note":"Ranges from heat exhaustion, which resolves with rest and cooling, to exertional heat stroke, which is a medical emergency with meaningful mortality if cooling is delayed.","incidence_note":"Humidity matters more than temperature because it is what blocks evaporative cooling. Acclimatisation over roughly 10–14 days substantially reduces risk.","modifiers_that_raise_it":["hot and humid conditions","poor acclimatisation","dehydration","anticholinergic or diuretic medication","older age","recent illness"],"note":"Duration-heavy Zone 2 sessions carry more cumulative heat exposure than short hard sessions, so the long easy run is the one that gets people in the heat."},"citations":["Casa et al. J Athl Train 2015 — NATA position statement on exertional heat illnesses","Racinais et al. Br J Sports Med 2015 — consensus on training and competing in the heat"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|RISK_OF|out-adv-cardiac-event-exertion","type":"RISK_OF","from":"iv-vo2max-intervals","to":"out-adv-cardiac-event-exertion","attrs":{"severity":"severe","baseline_incidence":"very low absolute risk, but the transient relative risk during vigorous exertion is elevated several-fold over rest and is highest in the habitually inactive","severity_note":"Cardiac arrest or infarction. Rare and catastrophic.","incidence_note":"This is the intervention in the graph where the transient risk is highest, because it is by design maximal-effort work. The correct response is graded entry after a base of easy volume, not avoidance — habitual vigorous exercisers have lower overall risk than the sedentary.","modifiers_that_raise_it":["sedentary baseline","known or suspected coronary disease","exertional symptoms","age over 50 starting intervals without a base","extreme heat"]},"citations":["Franklin et al. Circulation 2020","Albert et al. NEJM 2000","Fletcher et al. Circulation 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-vo2max-intervals|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-vo2max-intervals","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"moderate","baseline_incidence":"higher per hour than steady-state training at the same modality; interval sessions concentrate high tissue loading into a short window","severity_note":"Acute muscle strains alongside the usual overuse pattern. Hamstring and calf strains are the characteristic injuries.","incidence_note":"Total exposure hours are low, so the per-week absolute risk can still be modest. Adequate warm-up and limiting to one or two sessions weekly are the main mitigations.","modifiers_that_raise_it":["no aerobic base","inadequate warm-up","prior hamstring or calf injury","more than two hard sessions weekly","running as the chosen interval modality rather than cycling or rowing"]},"citations":["Buchheit & Laursen, Sports Med 2013 — high-intensity interval training programming","Videbæk et al. Sports Med 2015","Weston et al. Br J Sports Med 2014"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|RISK_OF|out-adv-drowning","type":"RISK_OF","from":"iv-swimming","to":"out-adv-drowning","attrs":{"severity":"severe","baseline_incidence":"very low in supervised pools; substantially higher in open water, and higher again when swimming alone or after alcohol","severity_note":"Fatal or causing hypoxic brain injury. Unlike every other adverse outcome attached to an aerobic intervention in this graph, there is no mild version worth planning around.","incidence_note":"The absolute rate for a competent adult swimming lengths in a lifeguarded pool is very small. The rate is not small for open-water swimming alone, for weak swimmers, or where a cardiac or seizure event occurs in the water — the same event that would be survivable on land is often not survivable in water.","modifiers_that_raise_it":["open water","swimming alone","no lifeguard","poor stroke competence","cold water","alcohol","seizure disorder","cardiac arrhythmia","shallow-water blackout from breath-hold training"],"why_this_matters_for_ranking":"Swimming has the lowest musculoskeletal risk of any aerobic modality and the only fatal tail risk. A single averaged risk band would hide both facts. The frame should show swimming as low-risk for injury and requiring a specific safety context — supervised water, competent stroke, never alone — rather than collapsing it to one word."},"citations":["WHO Global Report on Drowning 2014 and drowning fact sheet 2024","Szpilman et al. NEJM 2012 — drowning","Bierens et al. Br J Sports Med 2016 — drowning prevention in open water"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-swimming|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-swimming","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"mild","baseline_incidence":"low overall; shoulder pain is the characteristic complaint and affects a substantial minority of people who swim high weekly volume, particularly with freestyle-dominant training","severity_note":"Almost entirely overuse shoulder pain — impingement-type symptoms that respond to volume reduction, stroke correction and scapular strengthening. Rarely disabling.","incidence_note":"Per hour, the lowest musculoskeletal risk of any aerobic modality in this graph, which is precisely why swimming is the substitute of choice when lower-limb injury blocks running.","modifiers_that_raise_it":["high weekly volume","freestyle-only stroke selection","hand paddles","pre-existing shoulder pathology","poor body roll"]},"citations":["Wanivenhaus et al. Sports Health 2012 — epidemiology of swimming injuries","Tanaka H. Int J Sports Med 2009","Gomez-Bruton et al. Sports Med 2013"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-cycling|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-cycling","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"moderate","baseline_incidence":"low overuse injury rate per hour compared with running; the dominant risk outdoors is traumatic, from collisions and falls, and varies enormously with local road environment","severity_note":"Overuse complaints are minor — knee pain from poor bike fit, neck and low back discomfort. Collision trauma is the severe tail and is a road-environment property, not a training-load one.","incidence_note":"Indoor cycling removes the traumatic risk almost entirely, which is a meaningful and often overlooked reason to prefer it in a hostile traffic environment.","modifiers_that_raise_it":["heavy traffic without separated infrastructure","poor bike fit","riding at night","wet conditions","no helmet"]},"citations":["Oja et al. Scand J Med Sci Sports 2011","de Rome et al. Accid Anal Prev 2014 — cycling injury patterns","Celis-Morales et al. BMJ 2017"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rucking|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-rucking","to":"out-adv-musculoskeletal-injury","attrs":{"severity":"moderate","baseline_incidence":"clearly higher than unloaded walking; military load-carriage cohorts report substantial rates of foot blistering, low back pain, knee pain and stress injury, rising steeply with load mass, distance and rate of progression","severity_note":"Mostly foot and soft-tissue problems and low back pain. Bone stress injury and rucksack palsy — a traction injury to the brachial plexus from shoulder straps — are the more serious tail.","incidence_note":"Load, distance and speed multiply rather than add. The military literature is the best available source and comes from young populations under compulsion, so it likely understates risk in older recreational users progressing on their own.","modifiers_that_raise_it":["load above roughly 20 percent of body weight","increasing load and distance in the same week","poor pack fit","low back pain history","unsupportive footwear"]},"citations":["Knapik et al. Mil Med 2004","Orr et al. Appl Ergon 2014 — load carriage injury risk factors","Roy et al. Mil Med 2010 — load carriage and musculoskeletal complaints"],"last_reviewed":"2026-07-29","review_status":"provisional","_src":"cardio-metabolic.json"},{"id":"iv-rowing|RISK_OF|out-adv-musculoskeletal-injury","type":"RISK_OF","from":"iv-rowing","to":"out-adv-musculoskeletal-injury","attrs":{"
